provider_id = "bedrock"
display_name = "Amazon Bedrock"
kind = "bedrock"
website_url = "https://aws.amazon.com/bedrock/"

[defaults]
context_window = 128000
max_output_tokens = 16384

[defaults.capabilities]
text_input = true
text_output = true
tool_use = true
structured_outputs = true

# Amazon Bedrock exposes a large, fast-moving set of Anthropic models (and per-region
# inference-profile IDs such as `us.`/`eu.`/`apac.` prefixes). Membership is driven by the
# live Bedrock provider plugin (`ListFoundationModels` + `ListInferenceProfiles`); the entries
# below are family/tier alias globs that enrich whatever the plugin discovers with correct
# Claude family metadata. Do not maintain an exhaustive pinned model list here: new Claude
# generations should be picked up by live discovery and enriched by the longest-matching glob.
#
# Alias matching (see `find_provider_model`) prefers the longest `*needle*` substring match, so
# the broad `*claude*` fallback applies only when no tier-specific entry matches.

# Broad Claude family fallback. Claude 3 / 3.5 generations do not support extended thinking, so
# the fallback intentionally omits a reasoning block; tier globs below add reasoning where the
# generation supports it.
[models."anthropic.claude"]
model_id = "anthropic.claude"
display_name = "Claude"
aliases = ["*claude*"]
status = "stable"
bcode_support = "supported"
family = "claude"
context_window = 200000
max_output_tokens = 64000

[models."anthropic.claude".capabilities]
text_input = true
image_input = true
text_output = true
tool_use = true
parallel_tool_calls = true
structured_outputs = true
prompt_cache = true

# Modern reasoning-capable Claude generations (3.7 and 4.x/5.x lines) support extended thinking
# on Bedrock. Reasoning effort is expressed via a thinking token budget rather than named effort
# levels, so `effort_values` are Bcode-portable names mapped by the provider adapter and
# `raw_reasoning_supported` reflects Bedrock streaming reasoning content blocks.

[models."anthropic.claude-3-7-sonnet"]
model_id = "anthropic.claude-3-7-sonnet"
display_name = "Claude 3.7 Sonnet"
aliases = ["*claude-3-7-sonnet*", "*claude-3-7*"]
status = "stable"
bcode_support = "supported"
family = "claude"
context_window = 200000
max_output_tokens = 64000
api_surface = "converse"
thinking_mode = "budget"

[models."anthropic.claude-3-7-sonnet".capabilities]
text_input = true
image_input = true
text_output = true
tool_use = true
parallel_tool_calls = true
structured_outputs = true
prompt_cache = true
reasoning = true

[models."anthropic.claude-3-7-sonnet".reasoning]
effort_values = ["low", "medium", "high"]
default_effort = "medium"
raw_reasoning_supported = true

[models."anthropic.claude-opus"]
model_id = "anthropic.claude-opus"
display_name = "Claude Opus"
aliases = ["*claude-opus-4*", "*claude-opus*"]
status = "stable"
bcode_support = "supported"
family = "claude"
context_window = 200000
max_output_tokens = 64000
api_surface = "converse"
thinking_mode = "budget"

[models."anthropic.claude-opus".capabilities]
text_input = true
image_input = true
text_output = true
tool_use = true
parallel_tool_calls = true
structured_outputs = true
prompt_cache = true
reasoning = true

[models."anthropic.claude-opus".reasoning]
effort_values = ["low", "medium", "high"]
default_effort = "medium"
raw_reasoning_supported = true

# Claude Opus 5 is Converse-usable but only supports adaptive thinking: `thinking.type = "enabled"`
# with `budget_tokens` is rejected with a ValidationException. `thinking_mode = "adaptive"` tells
# the provider adapter to send `thinking.type = "adaptive"` plus `output_config.effort`. Opus 5 is
# also one of the few models accepting the `xhigh` and `max` effort levels.
[models."anthropic.claude-opus-5"]
model_id = "anthropic.claude-opus-5"
display_name = "Claude Opus 5"
aliases = ["*claude-opus-5*"]
status = "stable"
bcode_support = "supported"
family = "claude"
context_window = 1000000
max_output_tokens = 128000
api_surface = "messages"
thinking_mode = "adaptive"

[models."anthropic.claude-opus-5".capabilities]
text_input = true
image_input = true
text_output = true
tool_use = true
parallel_tool_calls = true
structured_outputs = true
prompt_cache = true
reasoning = true

[models."anthropic.claude-opus-5".reasoning]
effort_values = ["low", "medium", "high", "xhigh", "max"]
default_effort = "high"
raw_reasoning_supported = true

# Messages-API-only Anthropic models ("bedrock-mantle"). These are served through the Anthropic
# Messages API (`/anthropic/v1/messages`) and cannot be driven by the Converse adapter, so they
# are marked with `api_surface = "messages"` and the provider routes them through the
# `InvokeModelWithResponseStream` Messages adapter instead. Longest-match aliases ensure these
# version-specific globs win over the broad Converse family entries above.
#
# Do not add a model here merely because it requires adaptive thinking. Adaptive thinking is
# supported over Converse via `additionalModelRequestFields`; that is expressed by
# `thinking_mode = "adaptive"` on a Converse entry.
[models."anthropic.claude-opus-4-7"]
model_id = "anthropic.claude-opus-4-7"
display_name = "Claude Opus 4.7"
aliases = ["*claude-opus-4-7*", "*claude-opus-4-8*"]
status = "stable"
bcode_support = "supported"
family = "claude"
context_window = 1000000
max_output_tokens = 128000
api_surface = "messages"
thinking_mode = "adaptive"

[models."anthropic.claude-opus-4-7".capabilities]
text_input = true
image_input = true
text_output = true
tool_use = true
reasoning = true

