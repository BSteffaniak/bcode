[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Example native plugin for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "plugin", "example"]
license     = { workspace = true }
name        = "bcode_hello_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bcode_plugin_sdk           = { workspace = true }
bcode_provider_auth_models = { workspace = true }
bcode_tool                 = { workspace = true }
bmux_keyboard              = { workspace = true, optional = true }
bmux_text_edit             = { workspace = true, optional = true }
bmux_tui                   = { workspace = true, optional = true }
serde_json                 = { workspace = true }

[features]
default = []
fail-on-warnings = []
tui = [
    "bcode_plugin_sdk/tui",
    "dep:bmux_tui",
    "dep:bmux_keyboard",
    "dep:bmux_text_edit",
]
