id      = "example.hello"
name    = "Hello Example Plugin"
version = "0.0.1"

[[services]]
description  = "Echo service used by smoke tests"
interface_id = "example-hello/v1"
name         = "Hello Echo"

[[services]]
description  = "Serialized visual adapter used by dynamic extension tests"
interface_id = "bcode.tui-visual-adapter/v1"
name         = "Hello TUI Visual Adapter"

[[visual_adapters]]
artifact_schema      = "bcode.tool.request.shell.run"
id                   = "hello-shell-request-card"
max_schema_version   = 1
min_schema_version   = 1
priority             = 1000
producer_default     = false
render_mode          = "transcript_block"
service_interface_id = "bcode.tui-visual-adapter/v1"
surfaces             = ["tui"]

[[visual_adapters]]
artifact_schema      = "bcode.shell.run"
id                   = "hello-shell-card"
max_schema_version   = 1
min_schema_version   = 1
priority             = 1000
producer_default     = false
render_mode          = "transcript_block"
service_interface_id = "bcode.tui-visual-adapter/v1"
surfaces             = ["tui"]

[[event_subscriptions]]
topic = "example.event"

[[event_subscriptions]]
topic = "bcode.session.event"

[concurrency]
type = "exclusive"

[runtime]
abi_version  = 3
event_symbol = "bcode_plugin_handle_event_v1"
library      = "libbcode_hello_plugin.dylib"
type         = "native"
