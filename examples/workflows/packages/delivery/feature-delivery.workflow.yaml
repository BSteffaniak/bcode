workflow_source_version: 3
workflow_id: examples/delivery/feature-delivery
title: Progress-driven feature delivery
description: Executes an ordered, configuration-driven delivery path across planning, implementation, validation, review, checkpoint, synchronization, bounded recovery, and completion.
input:
  type_name: bcode.delivery.request/v1
  schema:
    type: object
    additionalProperties: false
    required: [planning, validation_plan, checkpoint_plan, synchronization_plan, review_scope, stop_condition]
    properties:
      planning:
        type: object
        additionalProperties: false
        required: [path, prompt]
        properties:
          path: {type: string, minLength: 1, maxLength: 1024}
          prompt: {type: string, minLength: 1, maxLength: 16384}
      validation_plan:
        type: object
        additionalProperties: false
        required: [version, cwd, commands, environment, output]
        properties:
          version: {const: 2}
          cwd: {type: string, minLength: 1, maxLength: 4096}
          commands: {type: array, minItems: 1, maxItems: 64}
          environment: {type: object}
          output: {type: object}
      checkpoint_plan:
        type: object
        additionalProperties: false
        required: [version, cwd, commands, environment, output]
        properties:
          version: {const: 2}
          cwd: {type: string, minLength: 1, maxLength: 4096}
          commands: {type: array, minItems: 1, maxItems: 64}
          environment: {type: object}
          output: {type: object}
      synchronization_plan:
        type: object
        additionalProperties: false
        required: [initial, after_recovery]
        properties:
          initial: {type: object}
          after_recovery: {type: object}
      review_scope: {type: string, minLength: 1, maxLength: 4096}
      stop_condition: {type: string, minLength: 1, maxLength: 16384}
output:
  type_name: bcode.completion.result/v1
  schema:
    type: object
    additionalProperties: false
    required: [condition_met, summary, remaining]
    properties:
      condition_met: {type: boolean}
      summary: {type: string, minLength: 1, maxLength: 4096}
      remaining: {type: array, maxItems: 128, items: {type: string, maxLength: 4096}}
run_limits:
  maximum_duration_ms: 14400000
  node_execution_cap: 64
  concurrency_cap: 2
  cycle_cap: 4
  retry_cap: 2
steps:
  - id: request
    input:
      schema:
        type_name: bcode.delivery.request/v1
        schema:
          type: object
          additionalProperties: false
          required: [planning, validation_plan, checkpoint_plan, synchronization_plan, review_scope, stop_condition]
          properties:
            planning:
              type: object
              additionalProperties: false
              required: [path, prompt]
              properties:
                path: {type: string, minLength: 1, maxLength: 1024}
                prompt: {type: string, minLength: 1, maxLength: 16384}
            validation_plan:
              type: object
              additionalProperties: false
              required: [version, cwd, commands, environment, output]
              properties:
                version: {const: 2}
                cwd: {type: string, minLength: 1, maxLength: 4096}
                commands: {type: array, minItems: 1, maxItems: 64}
                environment: {type: object}
                output: {type: object}
            checkpoint_plan:
              type: object
              additionalProperties: false
              required: [version, cwd, commands, environment, output]
              properties:
                version: {const: 2}
                cwd: {type: string, minLength: 1, maxLength: 4096}
                commands: {type: array, minItems: 1, maxItems: 64}
                environment: {type: object}
                output: {type: object}
            synchronization_plan:
              type: object
              additionalProperties: false
              required: [initial, after_recovery]
              properties:
                initial: {type: object}
                after_recovery: {type: object}
            review_scope: {type: string, minLength: 1, maxLength: 4096}
            stop_condition: {type: string, minLength: 1, maxLength: 16384}
  - id: plan
    needs: [request]
    package_call: {external: planning}
    input_expression:
      version: 2
      expression:
        operation: selected_input
        source: dependency.request
        selector:
          version: 1
          segments: [{kind: field, name: planning}]
      output:
        type_name: bcode.planning.request/v1
        schema:
          type: object
          additionalProperties: false
          required: [path, prompt]
          properties:
            path: {type: string, minLength: 1, maxLength: 1024}
            prompt: {type: string, minLength: 1, maxLength: 16384}
  - id: implement
    needs: [plan]
    package_call: {external: remediation}
    input_expression:
      version: 2
      expression:
        operation: object
        fields:
          status: {operation: constant, value: ready}
          detail:
            operation: selected_input
            source: dependency.plan
            selector:
              version: 1
              segments: [{kind: field, name: summary}]
          iteration: {operation: constant, value: 0}
      output:
        type_name: bcode.remediation.state/v1
        schema:
          type: object
          additionalProperties: false
          required: [status, detail, iteration]
          properties:
            status: {type: string, enum: [ready, needs_remediation, complete, blocked]}
            detail: {type: string, maxLength: 16384}
            iteration: {type: integer, minimum: 0, maximum: 3}
  - id: validation
    needs: [implement, request]
    package_call: {external: validation}
    input_expression:
      version: 2
      expression:
        operation: selected_input
        source: dependency.request
        selector:
          version: 1
          segments: [{kind: field, name: validation_plan}]
