ironment","output"],"type":"object"}],"x-bcode-allow-dynamic-complete-input":false,"x-bcode-dynamic-binding-paths":["commands.*.argv.*","environment.set.*"]}
  - id: review
    needs: [validation, request]
    package_call: {external: review}
    input_expression:
      version: 2
      expression:
        operation: object
        fields:
          scope:
            operation: selected_input
            source: dependency.request
            selector:
              version: 1
              segments: [{kind: field, name: review_scope}]
      output:
        type_name: bcode.review.request/v1
        schema:
          type: object
          additionalProperties: false
          required: [scope]
          properties: {scope: {type: string, minLength: 1, maxLength: 4096}}
  - id: checkpoint
    needs: [review, request]
    package_call: {external: checkpoint}
    input_expression:
      version: 2
      expression:
        operation: selected_input
        source: dependency.request
        selector:
          version: 1
          segments: [{kind: field, name: checkpoint_plan}]
      output:
        type_name: bcode.shell.exec/v1
        schema: {"oneOf":[{"oneOf":[{"maxLength":65536,"minLength":1,"type":"string"},{"additionalProperties":false,"properties":{"accepted_exit_codes":{"items":{"type":"integer"},"maxItems":64,"minItems":1,"type":"array","uniqueItems":true},"continue_on_unaccepted_exit":{"type":"boolean"},"cwd":{"maxLength":1024,"minLength":1,"type":"string"},"environment":{"additionalProperties":{"maxLength":65536,"type":"string"},"maxProperties":128,"type":"object"},"output":{"additionalProperties":false,"properties":{"artifact_spill":{"type":"boolean"},"preview_bytes":{"maximum":65536,"minimum":0,"type":"integer"}},"type":"object"},"script":{"maxLength":65536,"minLength":1,"type":"string"},"shell":{"items":{"maxLength":4096,"type":"string"},"maxItems":32,"minItems":1,"type":"array"},"timeout_ms":{"maximum":300000,"minimum":1,"type":"integer"},"version":{"const":1}},"required":["script"],"type":"object"}]},{"additionalProperties":false,"properties":{"commands":{"items":{"additionalProperties":false,"properties":{"accepted_exit_codes":{"items":{"type":"integer"},"maxItems":64,"minItems":1,"type":"array","uniqueItems":true},"argv":{"items":{"maxLength":65536,"type":"string"},"maxItems":256,"minItems":1,"type":"array"},"continue_on_unaccepted_exit":{"type":"boolean"},"timeout_ms":{"maximum":300000,"minimum":1,"type":"integer"}},"required":["argv","timeout_ms"],"type":"object"},"maxItems":64,"minItems":1,"type":"array"},"cwd":{"maxLength":1024,"minLength":1,"type":"string"},"environment":{"additionalProperties":false,"properties":{"inherit":{"type":"boolean"},"set":{"additionalProperties":{"maxLength":65536,"type":"string"},"maxProperties":128,"type":"object"}},"required":["inherit","set"],"type":"object"},"output":{"additionalProperties":false,"properties":{"artifact_spill":{"type":"boolean"},"preview_bytes":{"maximum":65536,"minimum":0,"type":"integer"}},"required":["preview_bytes","artifact_spill"],"type":"object"},"version":{"const":2}},"required":["version","cwd","commands","environment","output"],"type":"object"}],"x-bcode-allow-dynamic-complete-input":false,"x-bcode-dynamic-binding-paths":["commands.*.argv.*","environment.set.*"]}
  - id: synchronize
    needs: [checkpoint, request]
    package_call: {external: synchronization}
    input_expression:
      version: 2
      expression:
        operation: selected_input
        source: dependency.request
        selector:
          version: 1
          segments: [{kind: field, name: synchronization_plan}]
      output:
        type_name: bcode.synchronization.recovery-request/v1
        schema: {"additionalProperties":false,"properties":{"after_recovery":{"type":"object"},"initial":{"type":"object"}},"required":["initial","after_recovery"],"type":"object"}
  - id: completion
    needs: [synchronize, review, request]
    package_call: {external: completion}
    input_expression:
      version: 2
      expression:
        operation: object
        fields:
          stop_condition:
            operation: selected_input
            source: dependency.request
            selector:
              version: 1
              segments: [{kind: field, name: stop_condition}]
          evidence: {operation: array, items: []}
      output:
        type_name: bcode.completion.request/v1
        schema:
          type: object
          additionalProperties: false
          required: [stop_condition, evidence]
          properties:
            stop_condition: {type: string, minLength: 1, maxLength: 16384}
            evidence: {type: array, maxItems: 128, items: {type: string, maxLength: 4096}}
  - id: operator_decision
    needs: [completion]
    approval:
      schema:
        type_name: bcode.completion.result/v1
        schema:
          type: object
          additionalProperties: false
          required: [condition_met, summary, remaining]
          properties:
            condition_met: {type: boolean}
            summary: {type: string, minLength: 1, maxLength: 4096}
            remaining: {type: array, maxItems: 128, items: {type: string, maxLength: 4096}}
      resources: [{resource: operator, access: read}]
