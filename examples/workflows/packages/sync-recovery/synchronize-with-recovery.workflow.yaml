workflow_source_version: 3
workflow_id: examples/sync-recovery/synchronize-with-recovery
title: Bounded synchronization recovery
description: Runs one normal synchronization attempt, conditionally invokes exact imported recovery from canonical typed facts, then performs one configured post-recovery synchronization attempt.
run_limits:
  maximum_duration_ms: 2400000
  node_execution_cap: 12
  concurrency_cap: 1
  cycle_cap: 2
  retry_cap: 1
steps:
  - id: request
    input:
      schema:
        type_name: bcode.synchronization.recovery-request/v1
        schema:
          type: object
          additionalProperties: false
          required: [initial, after_recovery]
          properties:
            initial: {type: object}
            after_recovery: {type: object}
  - id: synchronize
    needs: [request]
    package_call: {external: synchronize}
    input_expression:
      version: 2
      expression:
        operation: selected_input
        source: dependency.request
        selector:
          version: 1
          segments: [{kind: field, name: initial}]
