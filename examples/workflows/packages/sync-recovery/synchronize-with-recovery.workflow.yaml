ironment","output"],"type":"object"}],"x-bcode-allow-dynamic-complete-input":false,"x-bcode-dynamic-binding-paths":["commands.*.argv.*","environment.set.*"]}
  - id: recover
    needs: [synchronize]
    package_call: {external: recover}
    input_from: {step: synchronize}
    when:
      source: {step: synchronize}
      predicate:
        operation: selected_equals
        version: 3
        selector:
          version: 1
          segments: [{kind: field, name: passed}]
        value: false
