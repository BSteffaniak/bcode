schema_version = 1
id = "prompt-cache-compaction"
name = "Cache reuse after proactive compaction"
description = "Deterministic production daemon workload: compact prior work before a second tool loop, then reuse its new prefix. Fake-provider measurements are simulation, not live evidence."

[run]
repetitions = 1
timeout_ms = 300000
isolation = "temp_copy"
randomize_case_order = false
fail_fast = false

[score]
correctness = 1.0
efficiency = 0.0
speed = 0.0
cost = 0.0
stability = 0.0
correctness_required = true

[[variants]]
id = "compacted"
name = "Proactive local compaction"
executor = "agent"
allowed_tools = ["filesystem.read"]
metadata = { agent_id = "build", permission_mode = "approve" }
config_toml = """
[model.compaction]
mode = "proactive"
backend = "local"
proactive_threshold_percent = 33
keep_recent_tokens = 1
"""

[variants.follow_up]
prompt = "read-files probe-00.txt probe-01.txt probe-02.txt probe-03.txt probe-04.txt probe-05.txt probe-06.txt probe-07.txt probe-08.txt probe-09.txt probe-10.txt probe-11.txt"
restart_daemon = true

[[cases]]
id = "two-read-loops"
name = "Retain active task and rebuild cache after compaction"
fixture = "workspace"
prompt = "read-files probe-00.txt probe-01.txt probe-02.txt probe-03.txt probe-04.txt probe-05.txt probe-06.txt probe-07.txt probe-08.txt probe-09.txt probe-10.txt probe-11.txt"

[[cases.judges]]
type = "metric_threshold"
metric = "follow_up.context_compaction_count"
min = 1
required = true

[[cases.judges]]
type = "metric_threshold"
metric = "follow_up.tool_call_count"
min = 12
required = true

[[cases.judges]]
type = "metric_threshold"
metric = "follow_up.tool_error_count"
max = 0
required = true

[[cases.judges]]
type = "metric_threshold"
metric = "follow_up.prompt_cache.hit_round_ratio"
min = 0.9
required = true

[[cases.judges]]
type = "metric_threshold"
metric = "follow_up.prompt_cache.late_uncached_ratio"
max = 0.15
required = true
