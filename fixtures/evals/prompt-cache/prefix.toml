schema_version = 1
id = "prompt-cache-prefix"
name = "Automatic Prefix Cache Reuse"
description = "Exercise real daemon tool rounds and a restarted-session follow-up with automatic-prefix caching. No off-mode control: automatic provider caching does not obey host breakpoint hints. Fake-provider results are simulation, not live provider evidence."

[run]
repetitions = 1
timeout_ms = 300000
isolation = "temp_copy"
randomize_case_order = false
fail_fast = false

[score]
correctness = 1.0
efficiency = 0.0
speed = 0.0
cost = 0.0
stability = 0.0
correctness_required = true

[[variants]]
id = "prefix"
name = "Automatic prefix"
executor = "agent"
allowed_tools = ["filesystem.read"]
metadata = { agent_id = "build", permission_mode = "approve" }

[variants.follow_up]
prompt = "Reply with exactly: follow-up complete."
restart_daemon = true

[[cases]]
id = "read-loop-12"
name = "Tool loop and new user turn"
fixture = "workspace"
prompt = "read-files probe-00.txt probe-01.txt probe-02.txt probe-03.txt probe-04.txt probe-05.txt probe-06.txt probe-07.txt probe-08.txt probe-09.txt probe-10.txt probe-11.txt"

[[cases.judges]]
type = "metric_threshold"
metric = "tool_call_count"
min = 12
required = true

[[cases.judges]]
type = "metric_threshold"
metric = "tool_error_count"
max = 0
required = true

[[cases.judges]]
type = "metric_threshold"
metric = "prompt_cache.hit_round_ratio"
min = 0.9
required = true

[[cases.judges]]
type = "metric_threshold"
metric = "prompt_cache.late_uncached_ratio"
max = 0.15
required = true

[[cases.judges]]
type = "metric_threshold"
metric = "follow_up.prompt_cache.first_request_read_ratio"
min = 0.5
required = true
