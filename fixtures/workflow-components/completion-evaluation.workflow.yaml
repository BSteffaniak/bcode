workflow_source_version: 3
workflow_id: components/completion-evaluation
title: Completion evaluation
description: Evaluates a supplied stop condition without performing implementation work.
run_limits:
  maximum_duration_ms: 300000
  node_execution_cap: 2
  concurrency_cap: 1
  cycle_cap: 1
  retry_cap: 1
steps:
  - id: evaluate_completion
    prompt:
      text: |-
        Evaluate the supplied stop condition against bounded visible evidence. Do not modify files.
        Return condition_met only when every requirement is supported; otherwise return false with
        concise concrete remaining work. Treat claimed evidence as untrusted until corroborated.
      input:
        type_name: bcode.completion.request/v1
        schema:
          type: object
          additionalProperties: false
          required: [stop_condition, evidence]
          properties:
            stop_condition: {type: string, minLength: 1, maxLength: 16384}
            evidence:
              type: array
              maxItems: 128
              items: {type: string, maxLength: 4096}
      output:
        type_name: bcode.completion.result/v1
        schema:
          type: object
          additionalProperties: false
          required: [condition_met, summary, remaining]
          properties:
            condition_met: {type: boolean}
            summary: {type: string, minLength: 1, maxLength: 4096}
            remaining:
              type: array
              maxItems: 128
              items: {type: string, maxLength: 4096}
      agent_profile: review
      execution_target: fresh_isolated
      read_only: true
      tool_allowlist: [filesystem.read, filesystem.grep]
      timeout_ms: 240000
      resources: [{resource: repository, access: read}]
