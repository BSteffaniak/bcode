name: Run Bcode
description: Execute one arbitrary prompt using explicit trusted configuration
inputs:
  binary:
    description: Absolute path to a verified Bcode release binary
    required: true
  auth-mode:
    description: direct (existing explicit API config) or broker-oidc (normalized scoped gateway)
    default: direct
  broker-url:
    description: Trusted HTTPS broker origin; required for broker-oidc
  broker-audience:
    description: Exact audience admitted by broker policy; required for broker-oidc
  config:
    description: Absolute trusted config outside checkout (direct mode only)
    required: false
  profile:
    description: Explicit model profile (direct mode only; broker selects github-broker exclusively)
    required: false
  prompt:
    description: Arbitrary UTF-8 prompt, passed as data rather than shell code
    required: true
  timeout-secs:
    description: Execution budget; direct 1–86400, broker must fit actual lease (maximum 900) minus 10 seconds; 600 requires at least 610 seconds remaining
    default: '600'
outputs:
  result:
    description: Private result JSON path; output may contain sensitive model-generated content
    value: ${{ steps.run.outputs.result }}
  exit-code:
    description: Bcode exit status; only observed completion succeeds
    value: ${{ steps.run.outputs.exit-code }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        BCODE_ACTION_AUTH_MODE: ${{ inputs.auth-mode }}
        BCODE_ACTION_BROKER_URL: ${{ inputs.broker-url }}
        BCODE_ACTION_BROKER_AUDIENCE: ${{ inputs.broker-audience }}
        BCODE_ACTION_BINARY: ${{ inputs.binary }}
        BCODE_ACTION_CONFIG: ${{ inputs.config }}
        BCODE_ACTION_PROFILE: ${{ inputs.profile }}
        BCODE_ACTION_PROMPT: ${{ inputs.prompt }}
        BCODE_ACTION_TIMEOUT: ${{ inputs.timeout-secs }}
        BCODE_ACTION_PATH: ${{ github.action_path }}
      run: bash "$BCODE_ACTION_PATH/run.sh"
