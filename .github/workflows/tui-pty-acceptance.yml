name: TUI PTY Acceptance

on:
  pull_request:
    branches: [master]
    paths:

      - ".github/workflows/tui-pty-acceptance.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "packages/bcode/**"
      - "packages/bundled-plugins/**"
      - "packages/cli/**"
      - "packages/client/**"
      - "packages/config/**"
      - "packages/daemon-lifecycle/**"
      - "packages/ipc/**"
      - "packages/plugin/**"
      - "packages/plugin-sdk/**"
      - "packages/server/**"
      - "packages/settings/**"
      - "packages/tui/**"
      - "packages/tui-components/**"
      - "plugins/**"
      - "xtask/src/architecture.rs"
      - "scripts/smoke-local-daemon.sh"
      - "scripts/smoke-tui-pty.sh"

  push:
    branches: [master]
    paths:

      - ".github/workflows/tui-pty-acceptance.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "packages/bcode/**"
      - "packages/bundled-plugins/**"
      - "packages/cli/**"
      - "packages/client/**"
      - "packages/config/**"
      - "packages/daemon-lifecycle/**"
      - "packages/ipc/**"
      - "packages/plugin/**"
      - "packages/plugin-sdk/**"
      - "packages/server/**"
      - "packages/settings/**"
      - "packages/tui/**"
      - "packages/tui-components/**"
      - "plugins/**"
      - "xtask/src/architecture.rs"
      - "scripts/smoke-local-daemon.sh"
      - "scripts/smoke-tui-pty.sh"

  workflow_dispatch:

jobs:
  tui-pty-acceptance:
    name: TUI PTY acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exercise non-interactive CLI process boundaries
        run: cargo test -p bcode --features app --test cli_process
      - name: Exercise targeted cancellation through the real CLI and daemon
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p bcode_default_agents_plugin
          case "$RUNNER_OS" in
            Linux) library="$PWD/target/debug/libbcode_default_agents_plugin.so" ;;
            macOS) library="$PWD/target/debug/libbcode_default_agents_plugin.dylib" ;;
            *) echo "Unsupported runner platform" >&2; exit 1 ;;
          esac
          test -f "$library"
          BCODE_DEFAULT_AGENTS_PLUGIN_TEST_LIBRARY="$library" \
            cargo test -p bcode --features app --test cli_process \
              targeted_cancellation_cli_reports_live_daemon_acknowledgement -- --ignored --exact
          BCODE_DEFAULT_AGENTS_PLUGIN_TEST_LIBRARY="$library" \
            cargo test -p bcode --features app --test cli_process \
              waited_prompt_reports_unavailable_provider_through_live_daemon -- --ignored --exact
      - name: Exercise exact-turn observation through IPC
        run: cargo test -p bcode_client --lib turn_observation
      - name: Exercise daemon cancellation and ownership fences
        run: cargo test -p bcode_server --lib cancellation
      - name: Exercise local daemon lifecycle
        run: scripts/smoke-local-daemon.sh
      - name: Exercise the real TUI in a pseudo-terminal
        run: scripts/smoke-tui-pty.sh
