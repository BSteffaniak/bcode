name: Architecture Guards

on:
  pull_request:
  push:
    branches: [master]

jobs:
  session-lease-locks:
    name: Session lease locks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test cross-process session lease locking
        run: cargo test --package bcode_session lease::tests --no-default-features

  artifact-identity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check produced artifact identity matrix
        run: scripts/check-artifact-identity-matrix.sh

  dependency-boundaries:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-apple-darwin, x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test graph traversal
        run: cargo test -p xtask architecture::tests
      - name: Check resolved dependency boundaries
        run: cargo run -p xtask -- architecture --target ${{ matrix.target }}
