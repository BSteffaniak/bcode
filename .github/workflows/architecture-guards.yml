name: Architecture Guards

on:
  pull_request:
  push:
    branches: [master]

jobs:
  session-lease-locks:
    name: Session lease locks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test cross-process session lease locking
        run: cargo test --package bcode_session lease::tests --no-default-features

  daemon-lifecycle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check daemon lifecycle architecture
        run: scripts/check-daemon-lifecycle-architecture.sh
      - name: Check produced artifact identity matrix
        run: scripts/check-artifact-identity-matrix.sh

  model-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install architecture guard dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check model catalog architecture
        run: scripts/check-model-catalog-architecture.sh
