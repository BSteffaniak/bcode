name: Windows Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  windows:
    name: Windows workspace
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify Windows native build tools
        shell: pwsh
        run: |
          cmake --version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "Visual Studio Installer discovery tool was not found"
          }
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($installation)) {
            throw "Visual Studio C++ x64 build tools were not found"
          }

      - name: Check workspace
        run: cargo check --workspace

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Run Windows-specific contract tests
        run: |
          cargo test --package bcode_ipc default_windows_endpoint_is_a_namespaced_named_pipe
          cargo test --package bcode_shell_plugin windows_shell_plan_uses_cmd_contract
          cargo test --package bcode_shell_plugin terminal_mode_executes_cmd_through_native_pty
          cargo test --package bcode_shell_plugin cancellation_terminates_windows_terminal_child_promptly
          cargo test --package bcode_provider_auth windows_dpapi_device_seal_round_trips_for_current_user

      - name: Run Windows path semantics smoke tests
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "bcode path smoke 状态"
          $outside = Join-Path $env:RUNNER_TEMP "bcode-path-outside.txt"
          try {
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            Set-Content -LiteralPath (Join-Path $root "MixedCase.txt") -Value "case"
            if (-not (Test-Path -LiteralPath (Join-Path $root "mixedcase.txt"))) {
              throw "Windows path lookup did not preserve expected case-insensitive semantics"
            }
            $resolvedRoot = (Resolve-Path -LiteralPath $root).Path
            if (-not $resolvedRoot.StartsWith((Split-Path -Qualifier $resolvedRoot))) {
              throw "resolved Windows path lost its drive qualifier"
            }
            $separatorPath = [IO.Path]::GetFullPath("$root\child\..\MixedCase.txt")
            if (-not $separatorPath.Equals((Join-Path $root "MixedCase.txt"), [StringComparison]::OrdinalIgnoreCase)) {
              throw "Windows separator normalization produced an unexpected path"
            }
            $unc = [IO.Path]::GetFullPath("\\server\share\folder\..\file.txt")
            if (-not $unc.Equals("\\server\share\file.txt", [StringComparison]::OrdinalIgnoreCase)) {
              throw "UNC path normalization produced an unexpected path"
            }
            Set-Content -LiteralPath $outside -Value "outside"
            $link = Join-Path $root "escape.txt"
            New-Item -ItemType SymbolicLink -Path $link -Target $outside | Out-Null
            if ((Resolve-Path -LiteralPath $link).Path.StartsWith($resolvedRoot, [StringComparison]::OrdinalIgnoreCase)) {
              throw "reparse-point escape unexpectedly resolved inside the authorized root"
            }
          } finally {
            Remove-Item -LiteralPath $root, $outside -Force -Recurse -ErrorAction SilentlyContinue
          }

      - name: Build and verify Windows release artifact
        run: |
          cargo xtask release --target x86_64-pc-windows-msvc --version ci
          cargo xtask verify-release --target x86_64-pc-windows-msvc --version ci

      - name: Smoke-test packaged Tesseract runtime
        run: cargo xtask smoke-test-tesseract --target x86_64-pc-windows-msvc

      - name: Upload Windows CI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bcode-windows-ci-diagnostics-${{ github.run_id }}
          path: |
            target/dist/*.sha256
            target/dist/staging/*/bcode-runtimes/tesseract/manifest.json
            target/debug/build/bcode_tesseract_sys-*/out/bundled-runtimes/*/tessdata/*.traineddata
            target/x86_64-pc-windows-msvc/release/build/bcode_tesseract_sys-*/out/bundled-runtimes/*/tessdata/*.traineddata
          if-no-files-found: ignore

      - name: Upload Windows CI artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bcode-windows-ci-${{ github.run_id }}
          path: |
            target/dist/bcode-ci-x86_64-pc-windows-msvc.*
          if-no-files-found: ignore
