name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag, e.g. v0.1.0"
        required: true
        type: string
      commit_sha:
        description: "Full 40-character Git commit SHA to build and optionally publish"
        required: true
        type: string
      publish:
        description: "Create or update the GitHub release"
        required: true
        default: false
        type: boolean
      publish_windows_unsigned:
        description: "Explicitly allow publishing an unsigned Windows artifact"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.commit_sha }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Verify release checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Release requires a full 40-character commit SHA, not a mutable ref"
          }
          $actual = (git rev-parse HEAD).Trim()
          if (-not $actual.Equals($env:EXPECTED_SHA, [StringComparison]::OrdinalIgnoreCase)) {
            throw "release checkout commit $actual does not match requested commit $env:EXPECTED_SHA"
          }
          if (-not $env:WORKFLOW_SHA.Equals($env:EXPECTED_SHA, [StringComparison]::OrdinalIgnoreCase)) {
            throw "release workflow definition commit $env:WORKFLOW_SHA does not match requested commit $env:EXPECTED_SHA"
          }

      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_VERSION) -or $env:RELEASE_VERSION -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') {
            throw "Release version must start with an ASCII letter or digit and contain only ASCII letters, digits, '.', '-', or '_'"
          }

      - name: Record Windows signing policy
        if: inputs.publish && runner.os == 'Windows'
        shell: bash
        env:
          PUBLISH_WINDOWS_UNSIGNED: ${{ inputs.publish_windows_unsigned }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_WINDOWS_UNSIGNED" == 'true' ]]; then
            printf '%s\n' 'Windows artifact publication policy: unsigned override explicitly approved for this workflow run.' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Windows artifact publication policy: Authenticode signing required.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Validate Windows signing configuration
        if: runner.os == 'Windows'
        id: windows_signing
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
          PUBLISH_WINDOWS_UNSIGNED: ${{ inputs.publish_windows_unsigned }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw "Windows signing certificate and password must be configured together"
          }
          if ($env:PUBLISH_RELEASE -eq 'true' -and -not $hasCertificate -and $env:PUBLISH_WINDOWS_UNSIGNED -ne 'true') {
            throw "Public Windows release requires Authenticode signing unless publish_windows_unsigned is explicitly enabled"
          }
          "configured=$($hasCertificate.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify Windows native build tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CONFIGURED: ${{ steps.windows_signing.outputs.configured }}
        run: |
          cmake --version
          Get-Command cmake -ErrorAction Stop | Out-Null
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          $link = Get-Command link.exe -ErrorAction SilentlyContinue
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "Visual Studio Installer discovery tool was not found"
          }
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($installation)) {
            throw "Visual Studio C++ x64 build tools were not found"
          }
          $devShell = Join-Path $installation "Common7\Tools\Launch-VsDevShell.ps1"
          if ($null -eq $cl -or $null -eq $link) {
            if (-not (Test-Path -LiteralPath $devShell)) {
              throw "Visual Studio developer shell was not found"
            }
            & $devShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
            if (-not $?) {
              throw "Visual Studio developer shell initialization failed"
            }
          }
          Get-Command cl.exe -ErrorAction Stop | Out-Null
          Get-Command link.exe -ErrorAction Stop | Out-Null
          $compilerBanner = (& cl.exe 2>&1 | Out-String)
          if ($compilerBanner -notmatch 'for x64') {
            throw "MSVC compiler is not configured for the x64 target"
          }
          $linkerBanner = (& link.exe /? 2>&1 | Out-String)
          if ($linkerBanner -notmatch 'X64') {
            throw "MSVC linker is not configured for the x64 target"
          }
          ($env:PATH -split ';' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH') {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          if ($env:WINDOWS_SIGNING_CONFIGURED -eq 'true') {
            $signTool = Get-ChildItem -Path "$installation\Windows Kits\10\bin", "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $signTool) {
              throw "signtool.exe was not found"
            }
            $signTool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Install Linux cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure Linux cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CODESIGN_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERTIFICATE_P12_BASE64 }}
          APPLE_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CODESIGN_CERTIFICATE_P12_BASE64"
          test -n "$APPLE_CODESIGN_CERTIFICATE_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/bcode-release-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/bcode-release-signing.keychain-db"
          echo "$APPLE_CODESIGN_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_CODESIGN_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_CODESIGN_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CODESIGN_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CODESIGN_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          echo "APPLE_RELEASE_CERTIFICATE_PATH=$CERTIFICATE_PATH" >> "$GITHUB_ENV"
          echo "APPLE_RELEASE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Validate Windows signing secret pairing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw "Windows signing requires both certificate and password secrets"
          }

      - name: Decode Windows signing certificate
        if: runner.os == 'Windows' && steps.windows_signing.outputs.configured == 'true'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64)) {
            throw "Windows signing certificate secret is empty"
          }
          $certificate = Join-Path $env:RUNNER_TEMP "bcode-windows-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64))
          "WINDOWS_CODESIGN_CERTIFICATE_PFX_PATH=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate Windows dependency portability
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/check-windows-dependency-portability.sh

      - name: Build release artifact
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
        run: cargo xtask release --target ${{ matrix.target }} --version ${{ inputs.version }}

      - name: Verify release artifact
        shell: pwsh
        run: |
          $verification = cargo xtask verify-release --target ${{ matrix.target }} --version ${{ inputs.version }} 2>&1
          $verification | Write-Output
          if ($LASTEXITCODE -ne 0) {
            throw "Release artifact verification failed"
          }
          if ("${{ matrix.target }}" -eq "x86_64-pc-windows-msvc" -and ($verification -notmatch 'verified extracted artifact identity:' -or $verification -notmatch 'verified packaged version:')) {
            throw "Windows release verification did not execute extracted-product acceptance"
          }

      - name: Smoke-test bundled Tesseract runtime
        if: runner.os == 'Windows'
        run: cargo xtask smoke-test-tesseract --target ${{ matrix.target }}

      - name: Verify Windows signature provenance
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PUBLISH_RELEASE: ${{ inputs.publish }}
          PUBLISH_WINDOWS_UNSIGNED: ${{ inputs.publish_windows_unsigned }}
          WINDOWS_SIGNING_CONFIGURED: ${{ steps.windows_signing.outputs.configured }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $signed = $env:WINDOWS_SIGNING_CONFIGURED -eq 'true'
          if ($signed) {
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_PFX_PATH)) {
              throw "Signed Windows release did not retain its temporary certificate path"
            }
            @{
              schema_version = 1
              commit_sha = '${{ inputs.commit_sha }}'
              version = '${{ inputs.version }}'
              target = $env:RELEASE_TARGET
              signed = $true
              timestamped = $true
              verification = 'pre-and-post-package'
            } | ConvertTo-Json | Set-Content -LiteralPath "target/dist/windows-signing-$env:RELEASE_TARGET.json" -Encoding utf8
          } elseif ($env:PUBLISH_RELEASE -eq 'true' -and $env:PUBLISH_WINDOWS_UNSIGNED -eq 'true') {
            @{
              schema_version = 1
              commit_sha = '${{ inputs.commit_sha }}'
              version = '${{ inputs.version }}'
              target = $env:RELEASE_TARGET
              signed = $false
              timestamped = $false
              verification = 'explicit-unsigned-publication-exception'
            } | ConvertTo-Json | Set-Content -LiteralPath "target/dist/windows-signing-$env:RELEASE_TARGET.json" -Encoding utf8
          }

      - name: Cleanup macOS signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          if [[ -n "${APPLE_RELEASE_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$APPLE_RELEASE_KEYCHAIN_PATH"
          fi
          rm -f "${APPLE_RELEASE_CERTIFICATE_PATH:-}"

      - name: Cleanup Windows signing certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_PFX_PATH)) {
            Remove-Item -LiteralPath $env:WINDOWS_CODESIGN_CERTIFICATE_PFX_PATH -Force -ErrorAction SilentlyContinue
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bcode-${{ inputs.commit_sha }}-${{ inputs.version }}-${{ matrix.target }}
          path: |
            target/dist/bcode-${{ inputs.version }}-${{ matrix.target }}.*
            target/dist/windows-signing-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: target/dist
          merge-multiple: true

      - name: Verify complete publication set
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT_SHA: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.version }}
          PUBLISH_WINDOWS_UNSIGNED: ${{ inputs.publish_windows_unsigned }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          actual_checkout="$(git rev-parse HEAD)"
          if [[ "${actual_checkout,,}" != "${RELEASE_COMMIT_SHA,,}" ]]; then
            printf 'Publish checkout %s does not match requested commit %s.\n' "$actual_checkout" "$RELEASE_COMMIT_SHA" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "${tag_sha,,}" != "${RELEASE_COMMIT_SHA,,}" ]]; then
              printf 'Existing release tag %s points to %s, not requested commit %s.\n' "$RELEASE_TAG" "$tag_sha" "$RELEASE_COMMIT_SHA" >&2
              exit 1
            fi
          fi
          version="$RELEASE_VERSION"
          expected=(
            "bcode-${version}-aarch64-apple-darwin.zip"
            "bcode-${version}-x86_64-apple-darwin.zip"
            "bcode-${version}-aarch64-unknown-linux-gnu.tar.gz"
            "bcode-${version}-x86_64-unknown-linux-gnu.tar.gz"
            "bcode-${version}-x86_64-pc-windows-msvc.zip"
          )
          for archive in "${expected[@]}"; do
            test -f "target/dist/${archive}"
            test -f "target/dist/${archive}.sha256"
            (cd target/dist && sha256sum --check "${archive}.sha256")
          done
          artifact_count=$(find target/dist -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)
          checksum_count=$(find target/dist -maxdepth 1 -type f -name '*.sha256' | wc -l)
          test "${artifact_count}" -eq "${#expected[@]}"
          test "${checksum_count}" -eq "${#expected[@]}"
          signing_provenance='target/dist/windows-signing-x86_64-pc-windows-msvc.json'
          test -f "${signing_provenance}"
          if jq -e --arg commit "$RELEASE_COMMIT_SHA" --arg version "$RELEASE_VERSION" '.schema_version == 1 and .commit_sha == $commit and .version == $version and .target == "x86_64-pc-windows-msvc" and .signed == true and .timestamped == true and .verification == "pre-and-post-package"' "${signing_provenance}" >/dev/null; then
            : # A valid signed artifact always satisfies publication policy, even when an unsigned fallback was allowed.
          elif [[ "$PUBLISH_WINDOWS_UNSIGNED" == 'true' ]]; then
            jq -e --arg commit "$RELEASE_COMMIT_SHA" --arg version "$RELEASE_VERSION" '.schema_version == 1 and .commit_sha == $commit and .version == $version and .target == "x86_64-pc-windows-msvc" and .signed == false and .timestamped == false and .verification == "explicit-unsigned-publication-exception"' "${signing_provenance}" >/dev/null
            printf '%s\n' 'Windows artifact is intentionally unsigned for this publication.' > target/dist/WINDOWS-UNSIGNED.txt
          else
            printf '%s\n' 'Windows signing provenance does not satisfy publication policy.' >&2
            exit 1
          fi

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ inputs.commit_sha }}
          name: Bcode ${{ inputs.version }}
          files: target/dist/*
          fail_on_unmatched_files: true
