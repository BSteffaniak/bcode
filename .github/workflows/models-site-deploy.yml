name: Deploy Models Site

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [master]
    paths:
      - ".github/workflows/models-site-deploy.yml"
      - "workers/models-catalog/**"
      - "packages/model-catalog/**"
      - "packages/model-catalog/models/**"
      - "packages/model-discovery/**"
      - "packages/models-site/**"
      - "packages/models-site/ui/**"
      - "catalog/models/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate model catalog
        run: cargo run --release -p bcode_model_catalog -- validate

      - name: Discover Bedrock models and normalized pricing
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          export BCODE_MODEL_DISCOVERY_GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cargo run --release -p bcode_model_discovery -- bedrock \
            --regions us-east-1,us-west-2 \
            --require-pricing \
            --output target/model-live/bedrock.json
          python3 -c 'import json; data=json.load(open("target/model-live/bedrock.json")); models=list(data["models"].values()); priced=[model for model in models if model.get("pricing")]; assert models, "Bedrock discovery returned no models"; assert priced, "Bedrock discovery returned no priced models"; print(f"validated {len(priced)}/{len(models)} priced Bedrock models")'

      - name: Build static models site
        run: cargo run --release -p bcode_models_site -- gen --output dist

      - name: Build catalog artifacts with live snapshots
        run: cargo run --release -p bcode_model_catalog -- build --output dist/v1 --live target/model-live

      - name: Verify published Bedrock pricing seed
        run: |
          test -f dist/v1/live/bedrock.json
          python3 -c 'import json; data=json.load(open("dist/v1/live/bedrock.json")); models=list(data["models"].values()); priced=[model for model in models if model.get("pricing")]; assert priced, "published Bedrock live seed has no priced models"; print(f"published {len(priced)}/{len(models)} priced Bedrock models")'

      - name: Check Worker syntax and tests
        run: |
          node --check workers/models-catalog/src/worker.js
          node --test workers/models-catalog/worker.test.js

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Configure production Worker secrets
        if: ${{ github.event.inputs.environment != 'preview' }}
        working-directory: workers/models-catalog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          INTERNAL_REFRESH_TOKEN: ${{ secrets.INTERNAL_REFRESH_TOKEN }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$INTERNAL_REFRESH_TOKEN"
          printf '%s' "$AWS_ACCESS_KEY_ID" | wrangler secret put AWS_ACCESS_KEY_ID
          printf '%s' "$AWS_SECRET_ACCESS_KEY" | wrangler secret put AWS_SECRET_ACCESS_KEY
          if [ -n "$AWS_SESSION_TOKEN" ]; then
            printf '%s' "$AWS_SESSION_TOKEN" | wrangler secret put AWS_SESSION_TOKEN
          fi
          printf '%s' "$INTERNAL_REFRESH_TOKEN" | wrangler secret put INTERNAL_REFRESH_TOKEN

      - name: Configure preview Worker secrets
        if: ${{ github.event.inputs.environment == 'preview' }}
        working-directory: workers/models-catalog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          INTERNAL_REFRESH_TOKEN: ${{ secrets.INTERNAL_REFRESH_TOKEN }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$INTERNAL_REFRESH_TOKEN"
          printf '%s' "$AWS_ACCESS_KEY_ID" | wrangler secret put AWS_ACCESS_KEY_ID --env preview
          printf '%s' "$AWS_SECRET_ACCESS_KEY" | wrangler secret put AWS_SECRET_ACCESS_KEY --env preview
          if [ -n "$AWS_SESSION_TOKEN" ]; then
            printf '%s' "$AWS_SESSION_TOKEN" | wrangler secret put AWS_SESSION_TOKEN --env preview
          fi
          printf '%s' "$INTERNAL_REFRESH_TOKEN" | wrangler secret put INTERNAL_REFRESH_TOKEN --env preview

      - name: Deploy production Worker and assets
        if: ${{ github.event.inputs.environment != 'preview' }}
        working-directory: workers/models-catalog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Deploy preview Worker and assets
        if: ${{ github.event.inputs.environment == 'preview' }}
        working-directory: workers/models-catalog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --env preview
