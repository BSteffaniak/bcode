name: Bcode prompt
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Arbitrary task for Bcode (trusted maintainers only)
        required: true
        type: string
      auth-mode:
        description: Explicit authentication mode (no fallback)
        type: choice
        options: [broker-oidc, direct]
        default: broker-oidc
      timeout-secs:
        description: Execution budget; broker budget must fit actual OIDC lease minus 10 seconds
        default: '120'
        type: string
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: bcode-prompt
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.0
        id: rust
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libclang-dev cmake
      - name: Stage deterministic committed build source
        shell: bash
        run: |
          set -euo pipefail
          mkdir .bcode-ci-source
          mkdir -p "$RUNNER_TEMP/bcode-ci-target/release"
          git archive HEAD | tar -x -C .bcode-ci-source
      - name: Build or restore source binary
        uses: BSteffaniak/cache-artifact@d6e8db732a6386ed62cfc72146d012d4ff634e53
        with:
          directory: .bcode-ci-source
          working-directory: ${{ runner.temp }}/bcode-ci-target/release
          github-token: ${{ github.token }}
          command: cargo build --manifest-path '${{ github.workspace }}/.bcode-ci-source/Cargo.toml' --locked --release -p bcode --bin bcode --no-default-features --features app,static-bundled-plugins --target-dir '${{ runner.temp }}/bcode-ci-target'
          output-path: ${{ runner.temp }}/bcode-ci-target/release/bcode
          artifact-name: bcode-ci-ubuntu24-x64-${{ steps.rust.outputs.cachekey }}
          cache-key-prefix: bcode-ci-ubuntu24-x64-static-v1-${{ steps.rust.outputs.cachekey }}
          make-executable: true
          verify-command: --version
      - name: Stage trusted binary and policy outside checkout
        id: staged
        shell: bash
        env:
          BUILT_BINARY: ${{ runner.temp }}/bcode-ci-target/release/bcode
        run: |
          set -euo pipefail
          umask 077
          directory=$(mktemp -d "$RUNNER_TEMP/bcode-inputs.XXXXXXXX")
          install -m 700 "$BUILT_BINARY" "$directory/bcode"
          install -m 600 .github/bcode/ci-agent.toml "$directory/agent.toml"
          printf 'binary=%s\nagent-config=%s\n' "$directory/bcode" "$directory/agent.toml" >> "$GITHUB_OUTPUT"
      - name: Prepare explicit direct API configuration
        if: inputs.auth-mode == 'direct'
        id: config
        shell: bash
        env:
          MODEL: ${{ vars.BCODE_ACTION_MODEL }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$MODEL" =~ ^[a-zA-Z0-9._/-]+$ ]] || { echo 'Configure BCODE_ACTION_MODEL explicitly'; exit 1; }
          directory=$(mktemp -d "$RUNNER_TEMP/bcode-config.XXXXXXXX")
          cat > "$directory/bcode.toml" <<EOF
          [model.profiles.github]
          provider_plugin_id = "bcode.openai-compatible"
          model_id = "$MODEL"
          auth_profile = "github-api"
          [model.profiles.github.settings]
          auth_mode = "api_key"
          base_url = "https://api.openai.com/v1"
          dialect = "responses_api"
          [auth.profiles.github-api]
          backend = "env"
          provider_id = "openai"
          owner_plugin_id = "bcode.openai-compatible"
          scheme = "api_key"
          [auth.profiles.github-api.map.api_key]
          env = "BCODE_ACTION_API_KEY"
          EOF
          printf 'path=%s\n' "$directory/bcode.toml" >> "$GITHUB_OUTPUT"
      - name: Execute through broker
        if: inputs.auth-mode == 'broker-oidc'
        uses: ./.github/actions/run-bcode
        with:
          binary: ${{ steps.staged.outputs.binary }}
          auth-mode: broker-oidc
          broker-url: ${{ vars.BCODE_ACTION_BROKER_URL }}
          broker-audience: ${{ vars.BCODE_ACTION_BROKER_AUDIENCE }}
          agent: build
          agent-config: ${{ steps.staged.outputs.agent-config }}
          prompt: ${{ inputs.prompt }}
          timeout-secs: ${{ inputs.timeout-secs }}
      - name: Execute through direct API
        if: inputs.auth-mode == 'direct'
        uses: ./.github/actions/run-bcode
        env:
          BCODE_ACTION_API_KEY: ${{ secrets.BCODE_ACTION_API_KEY }}
        with:
          binary: ${{ steps.staged.outputs.binary }}
          auth-mode: direct
          config: ${{ steps.config.outputs.path }}
          profile: github
          agent: build
          agent-config: ${{ steps.staged.outputs.agent-config }}
          prompt: ${{ inputs.prompt }}
          timeout-secs: ${{ inputs.timeout-secs }}
