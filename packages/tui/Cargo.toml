[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Terminal user interface for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "tui"]
license     = { workspace = true }
name        = "bcode_tui"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
arboard                   = { workspace = true }
bcode_agent_profile       = { workspace = true }
bcode_build_info          = { workspace = true }
bcode_bundled_plugins     = { workspace = true }
bcode_client              = { workspace = true }
bcode_code_review_models  = { workspace = true }
bcode_command             = { workspace = true }
bcode_config              = { workspace = true }
bcode_ipc                 = { workspace = true }
bcode_markdown_render     = { workspace = true }
bcode_mermaid_render      = { workspace = true }
bcode_metrics             = { workspace = true }
bcode_model               = { workspace = true }
bcode_plugin              = { workspace = true }
bcode_plugin_sdk          = { workspace = true, features = ["tui"] }
bcode_provider_auth       = { workspace = true }
bcode_ralph               = { workspace = true }
bcode_server              = { workspace = true }
bcode_session_models      = { workspace = true }
bcode_session_search      = { workspace = true }
bcode_session_view        = { workspace = true }
bcode_session_view_models = { workspace = true }
bcode_settings            = { workspace = true }
bcode_skill_models        = { workspace = true }
bcode_syntax_render       = { workspace = true }
bcode_tool                = { workspace = true }
bcode_tui_components      = { workspace = true }
bcode_workflow            = { workspace = true }
bcode_workflow_store      = { workspace = true }
bcode_worktree_models     = { workspace = true }
bmux_image                = { workspace = true, features = ["iterm2", "kitty", "sixel"] }
bmux_keyboard             = { workspace = true }
bmux_terminal_grid        = { workspace = true }
bmux_text_edit            = { workspace = true }
bmux_tui                  = { workspace = true, features = ["crossterm"] }
bmux_tui_components       = { workspace = true, features = ["text-input"] }
bmux_tui_runtime          = { workspace = true, features = ["crossterm"] }
crossterm                 = { workspace = true, features = ["bracketed-paste", "events"] }
image                     = { workspace = true }
open                      = { workspace = true }
png                       = { workspace = true }
reqwest                   = { workspace = true, features = ["rustls-tls", "stream"] }
resvg                     = { workspace = true }
serde                     = { workspace = true, features = ["derive", "std"] }
serde_json                = { workspace = true }
thiserror                 = { workspace = true }
tokio                     = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing                   = { workspace = true }
unicode-segmentation      = { workspace = true }
url                       = { workspace = true }
uuid                      = { workspace = true, features = ["v4"] }

[dev-dependencies]
bcode_default_agents_plugin = { workspace = true, features = [
    "static-bundled",
] }
bcode_filesystem_plugin = { workspace = true, features = ["static-bundled"] }
bcode_git_plugin = { workspace = true, features = ["static-bundled"] }
bcode_hello_plugin = { workspace = true }
bcode_loop_plugin = { workspace = true, features = ["static-bundled"] }
bcode_progress_doc_plugin = { workspace = true, features = ["static-bundled"] }
bcode_question_plugin = { workspace = true, features = ["static-bundled"] }
bcode_shell_plugin = { workspace = true, features = ["static-bundled"] }
bcode_vim_edit_plugin = { workspace = true, features = ["static-bundled"] }
bcode_workflow_plugin = { workspace = true, features = ["static-bundled"] }
insta = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
fail-on-warnings = []
static-bundled-code-review-plugin = [
    "bcode_bundled_plugins/static-bundled-code-review-plugin",
]
static-bundled-filesystem-plugin = [
    "bcode_bundled_plugins/static-bundled-filesystem-plugin",
]
static-bundled-plugins = ["bcode_bundled_plugins/static-bundled-plugins"]
static-bundled-ralph-plugin = [
    "bcode_bundled_plugins/static-bundled-ralph-plugin",
]
static-bundled-shell-plugin = [
    "bcode_bundled_plugins/static-bundled-shell-plugin",
]
static-bundled-workflow-plugin = [
    "bcode_bundled_plugins/static-bundled-workflow-plugin",
]
