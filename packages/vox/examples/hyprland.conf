# Run the Vox user service in this graphical session first.
# Hold-to-talk: press starts, release stops. Do not use repeating binds.
bind = ALT, SPACE, exec, vox start
bindr = ALT, SPACE, exec, vox stop
# Toggle and cancel use independent bindings.
bind = ALT SHIFT, SPACE, exec, vox toggle
bind = ALT, ESCAPE, exec, vox cancel
