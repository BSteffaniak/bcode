[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Per-plugin configuration, state roots, and invocation secrets for bcode hosts"
edition     = { workspace = true }
keywords    = ["bcode", "plugin", "config"]
license     = { workspace = true }
name        = "bcode_plugin_config"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bcode_config        = { workspace = true }
bcode_plugin        = { workspace = true }
bcode_provider_auth = { workspace = true }
serde_json          = { workspace = true }
toml                = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
sshenv_vault = { workspace = true, features = [
    "linux-secret-service",
    "tpm-device-seal",
] }

[target.'cfg(target_os = "macos")'.dependencies]
sshenv_vault = { workspace = true, features = ["macos-keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
sshenv_vault = { workspace = true, features = ["windows-dpapi"] }

[target.'cfg(not(any(target_os = "linux", target_os = "macos", target_os = "windows")))'.dependencies]
sshenv_vault = { workspace = true }

[features]
default          = []
fail-on-warnings = []
