[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Scoped browser observation hosting and launch lifecycle"
edition     = { workspace = true }
keywords    = ["bcode", "diagnostics", "observability"]
license     = { workspace = true }
name        = "bcode_xray_inspector"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
axum                 = { workspace = true, features = ["http1", "json", "tokio"] }
bcode_client         = { workspace = true }
bcode_ipc            = { workspace = true }
bcode_session_models = { workspace = true }
bcode_xray           = { workspace = true }
bcode_xray_models    = { workspace = true }
futures-util         = { workspace = true, features = ["std"] }
libc                 = { workspace = true }
open                 = { workspace = true }
rand                 = { workspace = true }
serde                = { workspace = true, features = ["derive"] }
serde_json           = { workspace = true }
thiserror            = { workspace = true }
tokio                = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default          = []
fail-on-warnings = []
