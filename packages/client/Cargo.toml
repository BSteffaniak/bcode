[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Programmatic client API for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "client"]
license     = { workspace = true }
name        = "bcode_client"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bcode_agent_profile        = { workspace = true }
bcode_command              = { workspace = true }
bcode_config               = { workspace = true }
bcode_daemon_lifecycle     = { workspace = true }
bcode_ipc                  = { workspace = true }
bcode_metrics              = { workspace = true }
bcode_model                = { workspace = true }
bcode_model_catalog        = { workspace = true }
bcode_model_catalog_models = { workspace = true }
bcode_plugin_sdk           = { workspace = true }
bcode_provider_auth        = { workspace = true }
bcode_provider_auth_models = { workspace = true }
bcode_ralph_models         = { workspace = true }
bcode_session_import       = { workspace = true }
bcode_session_models       = { workspace = true }
bcode_session_search       = { workspace = true }
bcode_session_view_models  = { workspace = true }
bcode_skill_models         = { workspace = true }
bcode_tool                 = { workspace = true }
bcode_usage_models         = { workspace = true }
bcode_workflow             = { workspace = true }
bcode_workflow_store       = { workspace = true }
bcode_workflow_view_models = { workspace = true }
bcode_worktree_models      = { workspace = true }
bcode_xray                 = { workspace = true }
bcode_xray_models          = { workspace = true }
hex                        = { workspace = true }
reqwest                    = { workspace = true, features = ["json", "stream"] }
serde                      = { workspace = true, features = ["derive", "std"] }
serde_json                 = { workspace = true }
sha2                       = { workspace = true }
thiserror                  = { workspace = true }
tokio                      = { workspace = true, features = ["sync", "time"] }
tracing                    = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["test-util"] }

[features]
default          = []
fail-on-warnings = []
