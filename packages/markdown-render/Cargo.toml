[package]
authors     = { workspace = true }
categories  = ["development-tools", "rendering", "text-processing"]
description = "Markdown to terminal line rendering for Bcode"
edition     = { workspace = true }
keywords    = ["bcode", "markdown", "tui"]
license     = { workspace = true }
name        = "bcode_markdown_render"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bcode_syntax_render          = { workspace = true }
bmux_tui                     = { workspace = true }
hyperchad_color              = { workspace = true }
hyperchad_markdown           = { workspace = true, features = ["syntax-highlighting"] }
hyperchad_transformer        = { workspace = true }
hyperchad_transformer_models = { workspace = true }
pulldown-cmark               = { workspace = true }
unicode-segmentation         = { workspace = true }
unicode-width                = { workspace = true }
url                          = { workspace = true }

[dev-dependencies]
insta    = { workspace = true }
test-log = { workspace = true }

[features]
default          = []
fail-on-warnings = []
