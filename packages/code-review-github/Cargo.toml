[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "GitHub pull requests and stacks as a bcode code review source"
edition     = { workspace = true }
keywords    = ["bcode", "github", "code-review", "stacked-prs"]
license     = { workspace = true }
name        = "bcode_code_review_github"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bcode_code_review_models   = { workspace = true }
bcode_code_review_provider = { workspace = true }
bcode_forge                = { workspace = true, features = ["http"] }
chrono                     = { workspace = true }
serde_json                 = { workspace = true }
thiserror                  = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default          = []
fail-on-warnings = []
