[package]
authors     = { workspace = true }
categories  = ["command-line-interface", "development-tools"]
description = "Interactive terminal git client for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "git", "tui"]
license     = { workspace = true }
name        = "bcode_git_ui"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bcode_config_layers = { workspace = true }
bcode_forge_models = { workspace = true }
bcode_git = { workspace = true }
bcode_git_live = { workspace = true }
bcode_keymap = { workspace = true }
bcode_syntax_render = { workspace = true }
bcode_tui_theme = { workspace = true }
bmux_config_composition = { workspace = true }
bmux_keyboard = { workspace = true, features = ["crossterm"] }
bmux_pty = { workspace = true }
bmux_text_edit = { workspace = true }
bmux_tui = { workspace = true, features = ["crossterm"] }
bmux_tui_components = { workspace = true, features = [
    "modal-frame",
    "pane",
    "panel-group",
    "scroll-view",
    "selectable-list",
    "spinner",
    "tab-bar",
    "terminal-view",
    "text-input",
    "text-input-box",
] }
bmux_tui_runtime = { workspace = true, features = ["crossterm"] }
notify = { workspace = true, features = ["macos_fsevent"] }
regex = { workspace = true, features = ["std", "unicode"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
toml = { workspace = true, features = ["display"] }
yaml_serde = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default          = []
fail-on-warnings = []
