[package]
authors     = { workspace = true }
categories  = ["command-line-interface", "config"]
description = "Terminal theme definitions, discovery and bundled themes for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "theme", "tui"]
license     = { workspace = true }
name        = "bcode_tui_theme"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bcode_presentation_policy_models = { workspace = true }
bmux_color                       = { workspace = true, features = ["serde"] }
bmux_tui                         = { workspace = true, features = ["serde"] }
serde                            = { workspace = true, features = ["derive", "std"] }
thiserror                        = { workspace = true }
toml                             = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
tempfile   = { workspace = true }

[features]
default = []
fail-on-warnings = [
    "bcode_presentation_policy_models/fail-on-warnings",
    "bmux_color/fail-on-warnings",
]
