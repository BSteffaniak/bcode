# Upstream reference for the `everforest` palette. Values were extracted by script
# from `everforest#get_palette()` in autoload/everforest.vim and the highlight
# definitions in colors/everforest.vim at `revision`, evaluated with upstream's
# default configuration from `everforest#get_configuration()`: background =
# "medium", float_style = "bright", ui_contrast = "low", transparent_background
# = 0, running under Neovim. Highlight links are resolved to their final color; see
# attribution/UPSTREAM.md. The hard and soft background options are not bundled.
#
# * `@markup.raw.markdown_inline` is not defined, so the capture falls back to
#   `@markup.raw`; it sets no background, so `markup_code_bg` is omitted.
# * `accent` is green, Everforest's signature color; the scheme has one purple,
#   so `violet` is omitted.
# * `muted` is grey2, the PmenuExtra foreground (secondary menu text);
#   `comment` and `border_focused` are grey1.
# * Refined syntax captures link through the scheme's TS* groups: `@constant` ->
#   TSConstant -> Fg, `@variable.parameter` -> TSParameter -> Fg, `@property` ->
#   TSProperty -> Blue, `@function.builtin` -> TSFuncBuiltin -> Green,
#   `@tag` -> TSTag -> Orange, `@tag.attribute` -> TSTagAttribute -> Green.
#
# Terminal colors: g:terminal_color_0..15 set in the `Terminal:` section of
# colors/everforest.vim (the Neovim branch; it runs with termguicolors and the default
# disable_terminal_colors = 0), from its `s:terminal` table; colors 8-15 repeat 0-7.
# No terminal default foreground/background is defined, so `terminal_fg`/`terminal_bg`
# are omitted.
palette  = "everforest"
scheme   = "Everforest (dark; light: light), background medium"
source   = "https://github.com/sainnhe/everforest"
revision = "85a86eb62409e3ec88713bff3d1b9d7374e112e4"
license  = "MIT"

[variants.dark]
file = "autoload/everforest.vim, colors/everforest.vim"

