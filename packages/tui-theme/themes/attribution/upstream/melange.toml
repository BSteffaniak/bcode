# Upstream reference for the `melange` palette. Values were extracted by script from
# lua/melange/palettes/{dark,light}.lua (palette names are recorded as
# `<group>.<name>`: a = grays, b = bright, c = foreground, d = background colors)
# and the highlight table in colors/melange.lua at `revision`. Highlight links are
# resolved to their final color; see attribution/UPSTREAM.md.
#
# Groups melange leaves undefined resolve through Neovim's built-in default links
# (src/nvim/highlight_group.c, neovim/neovim@779c3696, v0.12.6) and capture
# fallback: `@keyword` -> Keyword -> Statement, `@markup.raw.markdown_inline` ->
# `@markup.raw`, which sets no background, so `markup_code_bg` is omitted.
#
# * `@markup.link` sets only underline, so `markup_link` is `@markup.link.url`.
# * `FloatBorder` is undefined and its default link NormalFloat sets no
#   foreground, so `border_focused` is omitted.
# * `diffAdded`/`diffRemoved` are undefined and `DiffAdded`/`@diff.plus` link to
#   DiffAdd, which sets only a background; the git text colors are taken from
#   GitSignsAdd/GitSignsDelete (MiniDiffSignAdd/MiniDiffSignDelete). DiffDelete
#   sets the removed row text (a.com), so only `diff_remove_row_fg` is mapped.
# * `accent` is b.yellow, Melange's signature warm yellow; `orange` is c.yellow, the
#   scheme's orange; melange has no separate violet, so `violet` is omitted.
# * `muted` is a.com, the StatusLineNC foreground (also the comment color).
# * Refined syntax captures: `@constant` -> Identifier (a.fg); `@variable.parameter`
#   and `@property` are undefined (commented out upstream) and resolve to `@variable`
#   -> Identifier and default link Identifier (a.fg); `@function.builtin` ->
#   `@function` (undefined) -> default link Function (b.yellow); `@tag` is undefined:
#   default link Tag -> Special (b.yellow); `@tag.attribute` -> `@label` (b.cyan).
#
# Terminal colors: vim.g.terminal_color_0..15 assigned unconditionally at the end of
# colors/melange.lua from the active palette. No terminal default
# foreground/background is defined, so `terminal_fg`/`terminal_bg` are omitted.
palette  = "melange"
scheme   = "Melange (dark; light: light)"
source   = "https://github.com/savq/melange-nvim"
revision = "ce42f6b629beeaa00591ba73a77d3eeac4cf28ce"
license  = "MIT"

