# Upstream reference for the `vesper` palette. Values are copied exactly from
# `file` at `revision`; see attribution/UPSTREAM.md.
#
# Read from datsfilipe/vesper.nvim: the colors table in lua/vesper/colors.lua
# and the groups in set_groups() of lua/vesper/init.lua, with default options
# (not transparent). Several colors are computed by the port's utils.mix
# (per channel alpha*fg + (1-alpha)*bg, rounded half up) or utils.shade
# (mix toward #ffffff unless a base is given); the values here reproduce those
# formulas exactly: fg = mix(#FFFFFF, #000000, 0.80), green and greenLight =
# mix(#99FFE4, #000000, 0.85), comment = mix(#8b8b8b, #000000, 0.90),
# Visual.bg = shade(bgDarker, 0.70), DiffAdd.fg = shade(green, 0.5, bg),
# DiffDelete.fg = shade(red, 0.5, bg). Group names are case-insensitive
# (the port's `Winseparator` links WinSeparator to VertSplit). Captures the port
# leaves undefined follow Neovim's default links (neovim/neovim v0.12.6
# src/nvim/highlight_group.c): @markup.heading -> Title, @markup.raw and
# @markup.list -> @markup -> Special.
#
# Vesper names no blue, cyan, or yellow; those hues use the port's own terminal
# colors (terminal_color_4 greenLight, terminal_color_6 primary,
# terminal_color_3 yellowDark). magenta is the port's `purple` (also the function
# color). accent is yellowDark, Vesper's signature peach (also `warn`). muted is fgInactive (StatusLineNC),
# border_focused the palette's borderFocus. The port draws diff rows on the
# normal background (DiffAdd/DiffDelete bg = bg) in the diff text colors.
# Omitted: markup_link
# (@markup.link -> Underlined has no color), markup_code_bg (no background),
# success (no DiagnosticOk).
#
# Refined syntax slots: @constant -> Constant, @function.builtin -> Function,
# @tag -> Tag (port links); @property and @tag.attribute have their own colors;
# @variable.parameter is undefined (the port defines only the legacy
# @parameter) and falls back to @variable.
# Terminal colors: vim.g.terminal_color_0..15 set by set_terminal_colors() in
# lua/vesper/init.lua (always called when the scheme loads). terminal_fg and
# terminal_bg are omitted: the vim.g.terminal_color_foreground/background it
# also sets are ignored by Neovim (:terminal uses Normal).
palette  = "vesper"
scheme   = "Vesper"
source   = "https://github.com/datsfilipe/vesper.nvim"
revision = "1717b1ad657c94bec3fc2bdebb0c55452d9fe46d"
license  = "MIT"

[variants.dark]
file = "lua/vesper/colors.lua + lua/vesper/init.lua"

