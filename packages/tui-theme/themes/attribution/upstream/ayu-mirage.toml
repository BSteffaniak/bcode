# Upstream reference for the `ayu-mirage` palette. Values are copied exactly from
# `file` at `revision`; see attribution/UPSTREAM.md.
#
# ayu's canonical palette (ayu-theme/ayu-colors, themes/*.yaml) defines most
# editor colors as OKLCH lightness steps, translucent colors, and culori
# gamut-mapped modifiers, and ships no resolved artifact in git (the hex values
# are generated into the npm package only). Re-implementing that pipeline exactly
# is not possible from the repository alone, so the colors come from
# Shatur/neovim-ayu, the Neovim port listed in sources.toml, whose
# lua/ayu/colors.lua carries ayu's colors as resolved opaque hex per style
# (dark, mirage, light), and whose lua/ayu/init.lua maps them to highlight
# groups. Tree-sitter captures the port leaves undefined follow Neovim's
# compiled-in default links (neovim/neovim v0.12.6, src/nvim/highlight_group.c):
# @keyword -> Keyword -> Statement, @number -> Number -> Constant,
# @punctuation.delimiter -> @punctuation -> Delimiter, @markup.raw and
# @markup.list -> @markup -> Special.
#
# Hue names follow ayu's syntax palette: blue = entity, cyan = regexp,
# green = string, magenta = constant, orange = keyword, red = markup,
# yellow = func. ayu has no separate violet. muted is ayu's idle foreground
# (fg_idle). Omitted slots: markup_link (@markup.link links to Underlined,
# which the port gives only an underline color), markup_code_bg
# (@markup.raw.markdown_inline has no background).
#
# Refined syntax slots: @constant -> Constant and @function.builtin -> Special
# by Neovim default links (the port defines neither capture); @property,
# @variable.parameter, @tag, @tag.attribute are defined by the port.
# Terminal colors: vim.g.terminal_color_0..15 set by set_terminal_colors() in
# lua/ayu/init.lua (enabled by the default `terminal = true` in
# lua/ayu/config.lua). terminal_fg/terminal_bg are omitted: the
# vim.g.terminal_color_foreground/background it also sets are ignored by Neovim
# (:terminal uses Normal), so they are not what the scheme shows.
palette  = "ayu-mirage"
scheme   = "ayu (mirage)"
source   = "https://github.com/Shatur/neovim-ayu"
revision = "e5a9f0fa2918d6b5f57c21b3ac014314ee5e41c8"
license  = "GPL-3.0"

[variants.dark]
file = "lua/ayu/colors.lua (colors.generate, mirage) + lua/ayu/init.lua"

