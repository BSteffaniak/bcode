# Upstream reference for the `poimandres` palette. Palette values were extracted by
# script from `file` at `revision` (the `main` variant); highlight groups come from
# lua/poimandres/theme.lua with the default config in lua/poimandres/init.lua
# (groups: background = background2, panel/border = background3, punctuation =
# blue3, error = pink3, info = blue3, warn = yellow, git_add = teal1, git_delete =
# pink3). DiffAdd/DiffDelete are computed with utils.blend(git color,
# background2, 0.5), which the script reproduces exactly: each 0-255 channel is
# 0.5 * fg + 0.5 * bg rounded with floor(x + 0.5). Groups the theme leaves
# undefined resolve through Neovim's default links (src/nvim/highlight_group.c at
# neovim v0.12.6): WinSeparator -> VertSplit, @number -> Number, @markup.heading
# -> Title, @markup.raw, @markup.raw.markdown_inline and @markup.list -> @markup
# -> Special. diffAdded/diffRemoved link to DiffAdd/DiffDelete, which set only a
# background, so diff_add/diff_remove use the git colors (GitSignsAdd/
# GitSignsDelete). Omitted, because upstream defines no color: orange, violet,
# success (no DiagnosticOk), markup_link (@markup.link -> Underlined, no color)
# and markup_code_bg. Poimandres names its colors by family (teal1, blue1-4,
# pink1-3); hues map by family and diagnostic use: blue2 blue (the Function
# color), blue1 cyan, teal1 green (also accent, Poimandres's signature teal), pink2 magenta, pink3 red
# (DiagnosticError), yellow. muted is blueGray1, the secondary foreground used
# by Pmenu, Comment, Identifier, Type and Delimiter. The repository ships no
# license file, so `license` is NOASSERTION; the original theme,
# github.com/drcmda/poimandres-theme, is MIT.
palette  = "poimandres"
scheme   = "Poimandres"
source   = "https://github.com/olivercederborg/poimandres.nvim"
revision = "a488957d803943a4201ac3b774913fcafa9e6b3a"
license  = "NOASSERTION"

[variants.dark]
file = "lua/poimandres/palette.lua"

