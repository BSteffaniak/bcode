# Upstream reference for the `nord` palette. Nord has no official Neovim port;
# the official editor theme, Nord Visual Studio Code (`file` at `revision`), is
# the source of the slot mapping: its `colors` (workbench) and `tokenColors`
# (TextMate scopes), resolved as VS Code does (a scope rule also colors its
# more specific scopes, so variable.other.property takes `variable.other`).
# Upstream writes token hex in uppercase; values here are lowercase.
# The named palette colors nord0..nord15 come from the palette specification,
# src/nord.scss in https://github.com/nordtheme/nord at
# 1cef71605416a222e57225b544540ce0fcec18d4 (MIT); the hues use those names
# (blue is nord9, which is also the terminal blue; nord10, the darker
# import/preprocessor blue, has no slot). Nord has no purple distinct from
# magenta (nord15), so violet is omitted.
#
# The accent is nord8 (#88c0d0): the specification names it "the accent color
# of the color palette ... main color for primary UI elements", and the VS Code
# theme leads its UI with it (textLink, activityBar.activeBorder,
# list.activeSelectionBackground). success is nord14, which the specification
# names the color of "success visualizations"; info is
# debugConsole.infoForeground (nord8; VS Code defines no editorInfo color).
# surface is the hover widget (editorWidget.background is the canvas itself).
# selection: editor.selectionBackground is #434c5ecc (translucent); the slot
# uses upstream's opaque value of the same color, editorSuggestWidget's
# selected background (#434c5e, nord2, which the specification names the
# selection color). diff_add/diff_remove are markup.inserted/markup.deleted.
# Not mapped, because upstream defines no opaque equivalent: `muted` (the
# secondary foregrounds descriptionForeground #d8dee9e6 and
# tab.inactiveForeground #d8dee966 are translucent), the diff row fills
# (diffEditor.insertedTextBackground #81a1c133 and removedTextBackground
# #bf616a4d are translucent), and `markup_code_bg` (inline raw sets no
# background). Markdown roles read the `text.html.markdown` rules.
# Terminal colors: terminal.ansiBlack .. terminal.ansiBrightWhite and the
# terminal default terminal.foreground / terminal.background from the same
# file (the same sixteen colors nordtheme/vim sets as g:terminal_color_0..15).
palette  = "nord"
scheme   = "Nord"
source   = "https://github.com/nordtheme/visual-studio-code"
revision = "8ead09822c02d0d49d0f764104505e5a34d3689f"
license  = "MIT"

[variants.dark]
file = "themes/nord-color-theme.json; named colors: src/nord.scss (nordtheme/nord @ 1cef71605416a222e57225b544540ce0fcec18d4)"

