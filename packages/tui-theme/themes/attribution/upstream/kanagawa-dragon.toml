# Upstream reference for the `kanagawa-dragon` palette: kanagawa.nvim's dragon
# theme (dark only).
#
# Values were extracted by script from `file` at `revision`: the palette in
# colors.lua, the theme tables in themes.lua (each `ui`/`syn`/`diag`/`vcs`/`diff`
# entry is recorded under that path, for example `syn.fun`), and the highlight
# tables in highlights/{editor,syntax,treesitter,lsp,plugins}.lua, with the default
# configuration (transparent = false, dimInactive = false, no overrides). Highlight
# links are resolved to their final color; see attribution/UPSTREAM.md.
#
# Groups kanagawa.nvim leaves undefined resolve through Neovim's built-in default
# links (src/nvim/highlight_group.c, neovim/neovim@779c3696, v0.12.6) and capture
# fallback: `@keyword` -> Keyword, `@function` -> Function, `@string` -> String,
# `@number` -> Number, `@type` -> Type, `@markup.link` -> Underlined, `@markup.list`
# -> `@markup` -> Special, and `@markup.raw.markdown_inline` -> `@markup.raw`, which
# sets no background, so `markup_code_bg` is omitted. DiffDelete sets the removed
# row text (vcs.removed); DiffAdd sets only a fill, so `diff_add_row_fg` is omitted.
#
# Hues follow the theme's syntax roles so every flavor maps alike: blue = syn.fun,
# cyan = syn.type, green = syn.string, magenta = syn.number, orange = syn.constant,
# red = syn.special3, violet = syn.keyword, yellow = syn.identifier. `muted` is
# ui.fg_dim ("Dimmed foreground", the StatusLine foreground).
palette  = "kanagawa-dragon"
scheme   = "Kanagawa (dragon)"
source   = "https://github.com/rebelot/kanagawa.nvim"
revision = "bb85e4bfc8d89b0e62c8fa53ccdd13d12e2f77b3"
license  = "MIT"

[variants.dark]
file = "lua/kanagawa/colors.lua, lua/kanagawa/themes.lua, lua/kanagawa/highlights/*.lua"

