# Upstream reference for the `oxocarbon` palette. Values were extracted by script
# from `file` at `revision` (the compiled Lua of fnl/oxocarbon/init.fnl), using the
# dark table (vim.o.background == "dark"). base01-base05 are computed at load
# with blend-hex (an HSLuv blend of base00 and base06); the script ports
# lua/oxocarbon/colorutils.lua line by line (HSLuv conversion, radial hue and
# linear saturation/lightness tween, rgb->hex with floor(x * 255 + 0.5)) and
# reproduces IBM Carbon's grays (#262626, #393939, #525252) for base01-base03.
# Groups are resolved from the last nvim_set_hl call for each name, following
# links (names are case-insensitive, so DiffAdded/DiffRemoved define
# diffAdded/diffRemoved): @string -> String, @number -> Number (the later of
# the two @number definitions), @type -> Type, @operator -> Operator,
# @markup.heading -> Title, @markup.link -> markdownUrl -> String,
# @markup.raw(.markdown_inline) -> String, @markup.list -> markdownListMarker.
# Oxocarbon has numbered colors, not hue names; hues follow each color's hue and
# its diagnostic use: base09 blue (primary blue, also DiagnosticInfo), base08
# cyan, base13 green, base12 magenta, base10 red (DiagnosticError), base14
# violet (also DiagnosticWarn). accent is base14, Oxocarbon's signature purple. The scheme has no yellow or orange, no
# DiagnosticOk and no secondary foreground (StatusLine uses Normal's fg), so
# yellow, orange, success and muted are omitted, as is markup_code_bg (String
# sets no background). FloatBorder paints `blend` on `blend`, so the focused
# border equals the float surface.
palette  = "oxocarbon"
scheme   = "Oxocarbon (dark)"
source   = "https://github.com/nyoom-engineering/oxocarbon.nvim"
revision = "cd6523a0836d6e8ee823d343149fd06c7b71fdde"
license  = "MIT"

[variants.dark]
file = "lua/oxocarbon/init.lua"

[variants.dark.colors]
"@function.fg"                   = "#ff7eb6"
"@keyword.fg"                    = "#78a9ff"
"@markup.heading.fg"             = "#d0d0d0"
"@markup.link.fg"                = "#be95ff"
"@markup.list.fg"                = "#3ddbd9"
"@markup.raw.fg"                 = "#be95ff"
