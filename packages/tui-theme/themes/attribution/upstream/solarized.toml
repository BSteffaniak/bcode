# Upstream reference for the `solarized` palette. Values are copied exactly from
# `file` at `revision`; see attribution/UPSTREAM.md.
#
# Colors are the canonical Solarized values from altercation/solarized
# README.md at `revision` (the `$base03: #002b36;` palette block). Which value
# each group uses comes from the original Vim scheme by the same author,
# altercation/vim-colors-solarized @ 528a59f26d12278698bb946f8fb82a63711eec21,
# colors/solarized.vim, read in its gui branch with default options
# (diffmode normal, contrast normal); light mode swaps base03<->base3,
# base02<->base2, base01<->base1, base00<->base0 exactly as the scheme does.
# The scheme's gui branch uses an "experimental" green (#719e07); the palette
# keeps the canonical README green (#859900) the scheme references by name.
#
# The scheme targets Vim, so groups it leaves undefined follow Vim's default
# syntax links (vim/vim v9.2.1373 runtime/syntax/syncolor.vim): Function ->
# Identifier, Keyword and Operator -> Statement, String and Number -> Constant,
# Delimiter -> Special. Tree-sitter captures reach them through Neovim's default
# links (neovim/neovim v0.12.6 src/nvim/highlight_group.c); @markup.raw and
# @markup.list fall back to @markup -> Special, @markup.link -> Underlined.
# Group keys below name the group a slot reads after following those links.
# muted is base01 (base1 in light), the README's "comments / secondary content".
#
# Omitted slots: selection and surface (Visual and Pmenu use reverse video,
# which has no fill-only equivalent), border_focused (no float border),
# info/warning/error (no diagnostic groups), syntax_variable (no group; plain
# Normal text), markup_code_bg (no background).
palette  = "solarized"
scheme   = "Solarized (dark; light: light)"
source   = "https://github.com/altercation/solarized"
revision = "62f656a02f93c5190a8753159e34b385588d5ff3"
license  = "MIT"

