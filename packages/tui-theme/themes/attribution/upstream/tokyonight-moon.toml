# Upstream reference for the `tokyonight-moon` palette. Values are copied exactly from
# `file` at `revision`; see attribution/UPSTREAM.md.
# Terminal colors: the `terminal` table, which lua/tokyonight/theme.lua assigns to
# vim.g.terminal_color_0..15 (`terminal_colors = true` by default). Undefined
# captures resolve through their parent capture and Neovim's default links.
palette  = "tokyonight-moon"
scheme   = "Tokyo Night (moon)"
source   = "https://github.com/folke/tokyonight.nvim"
revision = "cdc07ac78467a233fd62c493de29a17e0cf2b2b6"
license  = "Apache-2.0"

[variants.dark]
file = "extras/lua/tokyonight_moon.lua"

[variants.dark.colors]
