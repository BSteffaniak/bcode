# Upstream reference for the `dracula` palette. Values are copied exactly from
# `file` at `revision` (palette plus highlight groups, links resolved; default
# options: colorterm on, high_contrast_diff off); see attribution/UPSTREAM.md.
# Upstream writes hex in uppercase; values here are lowercase.
#
# Dracula has no blue: purple is its ANSI blue and primary accent, so
# `accent`, `blue` and `violet` are purple (Function is green).
# Not mapped, because upstream defines no equivalent: `muted` (no secondary
# foreground; `subtle` is a background shade), `success`, `border_focused`
# (FloatBorder is undefined), and diff row fills (DiffAdd sets only a green
# foreground; DiffDelete's bgdark is the deleted-line filler).
# @markup.link links to Underlined (plain foreground, underlined);
# @markup.raw.markdown_inline falls back to @markup.raw (no background).
# Terminal colors: colors/dracula_base.vim sets g:terminal_color_0..15 (Neovim)
# and g:terminal_ansi_colors (Vim) from g:dracula#palette.color_0..15
# (autoload/dracula.vim); upstream defines no terminal default fg/bg.
#
# The light variant is Alucard (colors/alucard.vim), which overrides the
# palette (including color_0..15) and relinks Pmenu (and so NormalFloat)
# to bglighter.
palette  = "dracula"
scheme   = "Dracula (dark; light: Alucard)"
source   = "https://github.com/dracula/vim"
revision = "c689958744a93851b870e17ede7e9cbd28bc7cf8"
license  = "MIT"

[variants.dark]
file = "autoload/dracula.vim, colors/dracula_base.vim"

