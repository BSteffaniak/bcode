# Upstream reference for the `night-owl` palette. Palette values were extracted
# by script from `file` at `revision`; highlight groups come from
# lua/night-owl/theme.lua with the default options. Every value is a literal
# palette entry (no computed colors). Captures night-owl leaves undefined resolve
# through Neovim's default links (src/nvim/highlight_group.c and
# runtime/syntax/diff.vim at neovim v0.12.6, 779c36969e31080503be2dfccbcc3f999e289606):
# @keyword -> Keyword, @function -> Function, @string -> String, @number -> Number,
# @operator -> Operator, @punctuation.delimiter -> @punctuation -> Delimiter,
# @markup.heading -> Title, and @markup.raw, @markup.raw.markdown_inline and
# @markup.list -> @markup -> Special. The theme's @text.* groups are legacy
# captures current queries no longer emit, so they are not used. Omitted, because
# the scheme defines no color for them: info, warning and success
# (DiagnosticWarn/Info/Ok keep Neovim's defaults), muted (StatusLine uses the
# primary fg; there is no secondary fg), markup_link (@markup.link resolves to
# Underlined, which has no color) and markup_code_bg. diffAdded/diffRemoved also
# keep Neovim's defaults, so diff_add/diff_remove use the scheme's git colors
# (GitSignsAdd/GitSignsDelete). DiffAdd/DiffDelete paint dark text (bg) on a
# full sign_add/sign_delete fill: diff_add_bg/diff_remove_bg are the fills and
# diff_add_row_fg/diff_remove_row_fg the row text. NormalFloat uses the editor
# background, so surface equals background. purple is distinct from magenta and
# maps to violet. Hue names follow the palette (cyan, green, red, yellow), not the
# terminal colors. Refined captures: @constant -> Constant; @variable.parameter
# is undefined (only the legacy @parameter and per-language captures are set)
# and falls back to @variable; @property and @tag.attribute are set directly;
# @function.builtin -> Special and @tag -> Tag through Neovim's default links.
# Terminal colors: vim.g.terminal_color_0..15 set in lua/night-owl/theme.lua.
# terminal_fg/terminal_bg are omitted: theme.lua's only terminal default colors
# are the Vim `Terminal` group, which Neovim does not use (its :terminal uses
# Normal), and its fg/bg equal Normal's.
palette  = "night-owl"
scheme   = "Night Owl"
source   = "https://github.com/oxfist/night-owl.nvim"
revision = "86ed124c2f7e118670649701288e024444bf91e5"
license  = "BSD-3-Clause"

[variants.dark]
file = "lua/night-owl/palette.lua"

