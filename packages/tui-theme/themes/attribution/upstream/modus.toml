# Upstream reference for the `modus` palette. Values are copied exactly from
# `file` at `revision`; see attribution/UPSTREAM.md.
#
# Read from the generated, fully resolved extras of miikanissi/modus-themes.nvim
# (extras/lua/modus_vivendi.lua for dark, modus_operandi.lua for light, default
# variant): the colors table and the resolved highlight groups. Links are
# followed to the final color (diffAdded -> DiffAdd, diffRemoved -> DiffDelete).
# DiffAdd/DiffDelete set the diff row text (fg_added/fg_removed) and fills.
# Modus names no orange; `orange` is yellow_warmer and `violet` is
# magenta_cooler. muted is fg_dim. Captures the port leaves undefined follow
# Neovim's default links (neovim/neovim v0.12.6 src/nvim/highlight_group.c);
# slots whose groups have no color are omitted (see the slots table).
#
# Refined syntax slots resolve through the port's links: @constant -> Constant,
# @property -> @variable.member -> Identifier, @function.builtin -> Special,
# @tag -> Label, @tag.attribute -> @property -> @variable.member -> Identifier;
# @variable.parameter has its own color.
# Terminal colors: vim.g.terminal_color_0..15 set by M.terminal in
# lua/modus-themes/util.lua (always applied by M.load) from the colors table,
# whose values are read from `file`. Upstream sets no terminal foreground or
# background.
palette  = "modus"
scheme   = "Modus (vivendi; light: operandi)"
source   = "https://github.com/miikanissi/modus-themes.nvim"
revision = "15ffb5ab6a12f72ee1e8393fe5810d5317da2d3e"
license  = "GPL-3.0"

[variants.dark]
file = "extras/lua/modus_vivendi.lua"

