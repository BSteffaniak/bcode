# Upstream reference for the `catppuccin-mocha` palette. Values are copied exactly from
# `file` at `revision` (palette file plus highlight groups, default options:
# no transparency, non-solid floats); see attribution/UPSTREAM.md.
#
# catppuccin/nvim ships no resolved extras. CursorLine, DiffAdd and DiffDelete
# backgrounds are computed upstream by utils/colors.lua `blend` (per channel
# floor(clamp(a*fg + (1-a)*bg) + 0.5)); the values here reproduce that
# algorithm exactly and are written lowercase (upstream formats them with %02X).
# `muted` is subtext0 (the style guide's sub-headline/label text).
# @markup.raw.markdown_inline is undefined upstream, so Markdown inline code
# falls back to @markup.raw (no background).
#
# The light variant is Catppuccin Latte.
palette  = "catppuccin-mocha"
scheme   = "Catppuccin (mocha; light: latte)"
source   = "https://github.com/catppuccin/nvim"
revision = "edefef779ab08ce1a4a404713e3012b0d202bd35"
license  = "MIT"

[variants.dark]
file = "lua/catppuccin/palettes/mocha.lua, lua/catppuccin/groups/{editor,syntax,lsp,treesitter}.lua"

[variants.dark.colors]
