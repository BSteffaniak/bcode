# Upstream reference for the `flexoki` palette. Values are copied exactly from
# `file` at `revision`; see attribution/UPSTREAM.md.
#
# Read from kepano/flexoki-neovim, the official Neovim port by Flexoki's author:
# lua/flexoki/palette.lua (base colors and the dark/light role tables
# bg, bg-2, ui, ui-2, ui-3, tx-3, tx-2, tx, re, or, ye, gr, cy, bl, pu, ma) and
# the enabled highlight modules base.lua and treesitter.lua, with default
# options (variant auto, float_window_style auto; Neovim's default empty
# winborder makes floats use `ui`). CursorLine.bg is computed by the port as
# util.blend(ui, bg, 0.65) (per channel alpha*fg + (1-alpha)*bg, rounded half
# up); the value here reproduces that formula exactly. Tree-sitter captures the
# port leaves undefined follow Neovim's default links (neovim/neovim v0.12.6
# src/nvim/highlight_group.c): @markup.heading -> Title, @markup.raw and
# @markup.list -> @markup -> Special; @punctuation.delimiter falls back to the
# port's @punctuation -> Delimiter -> Special.
#
# accent is Flexoki's blue (Title, Directory). muted is tx-2, Flexoki's muted
# text. diff_add/diff_remove use the Added/Removed groups; the row fills are the
# port's solid DiffAdd/DiffDelete backgrounds, under their own text colors
# (DiffAdd bg, DiffDelete bg-2). Omitted slots: markup_link
# (@markup.link -> Underlined has no color) and markup_code_bg (no background).
#
# Refined syntax slots: @constant -> Constant, @property -> Identifier,
# @function.builtin -> Special, @tag -> Tag (port links); @variable.parameter
# falls back to @variable -> Identifier and @tag.attribute to @tag -> Tag (the
# port defines only the legacy @parameter capture).
# Terminal colors: upstream defines none (the port sets no vim.g.terminal_color_*).
palette  = "flexoki"
scheme   = "Flexoki (dark; light: light)"
source   = "https://github.com/kepano/flexoki-neovim"
revision = "c3e2251e813d29d885a7cbbe9808a7af234d845d"
license  = "MIT"

[variants.dark]
file = "lua/flexoki/palette.lua + lua/flexoki/highlights/{base,treesitter}.lua"

