# Upstream reference for the `one` palette. Palette values were extracted by
# script from `file` at `revision` (styles `dark` and `light`); highlight groups
# come from lua/onedark/highlights.lua with the default config. The scheme has no
# computed colors in these groups. diffAdded/diffRemoved resolve through
# Neovim's default links to Added/Removed (green/red). DiagnosticOk (green) is
# the success color. muted is light_grey, the scheme's secondary foreground
# (Delimiter, @punctuation.delimiter); StatusLine uses the primary fg.
# @markup.raw.markdown_inline is undefined and falls back to @markup.raw, which
# sets no background, so markup_code_bg is omitted. purple is the scheme's only
# purple and maps to magenta; violet is omitted. In the light style upstream
# names the darker gold `yellow` (#986801) and the brighter one `orange`
# (#c18401); the palette follows upstream's names. The refined captures
# (@constant, @variable.parameter, @property, @function.builtin, @tag,
# @tag.attribute) are all set directly in hl.treesitter. Terminal colors:
# vim.g.terminal_color_0..15 set in lua/onedark/terminal.lua (term_colors = true
# by default; 7 and 15 are fg, 8 is grey, 9-14 repeat 1-6); upstream defines no
# terminal default fg/bg.
palette  = "one"
scheme   = "One Dark (dark; light: light)"
source   = "https://github.com/navarasu/onedark.nvim"
revision = "df4792accde9db0043121f32628bcf8e645d9aea"
license  = "MIT"

[variants.dark]
file = "lua/onedark/palette.lua"

