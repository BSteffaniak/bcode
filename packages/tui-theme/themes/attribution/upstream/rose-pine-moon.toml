# Upstream reference for the `rose-pine-moon` palette. Values are copied exactly from
# `file` at `revision` (palette plus default_highlights with the default
# config groups; no transparency); see attribution/UPSTREAM.md.
#
# Highlights with `blend = N` (Visual, DiffAdd, DiffDelete) are computed
# upstream as utilities.blend(bg, palette.base, N / 100) (per channel
# floor(clamp(a*fg + (1-a)*bg) + 0.5)); the values here reproduce that
# algorithm exactly. diffAdded/diffRemoved only link to the background-only
# DiffAdd/DiffDelete, so diff text uses the git_add/git_delete groups.
# Hues follow the named colors' hues: pine is blue, foam cyan, leaf green,
# rose orange, iris magenta (no separate violet). The accent is iris, the
# scheme's link/hint group color (Function is rose).
# @markup.raw is undefined upstream (commented out), so markup_raw and
# Markdown inline code keep Bcode's derivation.
palette  = "rose-pine-moon"
scheme   = "Rosé Pine (moon)"
source   = "https://github.com/rose-pine/neovim"
revision = "ff483051a47e27d84bdef47703538df1ed9f4a47"
license  = "MIT"

[variants.dark]
file = "lua/rose-pine/palette.lua, lua/rose-pine/config.lua, lua/rose-pine.lua"

[variants.dark.colors]
"@function.fg"              = "#ea9a97"
"@keyword.fg"               = "#3e8fb0"
