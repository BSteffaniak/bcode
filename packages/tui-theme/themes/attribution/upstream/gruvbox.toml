# Upstream reference for the `gruvbox` palette. Values were extracted by script from
# `file` at `revision` (`Gruvbox.palette`, `get_colors()`, and the `get_groups()`
# highlight table) with the default configuration: contrast "" (medium),
# transparent_mode = false, background dark / light. Highlight links are resolved
# to their final color; see attribution/UPSTREAM.md.
#
# Notes on groups gruvbox.nvim leaves undefined or colorless:
# * `FloatBorder` is not defined, so Neovim's default link FloatBorder -> NormalFloat
#   applies (fg = fg1; src/nvim/highlight_group.c, neovim/neovim@779c3696, v0.12.6).
# * `@markup.raw.markdown_inline` is not defined, so the capture falls back to
#   `@markup.raw` (String); it sets no background, so `markup_code_bg` is omitted.
# * `diffAdded`/`diffRemoved` link to DiffAdd/DiffDelete, which set only a
#   background; the git text colors are taken from GitSignsAdd/GitSignsDelete.
# * `accent` is yellow, Gruvbox's signature accent (the Function color, green,
#   stays in syntax); gruvbox has one purple, so `violet` is omitted.
# * `muted` is fg4, the StatusLineNC foreground.
palette  = "gruvbox"
scheme   = "Gruvbox (dark; light: light), contrast medium"
source   = "https://github.com/ellisonleao/gruvbox.nvim"
revision = "48262cda6a8a921b159c8ec3e21b48ccd870b7b2"
license  = "MIT"

[variants.dark]
file = "lua/gruvbox.lua"

