# Upstream reference for the `nightfox` palette. Values were extracted by script
# from `file` at `revision`, evaluating the palette and `generate_spec`; highlight
# groups come from lua/nightfox/group/editor.lua, group/syntax.lua and
# group/modules/ (treesitter.lua, diagnostic.lua) with the default config.
# Nightfox computes its bright/dim shades (Shade.new with numbers) and the diff
# backgrounds at runtime; the script reproduces lib/color.lua exactly:
# `shade(f)` mixes each RGB channel toward white (f > 0) or black (f < 0) by |f|,
# `blend` mixes linearly, and `to_css` rounds with floor(x * 255 + 0.5). The
# computed nightfox shades were cross-checked against upstream's generated
# extra/nightfox/kitty.conf (color8-color15). Dawnfox declares its shades
# literally. Dotted names are palette shades (blue.base) or spec fields
# (syntax.*, diag.*, git.*, diff.*). Captures resolve through upstream's links:
# @keyword -> Keyword, @function -> Function, @markup.heading -> Title (all
# syntax.func or syntax.keyword). @markup.raw.markdown_inline is undefined and
# falls back to @markup.raw, which sets no background, so markup_code_bg is
# omitted. accent is the primary blue (blue.base, also DiagnosticInfo); Function
# uses the blue's bright (nightfox) or dim (dawnfox) shade. DiagnosticOk is the
# success color. The scheme has no purple distinct from magenta, so violet is
# omitted. The light variant is dawnfox, as Bcode's palette pairs it.
# Refined captures: @constant -> Constant (syntax.const), @variable.parameter
# (syntax.builtin1), @property (syntax.field), @function.builtin
# (syntax.builtin0), @tag (syntax.keyword), @tag.attribute (syntax.func).
# Terminal colors: vim.g.terminal_color_0..15 set in lua/nightfox/group/
# terminal.lua (terminal_colors = true by default) from the palette's
# black..white base (0-7) and bright (8-15), cross-checked against upstream's
# generated extra/<style>/kitty.conf (color0-color15); terminal_fg/terminal_bg
# are that kitty.conf's foreground/background (kitty.foreground,
# kitty.background).
palette  = "nightfox"
scheme   = "Nightfox (nightfox; light: dawnfox)"
source   = "https://github.com/EdenEast/nightfox.nvim"
revision = "4dacd3f0185a2227bdf3b6c0975a8f0bf87cac9a"
license  = "MIT"

