# Upstream reference for the `zenburn` palette: the canonical Zenburn Vim scheme.
# Values were extracted by script from `file` at `revision`, evaluated with every
# g:zenburn_* option at its default (0: original lighter background, no high
# contrast, default Visual and LineNr), reading the GUI colors. The file states
# "License: GNU GPL" without a version (hence GPL-1.0-or-later). The Neovim port
# phha/zenburn.nvim (MIT) was not used: it changes several of these values
# (Visual, LineNr, VertSplit) and defines no tree-sitter captures either.
#
# Zenburn defines only legacy Vim groups. Tree-sitter captures resolve through
# Neovim's built-in default links (src/nvim/highlight_group.c,
# neovim/neovim@779c3696, v0.12.6) and capture fallback: `@keyword` -> Keyword,
# `@punctuation.delimiter` -> `@punctuation` -> Delimiter, `@markup.heading` ->
# Title, `@markup.link` -> Underlined, `@markup.raw`, `@markup.list` -> `@markup`
# -> Special. `@variable` is undefined and would show only Neovim's own default
# color, so `syntax_variable` is omitted. NormalFloat is likewise undefined, so
# `surface` is the scheme's Pmenu background.
#
# * Hues are Zenburn's terminal palette (`g:terminal_ansi_colors` entries 1-6;
#   magenta is the gray #8f8f8f upstream uses). There is no orange or violet.
# * No Diagnostic* groups, FloatBorder, or secondary-text color exist, so
#   `info`, `warning`, `error`, `success`, `border_focused`, and `muted` are
#   omitted.
# * `border` is the VertSplit foreground (Vim draws the split as `|` in
#   VertSplit; its background is #688060).
# * `diff_add` is the DiffAdd foreground. `diffAdded`/`diffRemoved` link to
#   Neovim's default Added/Removed colors, and DiffDelete's foreground (#333333)
#   colors filler lines, not removed text, so `diff_remove` is omitted.
palette  = "zenburn"
scheme   = "Zenburn (default options)"
source   = "https://github.com/jnurmine/Zenburn"
revision = "9d7988abf0d2654f837fcd288145afd5f316b70c"
license  = "GPL-1.0-or-later"

[variants.dark]
file = "colors/zenburn.vim"

[variants.dark.colors]
"@function.fg"                   = "#efef8f"
"@keyword.fg"                    = "#f0dfaf"
"@markup.heading.fg"             = "#efefef"
"@markup.link.fg"                = "#dcdccc"
"@markup.list.fg"                = "#cfbfaf"
"@markup.raw.fg"                 = "#cfbfaf"
"@markup.raw.markdown_inline.fg" = "#cfbfaf"
"@number.fg"                     = "#8cd0d3"
"@operator.fg"                   = "#f0efd0"
"@punctuation.delimiter.fg"      = "#8f8f8f"
"@string.fg"                     = "#cc9393"
"@type.fg"                       = "#dfdfbf"
"Comment.fg"                     = "#7f9f7f"
"CursorLine.bg"                  = "#434443"
"DiffAdd.bg"                     = "#313c36"
"DiffAdd.fg"                     = "#709080"
"DiffDelete.bg"                  = "#464646"
"Function.fg"                    = "#efef8f"
"LineNr.fg"                      = "#9fafaf"
"Normal.bg"                      = "#3f3f3f"
"Normal.fg"                      = "#dcdccc"
"Pmenu.bg"                       = "#2c2e2e"
"VertSplit.fg"                   = "#2e3330"
"Visual.bg"                      = "#2f2f2f"
"terminal_ansi_colors[1]"        = "#cc9393"
"terminal_ansi_colors[2]"        = "#5f7f5f"
"terminal_ansi_colors[3]"        = "#ffd7a7"
"terminal_ansi_colors[4]"        = "#8cb0d3"
"terminal_ansi_colors[5]"        = "#8f8f8f"
"terminal_ansi_colors[6]"        = "#71d3b4"

[variants.dark.slots]
background         = "Normal.bg"
text               = "Normal.fg"
accent             = "Function.fg"
blue               = "terminal_ansi_colors[4]"
cyan               = "terminal_ansi_colors[6]"
green              = "terminal_ansi_colors[2]"
magenta            = "terminal_ansi_colors[5]"
red                = "terminal_ansi_colors[1]"
yellow             = "terminal_ansi_colors[3]"
comment            = "Comment.fg"
border             = "VertSplit.fg"
surface            = "Pmenu.bg"
selection          = "Visual.bg"
line_highlight     = "CursorLine.bg"
gutter             = "LineNr.fg"
diff_add           = "DiffAdd.fg"
diff_add_bg        = "DiffAdd.bg"
diff_remove_bg     = "DiffDelete.bg"
syntax_keyword     = "@keyword.fg"
syntax_function    = "@function.fg"
syntax_string      = "@string.fg"
syntax_number      = "@number.fg"
syntax_type        = "@type.fg"
syntax_operator    = "@operator.fg"
syntax_punctuation = "@punctuation.delimiter.fg"
markup_heading     = "@markup.heading.fg"
markup_link        = "@markup.link.fg"
markup_raw         = "@markup.raw.fg"
markup_code        = "@markup.raw.markdown_inline.fg"
markup_list        = "@markup.list.fg"

[variants.dark.roles]
"canvas.bg"               = "Normal.bg"
"canvas.fg"               = "Normal.fg"
"text.primary.fg"         = "Normal.fg"
"border.default.fg"       = "VertSplit.fg"
"surface.raised.bg"       = "Pmenu.bg"
"surface.overlay.bg"      = "Pmenu.bg"
"selection.active.bg"     = "Visual.bg"
"selection.inactive.bg"   = "CursorLine.bg"
"source.gutter.fg"        = "LineNr.fg"
"diff.added.fg"           = "DiffAdd.fg"
"diff.added_row.bg"       = "DiffAdd.bg"
"diff.removed_row.bg"     = "DiffDelete.bg"
"title.fg"                = "Function.fg"
"markdown.text.fg"        = "Normal.fg"
"markdown.heading.fg"     = "@markup.heading.fg"
"markdown.link.fg"        = "@markup.link.fg"
"link.fg"                 = "@markup.link.fg"
"markdown.inline_code.fg" = "@markup.raw.markdown_inline.fg"
"markdown.list_marker.fg" = "@markup.list.fg"
"syntax.text.fg"          = "Normal.fg"
"syntax.comment.fg"       = "Comment.fg"
"syntax.keyword.fg"       = "@keyword.fg"
"syntax.function.fg"      = "@function.fg"
"syntax.string.fg"        = "@string.fg"
"syntax.number.fg"        = "@number.fg"
"syntax.type.fg"          = "@type.fg"
"syntax.operator.fg"      = "@operator.fg"
"syntax.punctuation.fg"   = "@punctuation.delimiter.fg"
"syntax.heading.fg"       = "@markup.heading.fg"
"syntax.link.fg"          = "@markup.link.fg"
"syntax.raw.fg"           = "@markup.raw.fg"
