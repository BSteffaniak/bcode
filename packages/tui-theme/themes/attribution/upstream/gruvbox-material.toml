# Upstream reference for the `gruvbox-material` palette. Values were extracted by
# script from `gruvbox_material#get_palette()` in autoload/gruvbox_material.vim and
# the highlight definitions in colors/gruvbox-material.vim at `revision`, evaluated
# with upstream's default configuration from `gruvbox_material#get_configuration()`:
# background = "medium", foreground = "material", float_style = "bright",
# visual = "grey background", ui_contrast = "low", transparent_background = 0,
# running under Neovim. Highlight links are resolved to their final color; see
# attribution/UPSTREAM.md. Other background (hard, soft) and foreground (mix,
# original) options are not bundled.
#
# * `@markup.raw.markdown_inline` is not defined, so the capture falls back to
#   `@markup.raw`; it sets no background, so `markup_code_bg` is omitted.
# * `accent` is yellow, the scheme's signature accent (the Function color,
#   green, stays in syntax); the scheme has one purple, so `violet` is omitted.
# * `muted` is grey2, the PmenuExtra foreground (secondary menu text);
#   `comment` and `border_focused` are grey1.
palette  = "gruvbox-material"
scheme   = "Gruvbox Material (dark; light: light), background medium, foreground material"
source   = "https://github.com/sainnhe/gruvbox-material"
revision = "11d779b26a9ab2b3db8c22c6ac9fb6e8ed4fea79"
license  = "MIT"

[variants.dark]
file = "autoload/gruvbox_material.vim, colors/gruvbox-material.vim"

