# Upstream reference for the `github` palette. Values were extracted by script from
# `file` at `revision` (with lua/github-theme/palette/primitives/dark.lua / light.lua, the
# generated Primer primitives it reads), evaluating the palette and
# `generate_spec` exactly as lib/color.lua does: `blend` is a linear mix of RGB
# channels in [0,1] and `to_css` rounds with floor(x * 255 + 0.5). Highlight
# groups come from group/editor.lua, group/syntax.lua and group/modules/
# (treesitter.lua, diagnostic.lua) with the default config (darken.floats =
# true). Captures upstream leaves to Neovim's default links resolve through them:
# @keyword -> Keyword, @function -> Function, @string -> String, @number -> Number,
# @operator -> Operator, @punctuation.delimiter -> Delimiter -> Special (fg1),
# @markup.heading -> Title. @markup.raw.markdown_inline is undefined and falls
# back to @markup.raw, which sets no background, so markup_code_bg is omitted.
# Dotted names are `palette` fields (blue.base, accent.fg, fg.muted,
# border.default, success.fg) or `generate_spec` fields (bg0, sel0, syntax.*,
# diag.*, git.*, diff.*). GitHub's palette names a semantic `success` color
# (success.fg), used for success. The scheme has no purple distinct from its
# magenta (palette.magenta is Primer purple), so violet is omitted.
# Refined captures: @constant is commented out upstream and resolves through
# Neovim's default link to Constant (syntax.const); @property and @tag.attribute
# link to @variable.member (syntax.field). @function.builtin is set to an empty
# group (FALLBACK_OR_NONE), which has no color, so syntax_builtin is omitted.
# Terminal colors: vim.g.terminal_color_0..15 set in group/terminal.lua
# (terminal_colors = true by default) from the palette's black..white base (0-7)
# and bright (8-15); upstream defines no terminal default fg/bg.
# Dark is github_dark_default; light is github_light_default.
palette  = "github"
scheme   = "GitHub (dark default; light: light default)"
source   = "https://github.com/projekt0n/github-nvim-theme"
revision = "c106c9472154d6b2c74b74565616b877ae8ed31d"
license  = "MIT"

[variants.dark]
file = "lua/github-theme/palette/github_dark_default.lua"

