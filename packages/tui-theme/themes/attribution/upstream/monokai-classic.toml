# Upstream reference for the `monokai-classic` palette. Values are copied exactly
# from `file` at `revision`; see attribution/UPSTREAM.md.
#
# Monokai has no official Neovim port. The source is loctvl842/monokai-pro.nvim
# with filter "classic", the Monokai Classic filter of Monokai Pro (by Monokai's
# author): palette/classic.lua keeps Monokai's background #272822 and accents,
# with Monokai Pro Classic's text #fdfff1. The port derives editor colors in
# theme/scheme.lua with colors.blend(fg, alpha, bg) (per channel
# (1-alpha)*bg + alpha*fg, rounded half up and clamped, colors/convert.lua);
# the values here reproduce that exactly: CursorLine.bg =
# blend(text, 0.05, background), Visual.bg = blend(dimmed1, 0.15, background),
# DiffAdd.bg = blend(accent4, 0.1, dark1), DiffDelete.bg = blend(accent1, 0.1,
# dark1). Highlight specs are merged in the port's load order (groups editor,
# extra, semantic, syntax; eager plugins blink, lsp, treesitter) with default
# options.
#
# Hue names follow palette/init.lua's field docs: accent1 red/pink, accent2
# orange, accent3 yellow, accent4 green, accent5 cyan/blue (used for both blue
# and cyan), accent6 purple (magenta). Monokai has no separate violet. accent is
# accent4, the green Monokai uses for functions and titles. muted is StatusLine's foreground (dimmed1).
# markup_heading follows @markup.heading (green); the port colors Markdown's
# per-level captures (@markup.heading.N.markdown) yellow. markup_link is the
# port's base.blue, which Monokai Pro assigns to accent2 (orange).
# Omitted: markup_code_bg (no background), success (no DiagnosticOk).
palette  = "monokai-classic"
scheme   = "Monokai Pro (classic filter)"
source   = "https://github.com/loctvl842/monokai-pro.nvim"
revision = "a68e38b8e55d69a215d0f02598900a79c356da9d"
license  = "MIT"

[variants.dark]
file = "lua/monokai-pro/palette/classic.lua + theme/scheme.lua + theme/groups/*.lua + theme/plugins/{lsp,treesitter}.lua"

[variants.dark.colors]
"@function.fg"                   = "#a6e22e"
