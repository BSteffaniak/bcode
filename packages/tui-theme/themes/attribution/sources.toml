# Where every bundled palette's colors come from. `themes/palettes/<id>.toml`
# and this table must list the same ids; the upstream fidelity tests enforce it.
#
# status = "upstream"  colors are copied exactly from the source scheme;
#                      `upstream/<id>.toml` records the source and its values.
# status = "pending"   seeds were adapted from `family` and still await
#                      conversion; `candidates` lists canonical sources to read,
#                      preferred first. Converting a palette replaces the entry
#                      with status = "upstream".
# status = "original"  authored for Bcode; there is no upstream.
# status = "measured"  measured from another application's rendering; `note`
#                      names the procedure that maintains it.
#
# See UPSTREAM.md for the conversion procedure.

[palettes.amber]
status = "original"

[palettes.aurora]
status = "original"

[palettes.ayu]
status = "upstream"

[palettes.ayu-mirage]
