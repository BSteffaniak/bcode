# Colors of the ayu scheme (mirage), taken exactly from its upstream source;
# see attribution/upstream/ayu-mirage.toml and attribution/UPSTREAM.md.
display_name   = "Ayu Mirage"
extends        = ["seeded-base"]
id             = "ayu-mirage"
schema_version = 2

[palette]
background         = "#1f2430"
text               = "#cccac2"
accent             = "#ffcc66"
blue               = "#73d0ff"
cyan               = "#95e6cb"
green              = "#d5ff80"
magenta            = "#dfbfff"
orange             = "#ffad66"
red                = "#f28779"
yellow             = "#ffd173"
info               = "#5ccfe6"
warning            = "#ffad66"
error              = "#ff6666"
muted              = "#707a8c"
comment            = "#6c7a8b"
border             = "#101521"
border_focused     = "#6c7a8b"
surface            = "#1f2430"
selection          = "#23344b"
line_highlight     = "#171b24"
gutter             = "#323843"
diff_add           = "#87d96c"
diff_remove        = "#f27983"
diff_add_bg        = "#313d37"
diff_remove_bg     = "#3e373a"
syntax_keyword     = "#ffad66"
syntax_function    = "#ffd173"
syntax_variable    = "#cccac2"
syntax_string      = "#d5ff80"
syntax_number      = "#dfbfff"
syntax_type        = "#73d0ff"
syntax_operator    = "#f29e74"
syntax_punctuation = "#ffdfb3"
markup_heading     = "#ffad66"
markup_raw         = "#ffcc66"
markup_code        = "#ffcc66"
markup_list        = "#ffcc66"
