# Colors of the GitHub Dimmed scheme, taken exactly from its upstream source;
# see attribution/upstream/github-dimmed.toml and attribution/UPSTREAM.md.
display_name   = "GitHub Dimmed"
extends        = ["seeded-base"]
id             = "github-dimmed"
schema_version = 2

[palette]
background         = "#22272e"
text               = "#adbac7"
accent             = "#539bf5"
blue               = "#539bf5"
cyan               = "#76e3ea"
green              = "#57ab5a"
magenta            = "#b083f0"
orange             = "#e0823d"
red                = "#f47067"
yellow             = "#c69026"
info               = "#539bf5"
success            = "#57ab5a"
warning            = "#c69026"
error              = "#e5534b"
muted              = "#768390"
comment            = "#768390"
border             = "#444c56"
border_focused     = "#444c56"
surface            = "#1e232a"
selection          = "#36557e"
line_highlight     = "#30363d"
gutter             = "#636e7b"
diff_add           = "#57ab5a"
diff_remove        = "#e5534b"
diff_add_bg        = "#253430"
diff_remove_bg     = "#3b2a2f"
syntax_keyword     = "#f47067"
syntax_function    = "#dcbdfb"
syntax_variable    = "#adbac7"
syntax_string      = "#96d0ff"
syntax_number      = "#6cb6ff"
syntax_type        = "#f69d50"
syntax_operator    = "#6cb6ff"
syntax_punctuation = "#adbac7"
markup_heading     = "#6cb6ff"
markup_link        = "#adbac7"
markup_raw         = "#adbac7"
markup_code        = "#adbac7"
markup_list        = "#6cb6ff"

[variants.dark]
