# Colors of the Monokai Classic scheme, taken exactly from its upstream source;
# see attribution/upstream/monokai-classic.toml and attribution/UPSTREAM.md.
display_name   = "Monokai Classic"
extends        = ["seeded-base"]
id             = "monokai-classic"
schema_version = 2

[palette]
background         = "#272822"
text               = "#fdfff1"
accent             = "#a6e22e"
blue               = "#66d9ef"
cyan               = "#66d9ef"
green              = "#a6e22e"
magenta            = "#ae81ff"
orange             = "#fd971f"
red                = "#f92672"
yellow             = "#e6db74"
info               = "#66d9ef"
warning            = "#fd971f"
error              = "#f92672"
muted              = "#c0c1b5"
comment            = "#6e7066"
border             = "#1d1e19"
border_focused     = "#919288"
surface            = "#3b3c35"
selection          = "#3e3f38"
line_highlight     = "#32332c"
gutter             = "#57584f"
diff_add           = "#a6e22e"
diff_remove        = "#f92672"
diff_add_bg        = "#2b321b"
diff_remove_bg     = "#331f22"
syntax_keyword     = "#f92672"
syntax_function    = "#a6e22e"
syntax_variable    = "#fdfff1"
syntax_string      = "#e6db74"
syntax_number      = "#ae81ff"
syntax_type        = "#66d9ef"
syntax_operator    = "#f92672"
syntax_punctuation = "#919288"
markup_heading     = "#a6e22e"
markup_link        = "#fd971f"
markup_raw         = "#e6db74"
markup_code        = "#e6db74"
markup_list        = "#fdfff1"
