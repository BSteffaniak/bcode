# Colors of the Poimandres scheme, taken exactly from its upstream source;
# see attribution/upstream/poimandres.toml and attribution/UPSTREAM.md.
display_name   = "Poimandres"
extends        = ["seeded-base"]
id             = "poimandres"
schema_version = 2

[palette]
background         = "#1b1e28"
text               = "#e4f0fb"
accent             = "#add7ff"
blue               = "#add7ff"
cyan               = "#89ddff"
green              = "#5de4c7"
magenta            = "#fcc5e9"
red                = "#d0679d"
yellow             = "#fffac2"
info               = "#91b4d5"
warning            = "#fffac2"
error              = "#d0679d"
muted              = "#a6accd"
comment            = "#a6accd"
border             = "#171922"
border_focused     = "#171922"
surface            = "#171922"
selection          = "#506477"
line_highlight     = "#303340"
gutter             = "#506477"
diff_add           = "#5de4c7"
diff_remove        = "#d0679d"
diff_add_bg        = "#3c8178"
diff_remove_bg     = "#764363"
syntax_keyword     = "#91b4d5"
syntax_function    = "#add7ff"
syntax_variable    = "#e4f0fb"
syntax_string      = "#5de4c7"
syntax_number      = "#5de4c7"
syntax_type        = "#a6accd"
syntax_operator    = "#add7ff"
syntax_punctuation = "#91b4d5"
markup_heading     = "#e4f0fb"
markup_raw         = "#767c9d"
markup_code        = "#767c9d"
markup_list        = "#767c9d"

[variants.dark]
