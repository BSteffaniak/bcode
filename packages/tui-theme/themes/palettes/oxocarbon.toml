red                = "#ee5396"
violet             = "#be95ff"
info               = "#78a9ff"
warning            = "#be95ff"
error              = "#ee5396"
comment            = "#525252"
border             = "#262626"
border_focused     = "#131313"
surface            = "#131313"
selection          = "#393939"
line_highlight     = "#262626"
gutter             = "#525252"
diff_add           = "#08bdba"
diff_remove        = "#ee5396"
diff_add_bg        = "#122f2f"
diff_remove_bg     = "#361c28"
syntax_keyword     = "#78a9ff"
syntax_function    = "#ff7eb6"
syntax_variable    = "#d0d0d0"
syntax_string      = "#be95ff"
syntax_number      = "#82cfff"
