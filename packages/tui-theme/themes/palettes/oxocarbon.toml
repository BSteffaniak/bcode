# Colors of the Oxocarbon scheme, taken exactly from its upstream source;
# see attribution/upstream/oxocarbon.toml and attribution/UPSTREAM.md.
display_name   = "Oxocarbon"
extends        = ["seeded-base"]
id             = "oxocarbon"
schema_version = 2

