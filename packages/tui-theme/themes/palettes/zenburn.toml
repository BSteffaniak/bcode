# Colors of the Zenburn scheme, taken exactly from its upstream source;
# see attribution/upstream/zenburn.toml and attribution/UPSTREAM.md.
display_name   = "Zenburn"
extends        = ["seeded-base"]
id             = "zenburn"
schema_version = 2

[palette]
background         = "#3f3f3f"
text               = "#dcdccc"
accent             = "#efef8f"
blue               = "#8cb0d3"
cyan               = "#71d3b4"
green              = "#5f7f5f"
magenta            = "#8f8f8f"
red                = "#cc9393"
yellow             = "#ffd7a7"
comment            = "#7f9f7f"
border             = "#2e3330"
surface            = "#2c2e2e"
selection          = "#2f2f2f"
line_highlight     = "#434443"
gutter             = "#9fafaf"
diff_add           = "#709080"
diff_add_bg        = "#313c36"
diff_remove_bg     = "#464646"
syntax_keyword     = "#f0dfaf"
syntax_function    = "#efef8f"
syntax_string      = "#cc9393"
syntax_number      = "#8cd0d3"
syntax_type        = "#dfdfbf"
syntax_operator    = "#f0efd0"
syntax_punctuation = "#8f8f8f"
markup_heading     = "#efefef"
markup_link        = "#dcdccc"
markup_raw         = "#cfbfaf"
markup_code        = "#cfbfaf"
markup_list        = "#cfbfaf"
