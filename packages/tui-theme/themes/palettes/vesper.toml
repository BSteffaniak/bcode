# Colors of the Vesper scheme, taken exactly from its upstream source;
# see attribution/upstream/vesper.toml and attribution/UPSTREAM.md.
display_name   = "Vesper"
extends        = ["seeded-base"]
id             = "vesper"
schema_version = 2

[palette]
background         = "#101010"
text               = "#cccccc"
accent             = "#ffc799"
blue               = "#82d9c2"
cyan               = "#a0a0a0"
green              = "#82d9c2"
magenta            = "#ffcfa8"
orange             = "#ffcfa8"
red                = "#ff8080"
yellow             = "#ffc799"
info               = "#99ffe4"
warning            = "#ffc799"
error              = "#ff8080"
muted              = "#65737e"
comment            = "#7d7d7d"
border             = "#505050"
border_focused     = "#65737e"
surface            = "#282828"
selection          = "#656565"
line_highlight     = "#343434"
gutter             = "#505050"
diff_add           = "#497569"
diff_remove        = "#884848"
diff_add_bg        = "#101010"
diff_remove_bg     = "#101010"
syntax_keyword     = "#a0a0a0"
syntax_function    = "#ffcfa8"
syntax_variable    = "#ffffff"
syntax_string      = "#82d9c2"
syntax_number      = "#ffffff"
syntax_type        = "#ffcfa8"
syntax_operator    = "#a0a0a0"
syntax_punctuation = "#65737e"
markup_heading     = "#82d9c2"
markup_raw         = "#65737e"
markup_code        = "#65737e"
markup_list        = "#65737e"
