# Colors of the Night Owl scheme, taken exactly from its upstream source;
# see attribution/upstream/night-owl.toml and attribution/UPSTREAM.md.
display_name   = "Night Owl"
extends        = ["seeded-base"]
id             = "night-owl"
schema_version = 2

[palette]
background         = "#021727"
text               = "#d6deeb"
accent             = "#82aaff"
blue               = "#82aaff"
cyan               = "#6ae9f0"
green              = "#c5e478"
magenta            = "#c792ea"
orange             = "#f78c6c"
red                = "#ff5874"
violet             = "#7e57c2"
yellow             = "#ffd602"
error              = "#ef5350"
comment            = "#637777"
border             = "#262a39"
border_focused     = "#5f7e97"
surface            = "#021727"
selection          = "#1d3b53"
line_highlight     = "#021320"
gutter             = "#4b6479"
diff_add           = "#9ccc65"
diff_remove        = "#ef5350"
syntax_keyword     = "#c792ea"
syntax_function    = "#82aaff"
syntax_variable    = "#d7dbe0"
syntax_string      = "#ecc48d"
syntax_number      = "#f78c6c"
syntax_type        = "#ffcb8b"
syntax_operator    = "#c792ea"
syntax_punctuation = "#d6deeb"
markup_heading     = "#82b1ff"
markup_raw         = "#ffcb8b"
markup_code        = "#ffcb8b"
markup_list        = "#ffcb8b"

[variants.dark]
