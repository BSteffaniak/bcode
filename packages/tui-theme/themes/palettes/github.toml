info               = "#2f81f7"
success            = "#3fb950"
warning            = "#d29922"
error              = "#f85149"
muted              = "#7d8590"
comment            = "#8b949e"
border             = "#161b22"
border_focused     = "#161b22"
surface            = "#04070d"
selection          = "#17335a"
line_highlight     = "#484f58"
gutter             = "#6e7681"
diff_add           = "#3fb950"
diff_remove        = "#f85149"
diff_add_bg        = "#10231c"
diff_remove_bg     = "#2c171b"
syntax_keyword     = "#ff7b72"
syntax_function    = "#d2a8ff"
syntax_variable    = "#e6edf3"
syntax_string      = "#a5d6ff"
syntax_number      = "#79c0ff"
