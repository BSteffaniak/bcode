# Profiles set chrome, structure, and containers only, so they combine with any palette.
description    = "Typographic and Markdown-forward: prose first, tools tucked away."
display_name   = "Editorial (profile)"
id             = "editorial"
kind           = "profile"
schema_version = 2

[chrome.tui]
borders    = { panel = "none", dialog = "single", tool = "none", composer = "single" }
density    = "comfortable"
icons      = "unicode"
motion     = "subtle"
separators = { status = "plain" }
speaker    = "gutter"
surfaces   = "flat"

# Prose first: tools fold into collapsed groups that reasoning does not interrupt.
[[presentation.rules]]
match = { kind = "tool" }
set = { disclosure = "collapsed", group = { by = "consecutive", bridge = [
    "reasoning",
] } }

[[presentation.rules]]
match = { kind = "tool" }
set   = { header = { fields = ["marker", "tool", "target", "status"] } }

[[presentation.rules]]
match = { kind = "tool", status = ["running", "waiting"] }
set   = { disclosure = "summary" }

[[presentation.rules]]
match = { kind = "group" }
set = { disclosure = "collapsed", header = { fields = [
    "marker",
    "count",
    "tools",
    "status",
] } }

[containers."transcript.user"]
layout    = "plain"
padding_x = 2

[containers."transcript.assistant"]
layout    = "plain"
padding_x = 2

[containers."tool.requested"]
layout    = "plain"
padding_x = 2

[containers."tool.running"]
layout    = "plain"
padding_x = 2

[containers."tool.waiting"]
layout    = "plain"
padding_x = 2

[containers."tool.succeeded"]
layout    = "plain"
padding_x = 2

[containers."tool.failed"]
layout    = "plain"
padding_x = 2

[containers."tool.cancelled"]
layout    = "plain"
padding_x = 2

[containers."tool.timed_out"]
layout    = "plain"
padding_x = 2
