# Profiles set chrome, structure, and containers only, so they combine with any palette.
description    = "Never color alone: explicit frames, verbose labels, no motion."
display_name   = "Accessible (profile)"
id             = "accessible"
kind           = "profile"
schema_version = 2

[chrome.tui]
borders    = { panel = "single", dialog = "double", tool = "left", composer = "single" }
density    = "comfortable"
icons      = "unicode"
motion     = "none"
separators = { status = "bar" }
speaker    = "badge"
surfaces   = "layered"

# Nothing is folded or grouped; headers spell out every field.
[[presentation.rules]]
match = { kind = "tool" }
set   = { disclosure = "expanded", detail = "verbose", group = "none" }

[[presentation.rules]]
match = { kind = "tool" }
set = { header = { fields = [
    "marker",
    "label",
    "tool",
    "target",
    "status",
    "timing",
] } }

[[presentation.rules]]
match = { kind = "tool" }

[presentation.rules.set.sections]
arguments    = { visible = true, disclosure = "expanded" }
artifact     = { visible = true, disclosure = "expanded" }
confirmation = { visible = true, disclosure = "expanded" }
diff         = { visible = true, disclosure = "expanded" }
error        = { visible = true, disclosure = "expanded" }
metadata     = { visible = true, disclosure = "expanded" }
output       = { visible = true, disclosure = "expanded" }
result       = { visible = true, disclosure = "expanded" }
visual       = { visible = true, disclosure = "expanded" }

# Groups formed by configuration rules still open fully.
[[presentation.rules]]
match = { kind = "group" }
set   = { disclosure = "expanded" }

[containers."transcript.user"]
layout = "plain"

[containers."transcript.assistant"]
layout = "plain"

[containers."tool.requested"]
border    = "left"
layout    = "left_bar"
padding_x = 1
width     = "full"

[containers."tool.running"]
border    = "left"
layout    = "left_bar"
padding_x = 1
width     = "full"

[containers."tool.waiting"]
border    = "left"
layout    = "left_bar"
padding_x = 1
width     = "full"

[containers."tool.succeeded"]
border    = "left"
layout    = "left_bar"
padding_x = 1
width     = "full"

[containers."tool.failed"]
border    = "all"
layout    = "panel"
padding_x = 1
width     = "full"

[containers."tool.cancelled"]
border    = "left"
layout    = "left_bar"
padding_x = 1
width     = "full"

[containers."tool.timed_out"]
border    = "left"
layout    = "left_bar"
padding_x = 1
width     = "full"
