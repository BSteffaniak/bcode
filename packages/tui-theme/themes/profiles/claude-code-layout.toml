# Profiles set chrome, structure, and containers only, so they combine with any palette.
# Claude Code's fullscreen layout, measured with scripts/appearance-reference; pair with the
# `claude-code` palette (see docs/appearance-reference.md).
description    = "Claude Code's layout: no header, rules around a prompt, a footer status line."
display_name   = "Claude Code (profile)"
id             = "claude-code-layout"
kind           = "profile"
schema_version = 2

[chrome.tui]
activity      = { placement = "line", spinner = "·✢✳✶✻✽", shimmer = true, verbs = ["Mulling", "Pondering", "Brewing", "Baking", "Cooking", "Warping", "Jitterbugging", "Shenaniganing", "Sautéing", "Crunching"] }
borders       = { panel = "single", dialog = "single", tool = "none", composer = "rules" }
composer      = { prompt = "❯ ", title = "hidden", placeholder = "", controls = "hidden" }
density       = "cozy"
follow        = "latest"
header        = "hidden"
icons         = "unicode"
motion        = "subtle"
separators    = { status = "plain" }
session_start = "hidden"
markers       = { user = "❯", assistant = "⏺", bullet = "⏺", connector = "⎿" }
speaker       = "marker"
status        = { placement = "below_composer", indent = 2, segments = ["message", "hints"] }
surfaces      = "flat"

# Tool calls: a status-colored bullet, the tool's display name, and its target in parentheses;
# bodies hang off a connector instead of labelled sections.
[[presentation.rules]]
match = { kind = "tool" }
set = { header = { template = "{bullet} {tool}({target})" }, section_labels = "connector", sections = { arguments = { visible = false } }, preview = { lines = 4, keep = "head" } }

[[presentation.rules]]
match = { kind = "tool", tool = "filesystem.read" }
set   = { display_name = "Read" }

[[presentation.rules]]
match = { kind = "tool", tool = ["filesystem.edit", "filesystem.multi_edit"] }
set   = { display_name = "Update" }

[[presentation.rules]]
match = { kind = "tool", tool = "filesystem.write" }
set   = { display_name = "Write" }

[[presentation.rules]]
match = { kind = "tool", tool = "shell.run" }
set   = { display_name = "Bash" }

[[presentation.rules]]
match = { kind = "tool", tool = ["filesystem.grep", "filesystem.find", "filesystem.list"] }
set   = { display_name = "Search" }

# Successful reads and shell commands fold into one summary row per run.
[[presentation.rules]]
match = { kind = "tool", tool = ["filesystem.read", "shell.run"], status = "succeeded" }
set   = { group = { by = "same_tool", min = 1 } }

[[presentation.rules]]
match = { kind = "group" }
set   = { disclosure = "collapsed", header = { template = "{count} {tool} call{plural}" }, indent = 2 }

[[presentation.rules]]
match = { kind = "group", tool = "filesystem.read" }
set   = { header = { template = "Read {count} file{plural}" } }

[[presentation.rules]]
match = { kind = "group", tool = "shell.run" }
set   = { header = { template = "Ran {count} shell command{plural}" } }

# A decided permission leaves no record in the transcript.
[[presentation.rules]]
match = { kind = "permission" }
set   = { disclosure = "hidden", hidden_marker = false }

[[presentation.rules]]
match = { kind = "reasoning" }
set   = { disclosure = "collapsed", header = { template = "Thought" } }

# User messages fill their rows edge to edge; no border or padding.
[containers."transcript.user"]
border = "none"
layout = "panel"
width  = "full"

[containers."transcript.assistant"]
layout = "plain"

[containers."tool.requested"]
layout = "plain"

[containers."tool.running"]
layout = "plain"

[containers."tool.waiting"]
layout = "plain"

[containers."tool.succeeded"]
layout = "plain"

[containers."tool.failed"]
layout = "plain"

[containers."tool.cancelled"]
layout = "plain"

[containers."tool.timed_out"]
layout = "plain"
