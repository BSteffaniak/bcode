[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Renderer-neutral session view projection for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "session", "view"]
license     = { workspace = true }
name        = "bcode_session_view"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bcode_client              = { workspace = true, optional = true }
bcode_harness_models      = { workspace = true }
bcode_ipc                 = { workspace = true, optional = true }
bcode_path_display        = { workspace = true }
bcode_session_models      = { workspace = true }
bcode_session_view_models = { workspace = true }
bcode_skill_models        = { workspace = true }
bcode_tool_models         = { workspace = true }
serde_json                = { workspace = true, features = ["std"] }
unicode-segmentation      = { workspace = true }
tokio                     = { workspace = true, optional = true, features = ["sync", "time"] }
web-time                  = { workspace = true }

[dev-dependencies]
bcode_daemon_lifecycle = { workspace = true }
bcode_ipc              = { workspace = true }
bcode_session          = { workspace = true }
tempfile               = { workspace = true }
tokio                  = { workspace = true, features = ["macros", "rt", "time"] }

[features]
# Daemon-backed action and queue helpers. Hosts without a daemon client, such as the
# browser WASM surface, leave it off.
client           = ["dep:bcode_client", "dep:bcode_ipc", "dep:tokio"]
default          = []
fail-on-warnings = []
