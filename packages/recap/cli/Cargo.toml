[package]
authors.workspace    = true
categories           = ["multimedia::video", "command-line-utilities"]
description          = "Standalone visual video recap executable"
edition.workspace    = true
keywords             = ["video", "recap", "summary"]
license.workspace    = true
name                 = "bcode_recap_cli"
readme.workspace     = true
repository.workspace = true
version.workspace    = true

[[bin]]
name = "recap"
path = "../src/main.rs"

[dependencies]
base64.workspace = true
bcode = { workspace = true, features = [
    "config",
    "embedded-plugins",
    "openai-compatible-provider",
] }
bcode_model.workspace = true
bcode_openai_compatible_provider_plugin = { workspace = true, features = [
    "static-bundled",
] }
bcode_plugin.workspace = true
bcode_recap.workspace = true
bmux_image = { workspace = true, optional = true }
bmux_keyboard = { workspace = true, optional = true, features = ["crossterm"] }
bmux_text_edit = { workspace = true, optional = true, features = [
    "keyboard",
    "serde",
] }
bmux_tui = { workspace = true, optional = true, features = ["crossterm"] }
bmux_tui_components = { workspace = true, optional = true, features = [
    "action-row",
    "badge",
    "button",
    "dialog",
    "empty-state",
    "form-field",
    "key-hint-bar",
    "labeled-details",
    "modal-frame",
    "pane",
    "panel-group",
    "progress-bar",
    "radio-group",
    "scroll-view",
    "selectable-list",
    "stepper",
    "text-input",
    "text-input-box",
    "text-view",
    "toast-stack",
    "virtual-list",
] }
bmux_tui_runtime = { workspace = true, optional = true, features = [
    "crossterm",
    "all-protocols",
] }
clap = { workspace = true, features = [
    "derive",
    "std",
    "help",
    "usage",
    "error-context",
] }
image = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
] }

[dev-dependencies]
bmux_terminal_grid.workspace = true

[[example]]
name              = "render_preview"
required-features = ["tui"]

[features]
default = []
fail-on-warnings = []
tui = [
    "dep:bmux_keyboard",
    "dep:bmux_text_edit",
    "dep:bmux_tui",
    "dep:bmux_tui_components",
    "dep:bmux_tui_runtime",
    "dep:bmux_image",
    "dep:image",
]
