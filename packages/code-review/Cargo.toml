[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Code review data layer for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "code-review", "git"]
license     = { workspace = true }
name        = "bcode_code_review"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bcode_code_review_models = { workspace = true }
bcode_code_review_provider = { workspace = true }
bcode_config = { workspace = true }
bcode_git = { workspace = true }
bcode_path_display = { workspace = true }
hex = { workspace = true }
regex = { workspace = true, features = ["std", "unicode"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
switchy = { workspace = true, features = [
    "database",
    "database-schema",
    "database-connection",
    "database-connection-turso",
    "schema",
] }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default          = []
fail-on-warnings = []
# Fixture repositories and fake provider and publisher plugins for tests of dependent crates.
testing = ["dep:tempfile"]
