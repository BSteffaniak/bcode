[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Bounded workflow source and package discovery for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "workflow", "discovery"]
license     = { workspace = true }
name        = "bcode_workflow_discovery"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bcode_config                = { workspace = true }
bcode_workflow              = { workspace = true }
futures                     = { workspace = true, features = ["executor"] }
serde                       = { workspace = true, features = ["derive", "std"] }
serde_json                  = { workspace = true, features = ["std"] }
switchy_database            = { workspace = true }
switchy_database_connection = { workspace = true }
tempfile                    = { workspace = true }
thiserror                   = { workspace = true }
toml                        = { workspace = true, features = ["parse"] }
yaml_serde                  = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default          = []
fail-on-warnings = []
