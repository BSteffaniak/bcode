[package]
authors     = { workspace = true }
categories  = ["command-line-interface", "development-tools"]
description = "Reusable terminal UI components for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "terminal", "tui", "components"]
license     = { workspace = true }
name        = "bcode_tui_components"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[[bin]]
name              = "bcode_terminal_grid_probe"
path              = "src/bin/bcode_terminal_grid_probe.rs"
required-features = ["terminal-viewer"]

[dependencies]
bcode_markdown_render = { workspace = true, optional = true }
bcode_syntax_render   = { workspace = true, optional = true }
bmux_keyboard         = { workspace = true, optional = true }
bmux_terminal_grid    = { workspace = true, optional = true }
bmux_text_edit        = { workspace = true, optional = true }
bmux_tui              = { workspace = true }
bmux_tui_components   = { workspace = true }
unicode-width         = { workspace = true, optional = true }

[features]
activity = []
all = [
    "activity",
    "chrome",
    "composer",
    "compact",
    "diff-viewer",
    "permission",
    "session-ui",
    "setup",
    "source-preview",
    "source-viewer",
    "terminal-viewer",
    "tool-card",
    "transcript",
    "transcript-markdown",
]
chrome = []
compact = ["bmux_tui_components/compact"]
composer = []
default = []
diff-viewer = ["bmux_tui_components/diff-viewer"]
fail-on-warnings = []
permission = ["bmux_tui_components/modal-frame"]
session-ui = [
    "composer",
    "transcript",
    "bmux_tui_components/text-input",
    "dep:bmux_keyboard",
    "dep:bmux_text_edit",
]
setup = []
source-preview = ["source-viewer", "dep:unicode-width"]
source-viewer = ["bmux_tui_components/source-viewer"]
syntax = [
    "dep:bcode_syntax_render",
    "diff-viewer",
    "source-preview",
    "source-viewer",
]
terminal-viewer = [
    "dep:bmux_terminal_grid",
    "bmux_tui_components/terminal-viewer",
]
tool-card = ["compact"]
transcript = []
transcript-markdown = ["transcript", "dep:bcode_markdown_render"]
