[package]
authors     = { workspace = true }
categories  = ["command-line-interface", "development-tools"]
description = "Reusable terminal UI components for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "terminal", "tui", "components"]
license     = { workspace = true }
name        = "bcode_tui_components"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[[bin]]
name              = "bcode_terminal_grid_probe"
path              = "src/bin/bcode_terminal_grid_probe.rs"
required-features = ["terminal-viewer"]

[dependencies]
bcode_syntax_render  = { workspace = true, optional = true }
bmux_terminal_grid   = { workspace = true, optional = true }
bmux_tui             = { workspace = true }
bmux_tui_components  = { workspace = true }
unicode-segmentation = { workspace = true, optional = true }
unicode-width        = { workspace = true, optional = true }

[features]
activity = []
all = [
    "activity",
    "chrome",
    "composer",
    "compact",
    "diff-viewer",
    "permission",
    "setup",
    "source-preview",
    "source-viewer",
    "terminal-viewer",
    "tool-card",
]
chrome = ["dep:unicode-segmentation"]
compact = ["bmux_tui_components/compact"]
composer = []
default = []
diff-viewer = ["bmux_tui_components/diff-viewer"]
fail-on-warnings = []
permission = ["bmux_tui_components/modal-frame"]
setup = []
source-preview = [
    "source-viewer",
    "dep:unicode-segmentation",
    "dep:unicode-width",
]
source-viewer = ["bmux_tui_components/source-viewer"]
syntax = [
    "dep:bcode_syntax_render",
    "diff-viewer",
    "source-preview",
    "source-viewer",
]
terminal-viewer = [
    "dep:bmux_terminal_grid",
    "bmux_tui_components/terminal-viewer",
]
tool-card = ["compact"]
