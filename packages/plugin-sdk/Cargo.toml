[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Plugin author SDK for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "plugin", "sdk"]
license     = { workspace = true }
name        = "bcode_plugin_sdk"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bcode_agent_profile        = { workspace = true }
bcode_command              = { workspace = true }
bcode_provider_auth_models = { workspace = true }
bcode_session_models       = { workspace = true }
bcode_session_view_models  = { workspace = true }
bcode_tool                 = { workspace = true }
bcode_workflow             = { workspace = true }
bmux_keyboard              = { workspace = true, optional = true }
bmux_text_edit             = { workspace = true, optional = true }
bmux_tui                   = { workspace = true, optional = true }
bmux_tui_components        = { workspace = true, optional = true }
clap                       = { workspace = true, features = ["std"] }
schemars                   = { workspace = true }
serde                      = { workspace = true, features = ["derive", "std"] }
serde_json                 = { workspace = true }
tokio                      = { workspace = true, features = ["rt", "sync"], optional = true }

[dev-dependencies]
bcode_plugin_sdk = { path = ".", features = ["tui"] }
trybuild         = { workspace = true }

[features]
default = []
fail-on-warnings = []
tui = [
    "dep:bmux_keyboard",
    "dep:bmux_text_edit",
    "dep:bmux_tui",
    "dep:bmux_tui_components",
    "dep:tokio",
]
