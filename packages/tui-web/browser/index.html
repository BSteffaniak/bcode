<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Bcode · BMUX browser TUI</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #101216; color: #e0e4ec; }
    #surface { position: relative; width: 100%; height: calc(100% - 2rem); }
    #bcode-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #status { height: 2rem; margin: 0; font: 14px monospace; }
  </style>
</head>
<body>
  <main id="surface"><canvas id="bcode-canvas" aria-label="Bcode session"></canvas></main>
  <p id="status" role="status">Loading browser-local BMUX TUI…</p>
  <script type="module" src="./bootstrap.js"></script>
</body>
</html>
