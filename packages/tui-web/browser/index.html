<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Bcode · BMUX browser TUI</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #101216; color: #e0e4ec; }
    body { display: flex; flex-direction: column; }
    #surface { position: relative; width: 100%; flex: 1; min-height: 0; }
    #bcode-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #status { margin: 0; font: 14px monospace; }
    #recovery-controls { padding: .25rem; }
    #semantics { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  </style>
</head>
<body>
  <main id="surface"><canvas id="bcode-canvas" aria-label="Bcode session"></canvas></main>
  <section id="semantics" aria-label="Visible session regions"></section>
  <footer id="recovery-controls" aria-label="Session recovery">
    <p id="status" role="status">Loading browser-local BMUX TUI…</p>
    <button id="refresh-session" type="button" disabled>Refresh canonical state</button>
    <button id="retry-submission" type="button" hidden disabled>Retry exact unresolved submission</button>
    <button id="acknowledge-control" type="button" hidden disabled>Acknowledge unknown control outcome after refresh</button>
  </footer>
  <script type="module" src="./bootstrap.js"></script>
</body>
</html>
