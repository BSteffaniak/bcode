<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Committed browser semantics fixture</title>
<div id="host" style="position:relative;width:720px;height:360px"><canvas id="canvas" style="width:100%;height:100%"></canvas></div>
<section id="semantics" aria-label="Visible session"></section><pre id="result">pending</pre>
<script type="module">
// Real WASM/Canvas acceptance fixture. Production lane must serve the current
// built bundle at ?bundle=<same-origin-directory>/ and run in Chromium; Node
// doubles alone do not establish committed geometry or accessibility correctness.
const result = document.getElementById('result');
let rust, bridge;
try {
  const bundle = new URL(new URLSearchParams(location.search).get('bundle') ?? './bundle/', location.href);
  if (bundle.origin !== location.origin || !bundle.pathname.endsWith('/')) throw new Error('invalid bundle');
  const { default: init, BrowserSession } = await import(new URL('bcode_tui_web.js', bundle));
  const { mountInteractiveSurface } = await import(new URL('interactive-surface.js', bundle));
  const { commitSemanticRegions } = await import(new URL('browser-session.js', bundle));
  await init();
  rust = new BrowserSession('00000000-0000-4000-8000-000000000001', 'canvas', 80, 20, 9, 18);
  bridge = mountInteractiveSurface({
    container: document.getElementById('host'), canvas: document.getElementById('canvas'),
    mapPoint: () => null, onInput: () => {},
  });
  if (await rust.present() !== true) throw new Error('uncommitted Canvas output');
  const metadata = JSON.parse(rust.accessibility());
  if (!Array.isArray(metadata.regions) || metadata.regions.length === 0) throw new Error('missing committed regions');
  for (const region of metadata.regions) {
    if (region.area.x + region.area.width > 80 || region.area.y + region.area.height > 20) throw new Error('unclipped region');
  }
  const root = document.getElementById('semantics');
  commitSemanticRegions(root, metadata.regions);
  if (root.children.length !== metadata.regions.length) throw new Error('incomplete semantic mirror');
  if (root.querySelector('button,input,a,[tabindex]')) throw new Error('passive semantics gained input authority');
  rust.resize(0, 0, 9, 18, '14px monospace', 14);
  await rust.present();
  const empty = JSON.parse(rust.accessibility());
  commitSemanticRegions(root, empty.regions);
  if (root.children.length) throw new Error('stale regions on empty surface');
  const bridgeRoot = document.createElement('div');
  bridgeRoot.style.cssText = 'position:relative;width:720px;height:360px';
  const imageCanvas = document.createElement('canvas'); imageCanvas.id='artifact-canvas';
  bridgeRoot.append(imageCanvas); document.body.append(bridgeRoot);
  const { decodeArtifactImage } = await import(new URL('browser-session.js', bundle));
  const png = Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAGUlEQVR4nGP4IBLwnxLMMGrAqAGjBgwXAwCuWFMfVymrAQAAAABJRU5ErkJggg=='), c => c.charCodeAt(0));
  const raster = await decodeArtifactImage(png, 'image/png');
  if (!raster.bytes.length || raster.width < 1 || raster.height < 1) throw new Error('real image decode failed');
  result.textContent = 'PASS committed real WASM Canvas regions + passive mirror + zero-size clearing + bounded browser raster decode';
} catch (error) {
  result.textContent = `FAIL ${error?.message ?? String(error)}`;
} finally {
  bridge?.dispose();
  if (rust) { rust.cancel_pointer(); rust.dispose(); rust.free(); }
}
</script></html>
