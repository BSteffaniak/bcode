<!doctype html>
<meta charset="utf-8">
<title>Real WASM and durable backend acceptance</title>
<div id="host" style="position:relative;width:900px;height:540px"><canvas id="canvas" style="width:900px;height:540px"></canvas></div>
<pre id="result">pending</pre>
<script type="module">
const output = document.getElementById('result');
const { committedCheckpoint } = await import('/production-evidence.mjs');
const checkpoints = [];
let semanticRegions = [];
const assert = (value, message) => { if (!value) throw new Error(message); };
const wait = async (predicate, label) => {
  const until = performance.now() + 15000;
  while (!predicate()) {
    if (performance.now() > until) throw new Error(`timeout: ${label}`);
    await new Promise(resolve => setTimeout(resolve, 25));
  }
};
let mounted;
try {
  const configuration = await (await fetch('/fixture.json')).json();
  const manifest = await (await fetch('/tui/manifest.json')).json();
  const compatibility = await (await fetch('/tui/compatibility.json')).json();
  assert(compatibility.schema_version === 1 && manifest.schema_version === 2,
    'unsupported bundle/backend handshake');
  assert(compatibility.artifact_sha256 === manifest.artifact_sha256 &&
    JSON.stringify(compatibility.protocol) === JSON.stringify(manifest.protocol),
    'mixed bundle/backend compatibility');
  assert(Object.values(compatibility.protocol).every(version => version === 1),
    'unsupported browser protocol');
  const wasm = await import('/tui/bcode_tui_web.js');
  const { mountInteractiveSurface } = await import('/tui/interactive-surface.js');
  const { mountBrowserSession } = await import('/tui/browser-session.js');
  await wasm.default();
  // Observe real Canvas text calls without replacing rendering or manufacturing a UI.
  // Keep bounded evidence across repaints; canonical backend checks are independent.
  const drawn = [];
  const originalFillText = CanvasRenderingContext2D.prototype.fillText;
  CanvasRenderingContext2D.prototype.fillText = function(text, ...args) {
    // BMUX paints transactionally to a scratch Canvas before committing pixels.
    // Observe its real text calls as well as the destination Canvas.
    drawn.push(String(text));
    if (drawn.length > 200000) drawn.splice(0, 100000);
    return originalFillText.call(this, text, ...args);
  };
  const text = 'browser-e2e-real-backend';
  const recoveryState = {};
  const operations = [], errors = [], accepted = [];
  let discard = true, dropped;
  const realFetch = globalThis.fetch.bind(globalThis);
  // Fault injection occurs AFTER the real server replies. No response is fabricated.
  let requests = 0;
  const transport = async (url, options) => {
    requests++;
    const response = await realFetch(url, options);
    if (new URL(url).pathname.endsWith('/submit-message')) {
      operations.push(JSON.parse(options.body));
      if (discard) {
        discard = false;
        dropped = await response.json();
        assert(dropped.outcome?.type === 'submission_accepted', 'first request did not commit');
        throw new TypeError('test-owned connection lost after durable acceptance');
      }
      accepted.push(await response.clone().json());
    }
    return response;
  };
  const cellWidth = 9, cellHeight = 18;
  const mount = () => mountBrowserSession({cellWidth, cellHeight,
    wasm, mountInteractiveSurface,
    container: document.getElementById('host'), canvas: document.getElementById('canvas'),
    sessionId: configuration.session, token: configuration.token,
    backendOrigin: location.origin, fetch: transport, recoveryState,
    // Manual observations below avoid timing-dependent overlap with mutation admission.
    pollMs: 60000, requestTimeoutMs: 60000,
    onSemantics: regions => { semanticRegions = regions; },
    onError: error => errors.push(error),
  });
  const api = async (path, body, token = configuration.token) => {
    const response = await realFetch(`${path}?token=${encodeURIComponent(token)}`, body === undefined ? {} : {
      method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify(body),
    });
    return response.json();
  };
  const snapshotPath = `/api/session-view/${configuration.session}`;
  assert((await api(snapshotPath, undefined, 'wrong-token')).error === 'unauthorized', 'read auth rejection');
  const unauthorized = {session_id: configuration.session, submission_id: 'unauthorized-e2e', text: 'must never be accepted'};
  assert((await api('/api/session-view/submit-message', unauthorized, 'wrong-token')).error === 'unauthorized', 'write auth rejection');
  mounted = await mount();
  checkpoints.push(await committedCheckpoint('initial', canvas, semanticRegions,
    {label:'Session composer', cellWidth, cellHeight}));
  const editor = document.querySelector('[data-bmux-input]');
  assert(editor && document.activeElement === editor, 'committed composer geometry did not focus real BMUX input');
  editor.value = text;
  editor.dispatchEvent(new InputEvent('input', {inputType:'insertText', data:text, bubbles:true}));
  await wait(() => {
    if (errors.length) throw new Error(`editor failed: ${errors.map(String).join('; ')}`);
    return drawn.join('').includes(text);
  }, 'visible editor text').catch(error => {
    throw new Error(`${error.message}; canvas=${canvas.width}x${canvas.height}; output=${drawn.join('').slice(-4000)}`);
  });
  checkpoints.push(await committedCheckpoint('editor', canvas, semanticRegions));
  assert(checkpoints[0].pixel_sha256 !== checkpoints[1].pixel_sha256, 'editor did not change committed pixels');
  editor.dispatchEvent(new KeyboardEvent('keydown', {key:'Enter', code:'Enter', ctrlKey:true, bubbles:true, cancelable:true}));
  await wait(() => errors.length > 0 && dropped, 'ambiguous post-commit response').catch(error => {
    throw new Error(`${error.message}; operations=${operations.length}; errors=${errors.map(String).join('; ')}; dropped=${JSON.stringify(dropped)}`);
  });
  assert(dropped.outcome?.type === 'submission_accepted',
    `first request did not commit: ${JSON.stringify(dropped)}`);
  assert(operations.length === 1, 'unexpected implicit resubmission');
  await mounted.dispose();
  mounted = undefined;
  assert(typeof recoveryState.value === 'string', 'pending operation recovery missing');
  // A new Rust UI and new input bridge reconnect, retaining only production recovery state.
  mounted = await mount();
  await mounted.retrySubmission();
  await wait(() => accepted.length === 1, 'exact retry receipt');
  assert(JSON.stringify(operations[0]) === JSON.stringify(operations[1]), 'retry changed exact operation');
  const receipt = accepted[0].outcome?.receipt;
  assert(JSON.stringify(receipt) === JSON.stringify(dropped.outcome.receipt), 'canonical retry receipt differs');
  const conflict = await api('/api/session-view/submit-message', {...operations[0], text:'conflicting payload'});
  assert(conflict.error, 'conflicting retry unexpectedly accepted');
  const malformed = await api('/api/session-view/submit-message', {...operations[0], submission_id:'authority-e2e', execution:{provider:'not-allowed'}});
  assert(malformed.error === 'invalid_request', 'browser execution authority accepted');
  let snapshot;
  const until = performance.now() + 15000;
  do {
    snapshot = await api(snapshotPath);
    if (JSON.stringify(snapshot.snapshot?.transcript).includes(`fake: ${text}`)) break;
    if (performance.now() > until) throw new Error(`real provider transcript did not arrive: ${JSON.stringify(snapshot).slice(0, 14000)}`);
    await new Promise(resolve => setTimeout(resolve, 50));
  } while (true);
  drawn.length = 0;
  await mounted.dispose();
  mounted = await mount();
  await wait(() => drawn.join('').includes(`fake: ${text}`), 'visible real assistant transcript');
  checkpoints.push(await committedCheckpoint('transcript', canvas, semanticRegions));
  const guard = {session_id: configuration.session, epoch: snapshot.epoch, revision: snapshot.revision};
  const missingPermission = {type:'permission', permission_id:'never-issued-e2e', approved:true, remember:false};
  const staleChecks = [
    [{...guard, epoch:'00000000-0000-4000-8000-000000000000', action:missingPermission}, 'stale_observation'],
    [{...guard, revision:0, action:missingPermission}, 'stale_observation'],
    [{...guard, action:{type:'invoke', service:'filesystem', operation:'read'}}, 'invalid_request'],
    [{...guard, action:missingPermission, execution:{provider:'not-allowed'}}, 'invalid_request'],
  ];
  for (const [operation, expected] of staleChecks) {
    const response = await api('/api/session-view/control', operation);
    assert(response.error === expected, `negative control expected ${expected}: ${JSON.stringify(response)}`);
  }
  const missing = await api('/api/session-view/control', {...guard, action:missingPermission});
  assert(missing.error === 'stale_control', `unknown permission identity: ${JSON.stringify(missing)}`);
  for (const action of [
    {type:'permission_batch', batch_id:'never-issued-batch-e2e', approved:true},
    {type:'interaction', interaction_id:'never-issued-interaction-e2e', input:{type:'submit', value:{answer:'must not resolve'}}},
  ]) {
    const observed = await api(snapshotPath);
    const response = await api('/api/session-view/control', {
      session_id: configuration.session, epoch: observed.epoch, revision: observed.revision, action,
    });
    assert(response.error === 'stale_control', `unknown identity accepted: ${JSON.stringify(response)}`);
  }
  await mounted.refresh();
  const historyDraft = 'draft retained across canonical history navigation';
  const historyInput = document.querySelector('[data-bmux-input]');
  historyInput.value = historyDraft;
  historyInput.dispatchEvent(new InputEvent('input', {
    inputType:'insertText', data:historyDraft, bubbles:true,
  }));
  await wait(() => drawn.join('').includes(historyDraft), 'visible history-navigation draft');
  await mounted.loadHistory('older');
  await mounted.loadHistory('tail');
  drawn.length = 0;
  // An unchanged snapshot correctly skips painting. Force a genuine resize
  // transaction so the retained draft must appear in newly rendered pixels.
  const resized = document.getElementById('canvas');
  resized.style.width = '891px';
  await mounted.refresh();
  await wait(() => drawn.join('').includes(historyDraft), 'history navigation retained composer draft');
  await wait(() => drawn.join('').includes(`fake: ${text}`), 'readable transcript after history tail');
  const image = document.getElementById('canvas').getContext('2d').getImageData(0, 0, 900, 540).data;
  const background = Array.from(image.slice(0, 4));
  assert(image.some((channel, index) => channel !== background[index % 4]), 'Canvas contains no visible ink');
  checkpoints.push(await committedCheckpoint('history-resize', canvas, semanticRegions));
  const disposedEditor = document.querySelector('[data-bmux-input]');
  const disposed = mounted;
  await disposed.dispose();
  mounted = undefined;
  const requestsAtDispose = requests;
  disposedEditor.value = 'disposed must not submit';
  disposedEditor.dispatchEvent(new InputEvent('input', {inputType:'insertText', data:disposedEditor.value, bubbles:true}));
  disposedEditor.dispatchEvent(new KeyboardEvent('keydown', {key:'Enter', code:'Enter', bubbles:true, cancelable:true}));
  await disposed.refresh();
  await disposed.retrySubmission();
  await disposed.dispose();
  await new Promise(resolve => setTimeout(resolve, 100));
  assert(requests === requestsAtDispose, 'disposed instance performed network operations');
  assert(semanticRegions.length === 0, 'dispose retained semantic regions');
  CanvasRenderingContext2D.prototype.fillText = originalFillText;
  const { runProductionScenarios } = await import('/production-scenarios.mjs');
  const scenarios = await runProductionScenarios({configuration, wasm, mountInteractiveSurface, mountBrowserSession});
  output.textContent = JSON.stringify({passed:true, text, receipt, checkpoints, scenarios,
    negative_controls: staleChecks.length + 3, disposed_requests: requests - requestsAtDispose,
    evidence:['real WASM Canvas editor input', 'real deterministic provider transcript',
      'post-commit dropped response', 'remount exact retry identical receipt',
      'read/write auth rejection', 'conflicting payload and execution-authority rejection',
      'canonical older/tail history navigation with Canvas-readable retained draft'],
    submission_requests:operations.length, operation:operations[0]});
} catch (error) {
  const describe = error => ({message: error?.stack ?? String(error),
    cause: error?.cause ? describe(error.cause) : undefined,
    errors: error instanceof AggregateError ? [...error.errors].map(describe) : undefined});
  output.textContent = JSON.stringify({passed:false,error:describe(error)});
} finally {
  if (mounted) await mounted.dispose();
}
</script>
