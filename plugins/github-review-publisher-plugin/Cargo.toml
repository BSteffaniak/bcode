[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "GitHub review publisher plugin for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "github", "code-review", "plugin"]
license     = { workspace = true }
name        = "bcode_github_review_publisher_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bcode_code_review_github   = { workspace = true }
bcode_code_review_models   = { workspace = true }
bcode_code_review_provider = { workspace = true }
bcode_plugin_sdk           = { workspace = true }
serde                      = { workspace = true, features = ["derive", "std"] }
serde_json                 = { workspace = true }
thiserror                  = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default          = []
fail-on-warnings = []
static-bundled   = []
