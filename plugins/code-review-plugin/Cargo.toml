[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "local code review plugin for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "code-review", "git", "plugin"]
license     = { workspace = true }
name        = "bcode_code_review_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bcode_code_review        = { workspace = true }
bcode_code_review_models = { workspace = true }
bcode_code_review_ui     = { workspace = true, optional = true }
bcode_command            = { workspace = true }
bcode_plugin_sdk         = { workspace = true, features = ["tui"] }
clap                     = { workspace = true, features = ["derive", "std"], optional = true }
serde                    = { workspace = true, features = ["derive", "std"] }
serde_json               = { workspace = true }
toml                     = { workspace = true }

[dev-dependencies]
bcode_code_review = { workspace = true, features = ["testing"] }
tempfile          = { workspace = true }

[features]
default          = []
fail-on-warnings = []
static-bundled   = ["dep:bcode_code_review_ui", "dep:clap"]
