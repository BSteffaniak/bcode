id      = "bcode.code_review"
name    = "Bcode Code Review Plugin"
version = "0.0.1"


[config]
section = "code_review"

categories = ["review"]


[[services]]
class                 = "control"
description           = "Plugin-owned code review commands"
interface_id          = "bcode.command/v1"
invocation_operations = ["invoke"]
name                  = "Code Review Commands"

[[services]]
class        = "tool_execution"
description  = "Review tools: read the code review, draft comments, mark files viewed, publish"
interface_id = "bcode.tool/v1"
name         = "Code Review Tools"

[[services]]
class        = "service"
description  = "Local Git code review services"
interface_id = "bcode.code_review/v1"
name         = "Code Review"

[[services]]
class        = "service"
description  = "Branches related to a stack by Git history, as review discovery hints"
interface_id = "bcode.review_discovery/v1"
name         = "Git Review Discovery"

[concurrency]
max  = 2
type = "limited"

[runtime]
abi_version  = 5
event_symbol = "bcode_plugin_handle_event_v1"
library      = "libbcode_code_review_plugin.dylib"
type         = "native"
