[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Plugin-owned file path references for the Bcode composer"
edition     = { workspace = true }
keywords    = ["bcode", "plugin", "completion", "paths"]
license     = { workspace = true }
name        = "bcode_file_references_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bcode_filesystem_models = { workspace = true }
bcode_plugin_sdk        = { workspace = true }
bcode_tool              = { workspace = true }
bmux_ipc                = { workspace = true }
bmux_plugin_sdk         = { workspace = true }
futures                 = { workspace = true, features = ["executor"] }
serde                   = { workspace = true, features = ["derive", "std"] }
serde_json              = { workspace = true }

[features]
# `dynamic-backend`/`dynamic-frontend` are packaging roles: the packager builds one
# component with one of them; workspace builds never select them.
default          = []
dynamic-backend  = []
dynamic-frontend = []
fail-on-warnings = []
tui              = ["bcode_plugin_sdk/tui"]

[build-dependencies]
bmux_plugin_schema = { workspace = true }

[package.metadata.cargo-machete]
# `bmux_plugin_schema` compiles the BPDL contract in build.rs, which machete cannot trace.
ignored = ["bmux_plugin_schema"]
