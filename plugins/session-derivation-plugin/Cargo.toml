[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Plugin-owned session fork and clone workflows for Bcode"
edition     = { workspace = true }
keywords    = ["bcode", "session", "derivation", "plugin"]
license     = { workspace = true }
name        = "bcode_session_derivation_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bcode_command        = { workspace = true }
bcode_plugin_sdk     = { workspace = true, features = ["tui"] }
bcode_session_models = { workspace = true }
bcode_tool           = { workspace = true }
bmux_keyboard        = { workspace = true }
bmux_tui             = { workspace = true }
serde                = { workspace = true }
serde_json           = { workspace = true }

[features]
default          = []
fail-on-warnings = []
static-bundled   = []
