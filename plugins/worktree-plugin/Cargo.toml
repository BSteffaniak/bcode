[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Git worktree tool plugin for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "worktree", "git", "tool", "plugin"]
license     = { workspace = true }
name        = "bcode_worktree_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bcode_client = { workspace = true }
bcode_command = { workspace = true }
bcode_config = { workspace = true }
bcode_plugin_sdk = { workspace = true }
bcode_session_models = { workspace = true }
bcode_tool = { workspace = true }
bcode_tui_components = { workspace = true, optional = true, features = [
    "tool-card",
] }
bcode_worktree = { workspace = true }
bcode_worktree_models = { workspace = true }
bmux_keyboard = { workspace = true }
bmux_text_edit = { workspace = true, optional = true }
bmux_tui = { workspace = true, optional = true }
bmux_tui_components = { workspace = true, optional = true, features = [
    "key-hint-bar",
    "selectable-list",
    "text-input-box",
] }
clap = { workspace = true, features = ["derive", "std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# `dynamic-backend`/`dynamic-frontend` are packaging roles: the packager builds one
# component with one of them; workspace builds never select them.
default = []
dynamic-backend = []
dynamic-frontend = []
fail-on-warnings = []
tui = [
    "bcode_plugin_sdk/tui",
    "dep:bcode_tui_components",
    "dep:bmux_text_edit",
    "dep:bmux_tui",
    "dep:bmux_tui_components",
]
