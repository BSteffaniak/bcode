[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Workflow discovery, commands, status, and TUI for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "plugin", "workflow"]
license     = { workspace = true }
name        = "bcode_workflow_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bcode_client         = { workspace = true }
bcode_command        = { workspace = true }
bcode_ipc            = { workspace = true }
bcode_plugin_sdk     = { workspace = true, features = ["tui"] }
bcode_session_models = { workspace = true }
bcode_workflow       = { workspace = true }
bcode_workflow_store = { workspace = true }
bmux_keyboard        = { workspace = true }
bmux_tui             = { workspace = true }
clap                 = { workspace = true, features = ["derive", "std"] }
jsonschema           = { workspace = true }
serde                = { workspace = true, features = ["derive", "std"] }
serde_json           = { workspace = true }
tokio                = { workspace = true }

[dev-dependencies]
bcode_plugin = { workspace = true }
toml         = { workspace = true }

[features]
default          = []
fail-on-warnings = []
static-bundled   = []
