id      = "bcode.workflow"
name    = "Bcode Workflow Plugin"
version = "0.0.1"

categories = ["workflow", "automation"]

[[services]]
class        = "service"
description  = "Workflow discovery and lifecycle commands"
interface_id = "bcode.command/v1"
name         = "Workflow Commands"

[[services]]
class        = "service"
description  = "Active workflow status for a session"
interface_id = "bcode.session-status/v1"
name         = "Workflow Session Status"

[[services]]
class        = "service"
description  = "Workflow-owned deterministic planning and drift blocks"
interface_id = "bcode.workflow-block/v1"
name         = "Workflow Planning Blocks"

[[services.workflow_blocks]]
block_id               = "workflow.instruction-drift"
block_version          = 1
cancellation_supported = true
effect                 = "read_only"
operation              = "workflow.instruction-drift"
plugin_id              = "bcode.workflow"
reconciliation         = "idempotent_replay"
timeout_ms             = 5000

[services.workflow_blocks.input]
schema = { type = "object", additionalProperties = false, required = [
    "version",
    "accepted_instruction_fingerprint_sha256",
    "current_instruction_fingerprint_sha256",
    "accepted_validation_plan_sha256",
    "proposed_validation_plan_sha256",
    "accepted_formatting_plan_sha256",
    "proposed_formatting_plan_sha256",
    "reviewed",
], properties = { version = { const = 1 }, accepted_instruction_fingerprint_sha256 = { type = "string", pattern = "^[0-9a-f]{64}$" }, current_instruction_fingerprint_sha256 = { type = "string", pattern = "^[0-9a-f]{64}$" }, accepted_validation_plan_sha256 = { type = "string", pattern = "^[0-9a-f]{64}$" }, proposed_validation_plan_sha256 = { type = "string", pattern = "^[0-9a-f]{64}$" }, accepted_formatting_plan_sha256 = { type = "string", pattern = "^[0-9a-f]{64}$" }, proposed_formatting_plan_sha256 = { type = "string", pattern = "^[0-9a-f]{64}$" }, reviewed = { type = "boolean" } } }
type_name = "bcode.workflow.instruction-drift-review/v1"

[services.workflow_blocks.output]
schema = { type = "object", required = [
    "status",
    "version",
], properties = { status = { type = "string", enum = [
    "unchanged",
    "blocked",
    "reviewed_replacement",
] }, version = { const = 1 } } }
type_name = "bcode.workflow.instruction-drift-receipt/v1"

[services.workflow_blocks.authorization]
capability              = "disabled"
explicit_grant_required = false

[[services.workflow_blocks]]
block_id               = "workflow.batch-outcome"
block_version          = 1
cancellation_supported = true
effect                 = "read_only"
operation              = "workflow.batch-outcome"
plugin_id              = "bcode.workflow"
reconciliation         = "idempotent_replay"
timeout_ms             = 5000

[services.workflow_blocks.input]
schema    = { type = "object" }
type_name = "bcode.workflow.coding-workflow-state/v1"

[services.workflow_blocks.output]
schema = { type = "object", additionalProperties = false, required = [
    "version",
    "outcome",
    "state",
], properties = { version = { const = 1 }, outcome = { enum = [
    "completed",
    "exhausted",
] }, state = { type = "object" } } }
type_name = "bcode.workflow.implementation-batch-result/v1"

[services.workflow_blocks.authorization]
capability              = "read_only"
explicit_grant_required = false

