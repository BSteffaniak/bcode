[[workflow_templates]]
contribution_version  = 1
description           = "Implement a bounded task, run an exact verification command plan, and optionally create one approved Git commit."
required_capabilities = ["workflow-production/v1", "workflow-block/v1"]
required_plugins      = ["bcode.shell", "bcode.git"]
template_id           = "implementation-verification-commit"
template_version      = 1
title                 = "Implementation verification commit"

[workflow_templates.configuration_schema]
type_name = "bcode.workflow.implementation-verification-commit-config/v1"
[workflow_templates.configuration_schema.schema]
additionalProperties = false
required = [
    "version",
    "implementation_prompt",
    "stop_condition",
    "iteration_limit",
    "command_plan",
    "command_timeout_ms",
    "verification_policy",
    "commit_behavior",
    "commit_message_skill",
]
type = "object"

[workflow_templates.configuration_schema.schema.properties.version]
const = 1

[workflow_templates.configuration_schema.schema.properties.implementation_prompt]
maxLength = 65536
minLength = 1
type      = "string"

[workflow_templates.configuration_schema.schema.properties.stop_condition]
additionalProperties = false
required             = ["path", "equals"]
type                 = "object"

[workflow_templates.configuration_schema.schema.properties.stop_condition.properties.path]
maxLength = 512
minLength = 1
type      = "string"

[workflow_templates.configuration_schema.schema.properties.stop_condition.properties.equals]

[workflow_templates.configuration_schema.schema.properties.iteration_limit]
maximum = 100
minimum = 1
type    = "integer"

[workflow_templates.configuration_schema.schema.properties.command_plan]
additionalProperties = false
required             = ["version", "cwd", "commands", "environment", "output"]
type                 = "object"

[workflow_templates.configuration_schema.schema.properties.command_plan.properties.version]
const = 1

[workflow_templates.configuration_schema.schema.properties.command_plan.properties.cwd]
maxLength = 1024
minLength = 1
type      = "string"

[workflow_templates.configuration_schema.schema.properties.command_plan.properties.commands]
maxItems = 64
minItems = 1
type     = "array"

[workflow_templates.configuration_schema.schema.properties.command_plan.properties.commands.items]
additionalProperties = false
required             = ["argv", "timeout_ms", "continue_on_nonzero"]
type                 = "object"

[workflow_templates.configuration_schema.schema.properties.command_plan.properties.commands.items.properties.argv]
maxItems = 256
minItems = 1
type     = "array"

[workflow_templates.configuration_schema.schema.properties.command_plan.properties.commands.items.properties.argv.items]
maxLength = 65536
type      = "string"

[workflow_templates.configuration_schema.schema.properties.command_plan.properties.commands.items.properties.continue_on_nonzero]
type = "boolean"

[workflow_templates.configuration_schema.schema.properties.command_plan.properties.commands.items.properties.timeout_ms]
maximum = 300000
minimum = 1
type    = "integer"

[workflow_templates.configuration_schema.schema.properties.command_plan.properties.environment]
additionalProperties = false
required             = ["inherit", "set"]
type                 = "object"

[workflow_templates.configuration_schema.schema.properties.command_plan.properties.environment.properties.inherit]
type = "boolean"

[workflow_templates.configuration_schema.schema.properties.command_plan.properties.environment.properties.set]
additionalProperties = { type = "string", maxLength = 65536 }
maxProperties        = 128
type                 = "object"

[workflow_templates.configuration_schema.schema.properties.command_plan.properties.output]
additionalProperties = false
required             = ["preview_bytes", "artifact_spill"]
type                 = "object"

[workflow_templates.configuration_schema.schema.properties.command_plan.properties.output.properties.preview_bytes]
maximum = 65536
minimum = 0
type    = "integer"

[workflow_templates.configuration_schema.schema.properties.command_plan.properties.output.properties.artifact_spill]
type = "boolean"

[workflow_templates.configuration_schema.schema.properties.command_timeout_ms]
maximum = 300000
minimum = 1
type    = "integer"

[workflow_templates.configuration_schema.schema.properties.verification_policy]
enum = ["require_pass", "allow_failure", "skip"]

[workflow_templates.configuration_schema.schema.properties.commit_behavior]
enum = ["required", "if_changes", "disabled"]

[workflow_templates.configuration_schema.schema.properties.commit_message_skill]
maxLength = 256
minLength = 1
type      = ["string", "null"]

[workflow_templates.configuration_schema.schema.properties.commit_completed]
type = "boolean"

[workflow_templates.configuration_schema.schema.properties.commit_result]
additionalProperties = false
required = [
    "previous_head",
    "commit_hash",
    "repository_snapshot_sha256",
    "committed_tree",
    "paths",
    "committed_objects",
]
type = ["object", "null"]

[workflow_templates.configuration_schema.schema.properties.commit_result.properties.previous_head]
type = "string"

[workflow_templates.configuration_schema.schema.properties.commit_result.properties.commit_hash]
type = "string"

[workflow_templates.configuration_schema.schema.properties.commit_result.properties.repository_snapshot_sha256]
pattern = "^[0-9a-f]{64}$"
type    = "string"

[workflow_templates.configuration_schema.schema.properties.commit_result.properties.committed_tree]
type = "string"

[workflow_templates.configuration_schema.schema.properties.commit_result.properties.paths]
items       = { type = "string" }
maxItems    = 10000
type        = "array"
uniqueItems = true

[workflow_templates.configuration_schema.schema.properties.commit_result.properties.committed_objects]
items    = { type = "object" }
maxItems = 10000
type     = "array"

[[workflow_templates.compilation_bindings]]
configuration_path = "commit_message_skill"
node_id            = "commit_message"
skill_mode         = "required"

[workflow_templates.compilation_bindings.absent_fallback_edge]
from = "git_prepare"
kind = { kind = "direct" }
to   = "git_compose"

[workflow_templates.compilation_bindings.absent_fallback_edge.transform]
expression = { operation = "object", fields = { preparation = { operation = "input", source = "current", path = "" }, message = { operation = "object", fields = { title = { operation = "constant", value = "Implement verified workflow changes" }, description = { operation = "input", source = "state", path = "implementation_prompt" } } }, no_changes = { operation = "constant", value = "no_op" } } }
