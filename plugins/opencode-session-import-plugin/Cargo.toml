[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "OpenCode session import plugin for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "opencode", "session", "import", "plugin"]
license     = { workspace = true }
name        = "bcode_opencode_session_import_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bcode_config                = { workspace = true }
bcode_plugin_sdk            = { workspace = true }
bcode_session_import        = { workspace = true }
futures                     = { workspace = true, features = ["executor"] }
serde                       = { workspace = true, features = ["derive", "std"] }
serde_json                  = { workspace = true }
switchy_database            = { workspace = true }
switchy_database_connection = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default          = []
fail-on-warnings = []
static-bundled   = []
