id      = "bcode.eval"
name    = "Bcode Eval Plugin"
version = "0.0.1"

categories = ["eval"]

[[services]]
class        = "service"
description  = "Versioned SDK evaluation artifact loader"
interface_id = "bcode.eval.sdk-artifact/v1"
name         = "SDK Eval Artifacts"

[[services]]
class        = "service"
description  = "Typed read-only workflow validation blocks"
interface_id = "bcode.workflow-block/v1"
name         = "Eval Workflow Blocks"

[[services.workflow_blocks]]
block_id               = "eval.suite.validate"
block_version          = 1
cancellation_supported = true
effect                 = "read_only"
operation              = "eval.suite.validate"
plugin_id              = "bcode.eval"
reconciliation         = "idempotent_replay"
timeout_ms             = 5000

[services.workflow_blocks.input]
schema = { type = "object", required = [
    "schema_version",
    "id",
    "name",
    "variants",
    "cases",
] }
type_name = "bcode.eval.suite/v1"

[services.workflow_blocks.output]
schema = { type = "object", required = [
    "valid",
    "suite_id",
    "variant_count",
    "case_count",
], properties = { valid = { type = "boolean", const = true }, suite_id = { type = "string" }, variant_count = { type = "integer", minimum = 1 }, case_count = { type = "integer", minimum = 1 } } }
type_name = "bcode.eval.suite-validation/v1"

[services.workflow_blocks.authorization]
capability              = "disabled"
explicit_grant_required = false

[[services.workflow_blocks.resources]]
access   = "read"
resource = "eval-suite"

[[services]]
class        = "service"
description  = "Eval viewer command contributions"
interface_id = "bcode.command/v1"
name         = "Eval Commands"

[[tui_surfaces]]
description = "Full-screen eval run picker"
kind        = "eval-run-picker"
title       = "Eval Run Picker"

[[tui_surfaces]]
description = "Full-screen eval run viewer"
kind        = "eval-run-viewer"
title       = "Eval Run Viewer"

[runtime]
abi_version  = 3
event_symbol = "bcode_plugin_handle_event_v1"
library      = "libbcode_eval_plugin.dylib"
type         = "native"
