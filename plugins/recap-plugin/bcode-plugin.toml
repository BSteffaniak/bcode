id      = "bcode.recap"
name    = "Visual Recap"
version = "0.1.0"

[[services]]
interface_id          = "bcode.command/v1"
invocation_operations = ["invoke"]
name                  = "Recap Commands"

[[services]]
class        = "tool_execution"
interface_id = "bcode.tool/v1"
name         = "Recap Tools"

[concurrency]
type = "exclusive"

[runtime]
abi_version  = 5
event_symbol = "bcode_plugin_handle_event_v1"
library      = "libbcode_recap_plugin.so"
type         = "native"
