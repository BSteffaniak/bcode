[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "document extraction tool plugin for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "document", "pdf", "tool", "plugin"]
license     = { workspace = true }
name        = "bcode_document_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bcode_model_provider_runtime = { workspace = true }
bcode_plugin_sdk = { workspace = true, features = ["tui"] }
bcode_tool = { workspace = true }
bcode_tui_components = { workspace = true, features = [
    "tool-card",
], optional = true }
bmux_tui = { workspace = true, optional = true }
pdf-extract = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

[features]
# `dynamic-backend`/`dynamic-frontend` are packaging roles: the packager builds one
# component with one of them; workspace builds never select them.
default          = []
dynamic-backend  = []
dynamic-frontend = []
fail-on-warnings = []
# Kept for existing consumers; packaging does not select frontend behavior.
tui = ["dep:bcode_tui_components", "dep:bmux_tui"]
