id      = "bcode.codex-harness"
name    = "Bcode Codex Harness"
version = "0.0.1"

[[services]]
class        = "service"
description  = "Native Codex app-server managed session backend"
interface_id = "bcode.harness/v3"
name         = "Codex managed sessions"

[[services]]
class        = "query"
description  = "Bounded non-mutating installed Codex CLI candidates with native account readiness"
interface_id = "bcode.harness.candidates/v1"
name         = "Codex setup candidates"

[[services]]
class        = "service"
description  = "Native model/list discovery and exact selected thread start"
interface_id = "bcode.harness.models/v1"
name         = "Codex model selection"

[[services]]
class        = "service"
description  = "Exact thread resume preflight and physical app-server release evidence; Close acknowledgement alone never proves release"
interface_id = "bcode.harness.recovery/v1"
name         = "Codex recovery evidence"

[[services]]
class        = "query"
description  = "Namespace-bound client-terminal codex login plan; declaration is not readiness or permission"
interface_id = "bcode.harness.terminal-auth/v1"
name         = "Codex native terminal login preparation"

[concurrency]
# Operations serialize on retained plugin state; only a waiting observe releases that lock
# while it waits for native output.
type = "concurrent"

[runtime]
abi_version  = 5
event_symbol = "bcode_plugin_handle_event_v1"
library      = "libbcode_codex_harness_plugin.dylib"
type         = "native"
