[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Normalized scoped model gateway provider for Bcode"
edition     = { workspace = true }
keywords    = ["bcode", "model", "provider", "plugin"]
license     = { workspace = true }
name        = "bcode_auth_broker_provider_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bcode_command                = { workspace = true }
bcode_confined_fs            = { workspace = true }
bcode_model                  = { workspace = true }
bcode_model_provider_runtime = { workspace = true }
bcode_plugin_sdk             = { workspace = true }
bcode_xray                   = { workspace = true }
bcode_xray_models            = { workspace = true }
bmux_plugin_sdk              = { workspace = true }
clap                         = { workspace = true, features = ["derive", "std"] }
reqwest                      = { workspace = true, features = ["json"] }
serde                        = { workspace = true, features = ["derive", "std"] }
serde_json                   = { workspace = true }
toml                         = { workspace = true, features = ["display"] }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# `dynamic-backend`/`dynamic-frontend` are packaging roles: the packager builds one
# component with one of them; workspace builds never select them.
default          = []
dynamic-backend  = []
dynamic-frontend = []
fail-on-warnings = []
