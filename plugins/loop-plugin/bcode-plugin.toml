id      = "bcode.loop"
name    = "Bcode Loop Plugin"
version = "0.0.1"

[[services]]
class        = "service"
description  = "Prompt loop commands"
interface_id = "bcode.command/v1"
name         = "Loop Commands"

[[services]]
class        = "service"
description  = "Active prompt loop session status"
interface_id = "bcode.session-status/v1"
name         = "Loop Session Status"

[[services]]
class        = "service"
description  = "Read-only loop iteration activity projection"
interface_id = "bcode.activity-presentation/v1"
name         = "Loop Activity Presentation"

[[services]]
class        = "service"
description  = "Read-only judgement-backed loop evaluation"
interface_id = "bcode.workflow-block/v1"
name         = "Loop Judgement Evaluation"

[[services.workflow_blocks]]
block_id               = "loop.judgement.evaluate"
block_version          = 5
cancellation_supported = true
effect                 = "read_only"
operation              = "loop.judgement.evaluate"
plugin_id              = "bcode.loop"
reconciliation         = "repair_required"
timeout_ms             = 60000

[services.workflow_blocks.input]
schema = { "$schema" = "https://json-schema.org/draft/2020-12/schema", "title" = "LoopWorkflowIteration", "type" = "object", "properties" = { "condition_met" = { "type" = "boolean" }, "evidence" = { "type" = "array", "items" = { "type" = "string" } }, "external_blocker" = { "$ref" = "#/$defs/LoopExternalBlocker", "default" = "none" }, "implementation_prompt" = { "type" = "string" }, "iteration" = { "type" = "integer", "format" = "uint32", "minimum" = 0 }, "judgement_evaluation" = { "anyOf" = [
    { "$ref" = "#/$defs/EvaluationConfig" },
    { "type" = "null" },
] }, "max_iterations" = { "type" = "integer", "format" = "uint32", "minimum" = 0 }, "planning_ready" = { "type" = "boolean", "default" = false }, "stop_condition" = { "type" = "string" }, "summary" = { "type" = "string" } }, "required" = [
    "implementation_prompt",
    "stop_condition",
    "max_iterations",
    "iteration",
    "condition_met",
    "evidence",
    "summary",
], "$defs" = { "EvaluationConfig" = { "type" = "object", "properties" = { "auth_profile" = { "type" = "string" }, "model_id" = { "type" = "string" }, "on_failure" = { "description" = "The existing read-only agent evaluator can be retained on service failure.", "$ref" = "#/$defs/FailurePolicy" }, "provider_plugin_id" = { "type" = "string" }, "threshold_percent" = { "description" = "Completion requires at least this probability, plus concrete agent-collected evidence.", "type" = "integer", "format" = "uint8", "maximum" = 255, "minimum" = 0 } }, "additionalProperties" = false, "required" = [
    "provider_plugin_id",
    "model_id",
    "auth_profile",
    "threshold_percent",
    "on_failure",
] }, "FailurePolicy" = { "type" = "string", "enum" = [
    "pause",
    "agent_fallback",
] }, "LoopExternalBlocker" = { "type" = "string", "enum" = [
    "none",
    "approval_required",
    "input_required",
    "dependency_required",
] } }, "additionalProperties" = false }
type_name = "bcode_loop_plugin::LoopWorkflowIteration"

[services.workflow_blocks.output]
schema = { "$schema" = "https://json-schema.org/draft/2020-12/schema", "title" = "LoopWorkflowIteration", "type" = "object", "properties" = { "condition_met" = { "type" = "boolean" }, "evidence" = { "type" = "array", "items" = { "type" = "string" } }, "external_blocker" = { "$ref" = "#/$defs/LoopExternalBlocker", "default" = "none" }, "implementation_prompt" = { "type" = "string" }, "iteration" = { "type" = "integer", "format" = "uint32", "minimum" = 0 }, "judgement_evaluation" = { "anyOf" = [
    { "$ref" = "#/$defs/EvaluationConfig" },
    { "type" = "null" },
] }, "max_iterations" = { "type" = "integer", "format" = "uint32", "minimum" = 0 }, "planning_ready" = { "type" = "boolean", "default" = false }, "stop_condition" = { "type" = "string" }, "summary" = { "type" = "string" } }, "required" = [
    "implementation_prompt",
    "stop_condition",
    "max_iterations",
    "iteration",
    "condition_met",
    "evidence",
    "summary",
], "$defs" = { "EvaluationConfig" = { "type" = "object", "properties" = { "auth_profile" = { "type" = "string" }, "model_id" = { "type" = "string" }, "on_failure" = { "description" = "The existing read-only agent evaluator can be retained on service failure.", "$ref" = "#/$defs/FailurePolicy" }, "provider_plugin_id" = { "type" = "string" }, "threshold_percent" = { "description" = "Completion requires at least this probability, plus concrete agent-collected evidence.", "type" = "integer", "format" = "uint8", "maximum" = 255, "minimum" = 0 } }, "additionalProperties" = false, "required" = [
    "provider_plugin_id",
    "model_id",
    "auth_profile",
    "threshold_percent",
    "on_failure",
] }, "FailurePolicy" = { "type" = "string", "enum" = [
    "pause",
    "agent_fallback",
] }, "LoopExternalBlocker" = { "type" = "string", "enum" = [
    "none",
    "approval_required",
    "input_required",
    "dependency_required",
] } }, "additionalProperties" = false }
type_name = "bcode_loop_plugin::LoopWorkflowIteration"

[services.workflow_blocks.authorization]
capability              = "read_only"
explicit_grant_required = false

[[tui_surfaces]]
description = "Configure and start a deterministic prompt loop"
kind        = "loop.start"
title       = "Start Loop"

[[tui_surfaces]]
description = "Generate loop prompts from an objective and start the existing loop"
kind        = "goal.start"
title       = "Start Goal"

[[tui_surfaces]]
description = "View the live goal progress document"
kind        = "goal.progress.live"
title       = "Goal Progress"

[[tui_surfaces]]
description = "Watch goal execution and inspect worker sessions"
kind        = "goal.watch"
title       = "Watch Goal"

[concurrency]
max  = 1
type = "limited"

[runtime]
abi_version  = 5
event_symbol = "bcode_plugin_handle_event_v1"
library      = "libbcode_loop_plugin.dylib"
type         = "native"
