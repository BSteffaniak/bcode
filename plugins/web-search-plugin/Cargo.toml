[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "web search and fetch tool plugin for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "web", "search", "tool", "plugin"]
license     = { workspace = true }
name        = "bcode_web_search_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bcode_model = { workspace = true }
bcode_model_provider_runtime = { workspace = true }
bcode_plugin_sdk = { workspace = true, features = ["tui"] }
bcode_provider_auth_models = { workspace = true }
bcode_tool = { workspace = true }
bcode_tui_components = { workspace = true, features = [
    "tool-card",
], optional = true }
bmux_tui = { workspace = true, optional = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "time"] }

[features]
# `dynamic-backend`/`dynamic-frontend` are packaging roles: the packager builds one
# component with one of them; workspace builds never select them.
default          = []
dynamic-backend  = []
dynamic-frontend = []
fail-on-warnings = []
frontend         = ["bcode_tui_components", "bmux_tui"]
