id      = "bcode.default-agents"
name    = "Bcode Default Agents"
version = "0.0.1"

[[services]]
description  = "Default plan/build agent profiles and policy evaluation"
interface_id = "bcode.agent-profile/v1"
name         = "Default Agents"

[agent_defaults]
build_tools = [
    "shell.run",
    "filesystem.read",
    "filesystem.exists",
    "filesystem.list",
    "filesystem.find",
    "filesystem.grep",
    "filesystem.stat",
    "filesystem.write",
    "filesystem.edit",
    "filesystem.multi_edit",
    "vim_edit.preview",
    "vim_edit.apply",
    "web.search",
    "web.fetch",
    "web.status",
    "web.inspect",
    "git.clone",
    "github.clone",
    "worktree.list",
    "worktree.create",
    "worktree.remove",
    "workflow.execution_context",
    "workflow.contributor_evidence",
    "workflow.stage_delegation",
    "workflow.stage_task_group",
    "workflow.stage_agent_task",
    "workflow.stage_prompt_task",
    "workflow.stage_run_graph_edit",
    "workflow.publish_run_graph_edit",
    "workflow.accept_run_graph_publication",
    "document.extract",
    "ocr.extract",
    "ocr.status",
    "question",
    "ask",
    # Offered by the harness plugin only when an external agent instance is configured.
    "harness.delegate",
    "harness.continue",
    "harness.result",
    "harness.respond",
    "harness.interrupt",
    # Offered by the code review plugin: reads, navigation, review changes and publishing.
    "code_review.list_reviews",
    "code_review.summary",
    "code_review.list_files",
    "code_review.file_diff",
    "code_review.file_content",
    "code_review.list_threads",
    "code_review.pull_request",
    "code_review.navigate",
    "code_review.add_comment",
    "code_review.reply",
    "code_review.resolve_thread",
    "code_review.mark_viewed",
    "code_review.suggest_change",
    "code_review.publish",
]
# These tools mutate only the authenticated active run. Application policy, ownership,
# exact-candidate publication, execution ceilings and downstream tool permissions still apply.
build_preauthorizations = [
    "workflow.stage_delegation",
    "workflow.stage_task_group",
    "workflow.stage_agent_task",
    "workflow.stage_prompt_task",
    "workflow.stage_run_graph_edit",
    "workflow.publish_run_graph_edit",
    "workflow.accept_run_graph_publication",
]
plan_disabled_tools = [
    "workflow.stage_delegation",
    "workflow.stage_task_group",
    "workflow.stage_agent_task",
    "workflow.stage_prompt_task",
    "workflow.stage_run_graph_edit",
    "workflow.publish_run_graph_edit",
    "workflow.accept_run_graph_publication",
    "filesystem.write",
    "filesystem.edit",
    "filesystem.multi_edit",
    "harness.delegate",
    "harness.continue",
    "harness.respond",
    "harness.interrupt",
    "code_review.add_comment",
    "code_review.reply",
    "code_review.resolve_thread",
    "code_review.mark_viewed",
    "code_review.suggest_change",
    "code_review.publish",
]

[runtime]
abi_version  = 5
event_symbol = "bcode_plugin_handle_event_v1"
library      = "libbcode_default_agents_plugin.dylib"
type         = "native"
