[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Default agent profile policy plugin for bcode"
edition     = { workspace = true }
keywords    = ["agent", "bcode", "plugin", "policy"]
license     = { workspace = true }
name        = "bcode_default_agents_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bcode_agent_permissions             = { workspace = true }
bcode_agent_policy                  = { workspace = true }
bcode_agent_profile                 = { workspace = true }
bcode_config                        = { workspace = true }
bcode_plugin_sdk                    = { workspace = true }
bcode_session_models                = { workspace = true }
bcode_shell_command_analysis        = { workspace = true }
bcode_shell_command_analysis_models = { workspace = true }
bcode_tool                          = { workspace = true }
serde                               = { workspace = true, features = ["derive", "std"] }
serde_json                          = { workspace = true }
sha2                                = { workspace = true }
toml                                = { workspace = true }

[features]
# `dynamic-backend`/`dynamic-frontend` are packaging roles: the packager builds one
# component with one of them; workspace builds never select them.
default          = []
dynamic-backend  = []
dynamic-frontend = []
fail-on-warnings = []
