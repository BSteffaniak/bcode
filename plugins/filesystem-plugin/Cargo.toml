[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "filesystem service plugin for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "filesystem", "plugin"]
license     = { workspace = true }
name        = "bcode_filesystem_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bcode_confined_fs = { workspace = true, optional = true }
bcode_filesystem_models = { workspace = true }
bcode_plugin_models = { workspace = true, optional = true }
bcode_plugin_sdk = { workspace = true, optional = true }
bcode_session_models = { workspace = true, optional = true }
bcode_syntax_render = { workspace = true, optional = true }
bcode_tool = { workspace = true, optional = true }
bcode_tui_components = { workspace = true, features = [
    "diff-viewer",
    "source-preview",
    "source-viewer",
    "syntax",
    "tool-card",
], optional = true }
bmux_ipc = { workspace = true, optional = true }
bmux_plugin_sdk = { workspace = true, optional = true }
bmux_tui = { workspace = true, optional = true }
bmux_tui_components = { workspace = true, features = [
    "action-row",
], optional = true }
devicons = { workspace = true, optional = true }
futures = { workspace = true, features = ["executor"], optional = true }
gix-config = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
image = { workspace = true, optional = true }
png = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
sha1_smol = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[features]
default = ["native"]
fail-on-warnings = []
native = [
    "dep:bcode_confined_fs",
    "dep:bcode_plugin_sdk",
    "dep:bcode_session_models",
    "dep:bcode_tool",
    "dep:bmux_ipc",
    "dep:bmux_plugin_sdk",
    "dep:futures",
    "dep:gix-config",
    "dep:hex",
    "dep:ignore",
    "dep:image",
    "dep:png",
    "dep:sha1_smol",
    "dep:sha2",
    "dep:libc",
]
presentation = [
    "dep:bcode_plugin_models",
    "dep:bcode_syntax_render",
    "dep:bcode_tui_components",
    "dep:bmux_tui",
    "dep:bmux_tui_components",
    "dep:devicons",
    "bcode_tui_components/plugin-visual",
]
# Frontend capability for hosts that run the native implementation; it is
# independent of packaging. `presentation` alone stays renderer-only (browser).
tui = ["native", "presentation", "bcode_plugin_sdk/tui"]
# Compatibility alias; frontend capability is independent of packaging.
static-bundled = ["tui"]

[build-dependencies]
bmux_plugin_schema = { workspace = true }

[package.metadata.cargo-machete]
# BPDL code generated by build.rs (via `bmux_plugin_schema`) and included from OUT_DIR
# references `bmux_ipc` and `bmux_plugin_sdk`; machete cannot trace build scripts or OUT_DIR.
ignored = ["bmux_ipc", "bmux_plugin_schema", "bmux_plugin_sdk"]
