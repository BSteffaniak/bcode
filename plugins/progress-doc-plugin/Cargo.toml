[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Progress document workflow plugin for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "progress", "workflow", "plugin"]
license     = { workspace = true }
name        = "bcode_progress_doc_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bcode_plugin_sdk = { workspace = true }
bcode_workflow   = { workspace = true }
serde            = { workspace = true, features = ["derive", "std"] }
serde_json       = { workspace = true }
sha2             = { workspace = true }
tempfile         = { workspace = true }
thiserror        = { workspace = true }

[dev-dependencies]
bcode_plugin = { workspace = true }
toml         = { workspace = true }

[features]
default          = []
fail-on-warnings = []
static-bundled   = []
