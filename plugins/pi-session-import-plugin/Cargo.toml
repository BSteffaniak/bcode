[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Pi session import plugin for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "pi", "session", "import", "plugin"]
license     = { workspace = true }
name        = "bcode_pi_session_import_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bcode_config         = { workspace = true }
bcode_plugin_sdk     = { workspace = true }
bcode_session_import = { workspace = true }
serde                = { workspace = true, features = ["derive", "std"] }
serde_json           = { workspace = true }

[features]
# `dynamic-backend`/`dynamic-frontend` are packaging roles: the packager builds one
# component with one of them; workspace builds never select them.
default          = []
dynamic-backend  = []
dynamic-frontend = []
fail-on-warnings = []
