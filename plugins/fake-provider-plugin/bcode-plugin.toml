id      = "bcode.fake-provider"
name    = "Bcode Fake Model Provider"
version = "0.0.1"

[[services]]
description           = "Push-streamed deterministic model provider turns"
interface_id          = "bcode.model-provider/v3"
invocation_operations = ["native_web_search", "run_turn"]
name                  = "Fake Model Provider v3"

[[services]]
description           = "Deterministic model provider used by tests and smoke flows"
interface_id          = "bcode.model-provider/v2"
invocation_operations = ["native_web_search"]
name                  = "Fake Model Provider"

[[services]]
description           = "Legacy deterministic model provider compatibility surface"
interface_id          = "bcode.model-provider/v1"
invocation_operations = ["native_web_search"]
name                  = "Fake Model Provider v1"

[concurrency]
type = "concurrent"

[runtime]
abi_version  = 3
event_symbol = "bcode_plugin_handle_event_v1"
library      = "libbcode_fake_provider_plugin.dylib"
type         = "native"
