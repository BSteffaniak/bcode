[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Fake model provider plugin for bcode tests and smoke flows"
edition     = { workspace = true }
keywords    = ["bcode", "model", "provider", "plugin"]
license     = { workspace = true }
name        = "bcode_fake_provider_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bcode_model                  = { workspace = true }
bcode_model_provider_runtime = { workspace = true }
bcode_plugin_sdk             = { workspace = true }
bcode_prompt_cache           = { workspace = true, features = ["simulation"] }
bcode_session_models         = { workspace = true }
jsonschema                   = { workspace = true }
serde                        = { workspace = true, features = ["derive", "std"] }
serde_json                   = { workspace = true }
tokio                        = { workspace = true, features = ["sync"] }

[features]
default          = []
fail-on-warnings = []
static-bundled   = []
