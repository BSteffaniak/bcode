[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Fake model provider plugin for bcode tests and smoke flows"
edition     = { workspace = true }
keywords    = ["bcode", "model", "provider", "plugin"]
license     = { workspace = true }
name        = "bcode_fake_provider_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
base64                       = { workspace = true }
bcode_confined_fs            = { workspace = true }
bcode_model                  = { workspace = true }
bcode_model_provider_runtime = { workspace = true }
bcode_plugin_sdk             = { workspace = true }
bcode_prompt_cache           = { workspace = true, features = ["simulation"] }
bcode_provider_auth_models   = { workspace = true }
bcode_session_models         = { workspace = true }
bcode_tool                   = { workspace = true }
bcode_xray                   = { workspace = true }
bcode_xray_models            = { workspace = true }
hex                          = { workspace = true }
image                        = { workspace = true }
jsonschema                   = { workspace = true }
serde                        = { workspace = true, features = ["derive", "std"] }
serde_json                   = { workspace = true }
sha2                         = { workspace = true }
tempfile                     = { workspace = true }
tokio                        = { workspace = true, features = ["sync"] }

[features]
# `dynamic-backend`/`dynamic-frontend` are packaging roles: the packager builds one
# component with one of them; workspace builds never select them.
default          = []
dynamic-backend  = []
dynamic-frontend = []
fail-on-warnings = []
# Process-local script gate and compaction signal controls used by host tests.
script-controls = []
