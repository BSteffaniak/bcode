id      = "bcode.skills"
name    = "Bcode Skills Plugin"
version = "0.0.1"

[[services]]
class        = "service"
description  = "Plugin-owned optional context and skill/tool relevance ordering"
interface_id = "bcode.skills-selection/v1"
name         = "Bounded Advisory Selection"

[[services]]
class        = "service"
description  = "Plugin-owned ranking and budget admission of producer-owned optional evidence"
interface_id = "bcode.context-selection/v1"
name         = "Bounded Evidence Selection"

[[tui_surfaces]]
description = "Plugin-owned available skills UI"
kind        = "skills.list"
title       = "Available Skills"

[[tui_surfaces]]
description = "Plugin-owned active skills UI"
kind        = "skills.active"
title       = "Active Skills"

[runtime]
abi_version  = 5
event_symbol = "bcode_plugin_handle_event_v1"
library      = "libbcode_skills_plugin.dylib"
type         = "native"
