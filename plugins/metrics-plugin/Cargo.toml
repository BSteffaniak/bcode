[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "metrics dashboard plugin for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "metrics", "tui", "plugin"]
license     = { workspace = true }
name        = "bcode_metrics_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bcode_client = { workspace = true }
bcode_command = { workspace = true }
bcode_metrics = { workspace = true }
bcode_plugin_sdk = { workspace = true, features = ["tui"] }
bmux_keyboard = { workspace = true }
bmux_tui = { workspace = true }
bmux_tui_components = { workspace = true, features = [
    "action-row",
    "bar-chart",
    "key-hint-bar",
    "sparkline",
    "tab-bar",
    "table",
] }
clap = { workspace = true, features = ["derive", "std"] }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# `dynamic-backend`/`dynamic-frontend` are packaging roles: the packager builds one
# component with one of them; workspace builds never select them.
default          = []
dynamic-backend  = []
dynamic-frontend = []
fail-on-warnings = []
