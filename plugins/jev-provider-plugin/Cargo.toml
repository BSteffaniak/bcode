[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "TypeSafe Jev judgement model provider plugin for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "jev", "judgement", "provider"]
license     = { workspace = true }
name        = "bcode_jev_provider_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bcode_model                = { workspace = true }
bcode_plugin_sdk           = { workspace = true }
bcode_provider_auth_models = { workspace = true }
bcode_xray                 = { workspace = true }
bcode_xray_models          = { workspace = true }
reqwest                    = { workspace = true }
serde                      = { workspace = true, features = ["derive", "std"] }
serde_json                 = { workspace = true }
tokio                      = { workspace = true, features = ["rt", "time"] }

[features]
# `dynamic-backend`/`dynamic-frontend` are packaging roles: the packager builds one
# component with one of them; workspace builds never select them.
default          = []
dynamic-backend  = []
dynamic-frontend = []
fail-on-warnings = []
