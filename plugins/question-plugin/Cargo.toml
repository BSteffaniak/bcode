[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "interactive question tool plugin for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "question", "tool", "plugin"]
license     = { workspace = true }
name        = "bcode_question_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bcode_plugin_models = { workspace = true, optional = true }
bcode_plugin_sdk = { workspace = true, optional = true }
bcode_tool = { workspace = true }
bcode_tui_components = { workspace = true, features = [
    "tool-card",
], optional = true }
bmux_keyboard = { workspace = true, optional = true }
bmux_text_edit = { workspace = true, optional = true }
bmux_tui = { workspace = true, optional = true }
bmux_tui_components = { workspace = true, features = [
    "action-row",
    "key-hint-bar",
    "text-input-box",
], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["dynamic-export"]
dynamic-export = ["native"]
fail-on-warnings = []
native = ["dep:bcode_plugin_models", "dep:bcode_plugin_sdk"]
presentation = [
    "dep:bcode_plugin_models",
    "dep:bcode_tui_components",
    "bcode_tui_components/transcript-engine",
    "dep:bmux_keyboard",
    "dep:bmux_text_edit",
    "dep:bmux_tui",
    "dep:bmux_tui_components",
]
static-bundled = [
    "native",
    "presentation",
    "bcode_plugin_sdk/tui",
    "dep:bcode_tui_components",
]
