[package]
authors     = { workspace = true }
categories  = ["development-tools", "text-processing"]
description = "Optional Tantivy transcript search provider for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "search", "session", "tantivy", "plugin"]
license     = { workspace = true }
name        = "bcode_tantivy_session_search_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bcode_plugin_sdk     = { workspace = true }
bcode_session_models = { workspace = true }
bcode_session_search = { workspace = true }
hex                  = { workspace = true }
serde                = { workspace = true, features = ["derive", "std"] }
serde_json           = { workspace = true }
sha2                 = { workspace = true }
tantivy              = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# `dynamic-backend`/`dynamic-frontend` are packaging roles: the packager builds one
# component with one of them; workspace builds never select them.
default          = []
dynamic-backend  = []
dynamic-frontend = []
fail-on-warnings = []
