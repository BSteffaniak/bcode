[package]
authors     = { workspace = true }
categories  = ["development-tools", "text-processing"]
description = "Optional Tantivy transcript search provider for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "search", "session", "tantivy", "plugin"]
license     = { workspace = true }
name        = "bcode_tantivy_session_search_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bcode_plugin_sdk     = { workspace = true }
bcode_session_models = { workspace = true }
bcode_session_search = { workspace = true }
serde                = { workspace = true, features = ["derive", "std"] }
serde_json           = { workspace = true }
tantivy              = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default          = []
fail-on-warnings = []
static-bundled   = []
