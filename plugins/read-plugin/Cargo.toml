[package]
authors     = { workspace = true }
categories  = ["command-line-utilities", "text-processing"]
description = "Terminal Markdown reader plugin for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "markdown", "pager", "plugin"]
license     = { workspace = true }
name        = "bcode_read_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bcode_config = { workspace = true, optional = true }
bcode_markdown_render = { workspace = true, optional = true }
bcode_plugin_sdk = { workspace = true }
bmux_keyboard = { workspace = true, optional = true }
bmux_terminal = { workspace = true, optional = true }
bmux_tui = { workspace = true, optional = true, features = ["terminal-io"] }
bmux_tui_components = { workspace = true, optional = true, features = [
    "key-hint-bar",
    "text-view",
] }
clap = { workspace = true, optional = true, features = ["derive", "std"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
bcode_markdown_render = { workspace = true }
insta                 = { workspace = true }
tempfile              = { workspace = true }

[features]
default          = []
fail-on-warnings = []
# Compatibility alias; frontend capability is independent of packaging.
static-bundled = ["tui"]
tui = [
    "dep:bcode_config",
    "bcode_plugin_sdk/tui",
    "dep:bcode_markdown_render",
    "dep:bmux_keyboard",
    "dep:bmux_tui",
    "dep:bmux_tui_components",
    "dep:clap",
    "dep:bmux_terminal",
    "dep:libc",
]
