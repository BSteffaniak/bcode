id      = "bcode.vox"
name    = "Vox Local Dictation"
version = "0.1.0"

[[services]]
description           = "User-only local dictation actions; no model-callable tools"
interface_id          = "bcode.command/v1"
invocation_operations = ["invoke"]
name                  = "Vox User Commands"

[[services]]
description  = "Versioned actions and redacted status; daemon actions fail closed"
interface_id = "bcode.vox.control/v1"
name         = "Vox Local Control"

[concurrency]
type = "exclusive"

[runtime]
abi_version  = 5
event_symbol = "bcode_plugin_handle_event_v1"
library      = "libbcode_vox_plugin.so"
type         = "native"
