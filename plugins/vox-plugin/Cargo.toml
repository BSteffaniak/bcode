[package]
authors.workspace    = true
categories           = ["development-tools"]
description          = "Client-local Vox dictation integration for Bcode"
edition.workspace    = true
keywords             = ["dictation", "speech", "plugin"]
license.workspace    = true
name                 = "bcode_vox_plugin"
readme.workspace     = true
repository.workspace = true
version.workspace    = true

[lib]
crate-type = ["rlib"]

[dependencies]
bcode_command.workspace    = true
bcode_plugin_sdk.workspace = true
bcode_vox.workspace        = true
serde                      = { workspace = true, features = ["derive", "std"] }
serde_json.workspace       = true

[features]
# `dynamic-backend`/`dynamic-frontend` are packaging roles: the packager builds one
# component with one of them; workspace builds never select them.
default          = []
dynamic-backend  = []
dynamic-frontend = []
fail-on-warnings = []
native-dictation = ["bcode_vox/linux-desktop"]
tui              = ["bcode_plugin_sdk/tui"]
