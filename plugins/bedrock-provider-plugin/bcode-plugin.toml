id      = "bcode.bedrock"
name    = "Bcode Bedrock Provider"
version = "0.0.1"

[[services]]
description           = "Push-streamed Amazon Bedrock model provider turns"
interface_id          = "bcode.model-provider/v3"
invocation_operations = ["run_turn"]
name                  = "Amazon Bedrock Model Provider v3"

[[services]]
description  = "Amazon Bedrock Runtime and Mantle model provider"
interface_id = "bcode.model-provider/v2"
name         = "Amazon Bedrock Model Provider"

[[services]]
description  = "Legacy Amazon Bedrock model provider surface"
interface_id = "bcode.model-provider/v1"
name         = "Amazon Bedrock Model Provider v1"

[concurrency]
type = "concurrent"

[runtime]
abi_version  = 3
event_symbol = "bcode_plugin_handle_event_v1"
library      = "libbcode_bedrock_provider_plugin.dylib"
type         = "native"
