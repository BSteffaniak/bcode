description = "Open scoped one-way browser observation for the current session"
id          = "bcode.xray"
name        = "X-ray Inspector"
version     = "0.0.1-alpha.0"

[[services]]
class                 = "control"
description           = "Launch one-way observation for the exact current session"
interface_id          = "bcode.command/v1"
invocation_operations = ["invoke"]
name                  = "X-ray Commands"

[runtime]
abi_version  = 5
event_symbol = "bcode_plugin_handle_event_v1"
library      = "libbcode_xray_plugin.dylib"
type         = "native"
