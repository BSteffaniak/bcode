[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Plugin-owned X-ray observation launch commands"
edition     = { workspace = true }
keywords    = ["bcode", "diagnostics", "observability"]
license     = { workspace = true }
name        = "bcode_xray_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bcode_command        = { workspace = true }
bcode_plugin_sdk     = { workspace = true }
bcode_session_models = { workspace = true }
serde_json           = { workspace = true }

[features]
# `dynamic-backend`/`dynamic-frontend` are packaging roles: the packager builds one
# component with one of them; workspace builds never select them.
default          = []
dynamic-backend  = []
dynamic-frontend = []
fail-on-warnings = []
