[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Git repository access tool plugin for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "git", "repository", "tool", "plugin"]
license     = { workspace = true }
name        = "bcode_git_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bcode_config = { workspace = true }
bcode_git_ui = { workspace = true, optional = true }
bcode_plugin_sdk = { workspace = true, features = ["tui"] }
bcode_tool = { workspace = true }
bcode_tui_components = { workspace = true, features = [
    "tool-card",
], optional = true }
bmux_tui = { workspace = true, optional = true }
clap = { workspace = true, optional = true, features = ["derive", "std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default          = []
fail-on-warnings = []
static-bundled   = ["bcode_tui_components", "bmux_tui"]
# Interactive `bcode git` client. Disable to build bcode without it.
git-ui = ["dep:bcode_git_ui", "dep:clap", "static-bundled"]
