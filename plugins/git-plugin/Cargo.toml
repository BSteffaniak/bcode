[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Git repository access tool plugin for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "git", "repository", "tool", "plugin"]
license     = { workspace = true }
name        = "bcode_git_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bcode_config = { workspace = true }
bcode_forge = { workspace = true, optional = true, features = ["http"] }
bcode_forge_models = { workspace = true }
bcode_git_ui = { workspace = true, optional = true }
bcode_plugin_sdk = { workspace = true }
bcode_tool = { workspace = true }
bcode_tui_components = { workspace = true, features = [
    "tool-card",
], optional = true }
bmux_tui = { workspace = true, optional = true }
clap = { workspace = true, optional = true, features = ["derive", "std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# `dynamic-backend`/`dynamic-frontend` are packaging roles: the packager builds one
# component with one of them; workspace builds never select them.
default          = []
dynamic-backend  = []
dynamic-frontend = []
fail-on-warnings = []
tui              = ["bcode_plugin_sdk/tui", "bcode_tui_components", "bmux_tui"]
# Interactive `bcode git` client. Disable to build bcode without it.
git-ui = ["dep:bcode_forge", "dep:bcode_git_ui", "dep:clap", "tui"]
