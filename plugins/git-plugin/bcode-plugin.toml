id      = "bcode.git"
name    = "Bcode Git Plugin"
version = "0.0.1"

[[services]]
class        = "tool_execution"
description  = "Model-callable Git repository access tools"
interface_id = "bcode.tool/v1"
name         = "Git Tools"

[[services]]
class        = "service"
description  = "Typed mutating Git workflow blocks"
interface_id = "bcode.workflow-block/v1"
name         = "Git Workflow Blocks"

[[services.workflow_blocks]]
block_id               = "git.prepare"
block_version          = 1
cancellation_supported = true
effect                 = "read_only"
operation              = "git.prepare"
plugin_id              = "bcode.git"
reconciliation         = "idempotent_replay"
timeout_ms             = 30000

[services.workflow_blocks.input]
schema = { type = "object", additionalProperties = false, required = [
    "max_paths",
], properties = { include_prefixes = { type = "array", maxItems = 256, uniqueItems = true, items = { type = "string", minLength = 1, maxLength = 4096 } }, exclude_prefixes = { type = "array", maxItems = 256, uniqueItems = true, items = { type = "string", minLength = 1, maxLength = 4096 } }, max_paths = { type = "integer", minimum = 1, maximum = 10000 } } }
type_name = "bcode.git.prepare-request/v1"

[services.workflow_blocks.output]
schema = { type = "object", additionalProperties = false, required = [
    "repository_root",
    "head",
    "changed_paths",
], properties = { repository_root = { type = "string" }, head = { type = "string" }, changed_paths = { type = "array", maxItems = 10000, items = { type = "object", additionalProperties = false, required = [
    "path",
    "status",
], properties = { path = { type = "string" }, status = { type = "string" } } } } } }
type_name = "bcode.git.prepare-result/v1"

[services.workflow_blocks.authorization]
capability              = "read_only"
explicit_grant_required = false

[[services.workflow_blocks.resources]]
access   = "read"
resource = "repository"

[[services.workflow_blocks]]
block_id               = "git.compose-commit"
block_version          = 1
cancellation_supported = true
effect                 = "read_only"
operation              = "git.compose-commit"
plugin_id              = "bcode.git"
reconciliation         = "idempotent_replay"
timeout_ms             = 30000

[services.workflow_blocks.input]
schema = { type = "object", additionalProperties = false, required = [
    "preparation",
    "message",
    "no_changes",
], properties = { preparation = { type = "object", additionalProperties = false, required = [
    "repository_root",
    "head",
    "changed_paths",
], properties = { repository_root = { type = "string" }, head = { type = "string" }, changed_paths = { type = "array", maxItems = 10000, items = { type = "object", additionalProperties = false, required = [
    "path",
    "status",
], properties = { path = { type = "string" }, status = { type = "string" } } } } } }, message = { type = "object", additionalProperties = false, required = [
    "title",
    "description",
], properties = { title = { type = "string", minLength = 1, maxLength = 256 }, description = { type = "string", maxLength = 7935 } } }, no_changes = { enum = [
    "fail",
    "no_op",
] } } }
type_name = "bcode.git.compose-commit-request/v1"

[services.workflow_blocks.output]
schema = { oneOf = [
    { type = "object", additionalProperties = false, required = [
        "status",
        "request",
    ], properties = { status = { const = "ready" }, request = { type = "object", additionalProperties = false, required = [
        "repo_path",
        "expected_head",
        "message",
        "paths",
    ], properties = { repo_path = { type = "string" }, expected_head = { type = "string" }, message = { type = "string" }, paths = { type = "array", minItems = 1, maxItems = 10000, uniqueItems = true, items = { type = "string" } } } } } },
    { type = "object", additionalProperties = false, required = [
        "status",
    ], properties = { status = { const = "no_changes" } } },
] }
type_name = "bcode.git.compose-commit-result/v1"

[services.workflow_blocks.authorization]
capability              = "read_only"
explicit_grant_required = false

[[services.workflow_blocks.resources]]
access   = "read"
resource = "repository"

[[services.workflow_blocks]]
block_id               = "git.commit-status"
block_version          = 1
cancellation_supported = true
effect                 = "read_only"
operation              = "git.commit-status"
plugin_id              = "bcode.git"
reconciliation         = "idempotent_replay"
timeout_ms             = 30000

[services.workflow_blocks.input]
schema = { type = "object", additionalProperties = false, required = [
    "repo_path",
    "expected_head",
    "paths",
], properties = { repo_path = { type = "string" }, expected_head = { type = "string", minLength = 1, maxLength = 256 }, paths = { type = "array", minItems = 1, maxItems = 10000, uniqueItems = true, items = { type = "string" } } } }
type_name = "bcode.git.commit-status-request/v1"

[services.workflow_blocks.output]
schema = { type = "object", additionalProperties = false, required = [
    "expected_head",
    "actual_head",
    "outcome",
    "actual_commit_paths",
    "guidance",
], properties = { expected_head = { type = "string" }, actual_head = { type = "string" }, outcome = { enum = [
    "not_committed",
    "candidate_commit",
    "diverged",
] }, actual_commit_paths = { type = "array", maxItems = 10000, items = { type = "string" } }, guidance = { type = "string" } } }
type_name = "bcode.git.commit-status-result/v1"

[services.workflow_blocks.authorization]
capability              = "read_only"
explicit_grant_required = false

[[services.workflow_blocks.resources]]
access   = "read"
resource = "repository"

[[services.workflow_blocks.resources]]
access   = "read"
resource = "git-ref"

[[services.workflow_blocks]]
block_id               = "git.commit"
block_version          = 1
cancellation_supported = true
effect                 = "mutating"
operation              = "git.commit"
plugin_id              = "bcode.git"
reconciliation         = "repair_required"
timeout_ms             = 30000

[services.workflow_blocks.input]
schema = { type = "object", required = [
    "repo_path",
    "expected_head",
    "message",
    "paths",
], properties = { repo_path = { type = "string" }, expected_head = { type = "string" }, message = { type = "string" }, paths = { type = "array", minItems = 1, uniqueItems = true, items = { type = "string" } } } }
type_name = "bcode.git.commit-request/v1"

[services.workflow_blocks.output]
schema = { type = "object", required = [
    "previous_head",
    "commit_hash",
    "paths",
], properties = { previous_head = { type = "string" }, commit_hash = { type = "string" }, paths = { type = "array", items = { type = "string" } } } }
type_name = "bcode.git.commit-result/v1"

[services.workflow_blocks.authorization]
capability              = "mutating"
explicit_grant_required = true

[[services.workflow_blocks.resources]]
access   = "write"
resource = "repository"

[[services.workflow_blocks.resources]]
access   = "write"
resource = "git-ref"

[[visual_adapters]]
artifact_schema    = "bcode.git.clone_request"
id                 = "git-clone-request-card"
max_schema_version = 1
min_schema_version = 1
priority           = 100
producer_default   = true
render_mode        = "transcript_block"
surfaces           = ["tui"]

[[visual_adapters]]
artifact_schema    = "bcode.git.clone_result"
id                 = "git-clone-result-card"
max_schema_version = 1
min_schema_version = 1
priority           = 100
producer_default   = true
render_mode        = "transcript_block"
surfaces           = ["tui"]

[concurrency]
max  = 2
type = "limited"

[runtime]
abi_version  = 3
event_symbol = "bcode_plugin_handle_event_v1"
library      = "libbcode_git_plugin.dylib"
type         = "native"
