    "version",
    "plan_sha256",
    "passed",
    "commands",
    "artifacts",
], properties = { version = { const = 1 }, plan_sha256 = { type = "string", pattern = "^[0-9a-f]{64}$" }, passed = { type = "boolean" }, commands = { type = "array", maxItems = 64, items = { type = "object", additionalProperties = false, required = [
    "index",
    "status",
    "exit_code",
    "accepted_exit_codes",
    "signal",
    "duration_ms",
    "stdout_preview",
    "stderr_preview",
    "stdout_truncated",
    "stderr_truncated",
], properties = { index = { type = "integer", minimum = 0 }, status = { type = "string", enum = [
    "exited",
    "spawn_failed",
    "timed_out",
    "cancelled",
] }, exit_code = { type = [
    "integer",
    "null",
] }, accepted_exit_codes = { type = "array", minItems = 1, maxItems = 32, uniqueItems = true, items = { type = "integer" } }, signal = { type = [
    "integer",
    "null",
] }, duration_ms = { type = "integer", minimum = 0 }, stdout_preview = { type = "string", maxLength = 65536 }, stderr_preview = { type = "string", maxLength = 65536 }, stdout_truncated = { type = "boolean" }, stderr_truncated = { type = "boolean" } } } }, artifacts = { type = "array", items = { type = "object", required = [
    "artifact_id",
    "schema",
    "schema_version",
    "content_type",
    "reference_key",
] } } } }
type_name = "bcode.shell.command-plan-result/v1"

[services.workflow_blocks.authorization]
capability              = "mutating"
explicit_grant_required = true

[[services.workflow_blocks.resources]]
