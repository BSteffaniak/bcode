id      = "bcode.shell"
name    = "Bcode Shell Plugin"
version = "0.0.1"

[[services]]
class        = "service"
description  = "Typed procedural shell workflow blocks"
interface_id = "bcode.workflow-block/v1"
name         = "Shell Workflow Blocks"

[[services.workflow_authoring_actions]]
action_key     = "run"
action_version = 1
plugin_id      = "bcode.shell"
target_block   = "bcode.shell/exec@1"
version        = 1

[services.workflow_authoring_actions.input]
schema = { oneOf = [
    { type = "string", minLength = 1, maxLength = 65536 },
    { type = "object", additionalProperties = false, required = [
        "script",
    ], properties = { version = { const = 1 }, script = { type = "string", minLength = 1, maxLength = 65536 }, shell = { type = "array", minItems = 1, maxItems = 32, items = { type = "string", maxLength = 4096 } }, cwd = { type = "string", minLength = 1, maxLength = 1024 }, environment = { type = "object", maxProperties = 128, additionalProperties = { type = "string", maxLength = 65536 } }, timeout_ms = { type = "integer", minimum = 1, maximum = 300000 }, accepted_exit_codes = { type = "array", minItems = 1, maxItems = 64, uniqueItems = true, items = { type = "integer" } }, continue_on_unaccepted_exit = { type = "boolean" }, output = { type = "object", additionalProperties = false, properties = { preview_bytes = { type = "integer", minimum = 0, maximum = 65536 }, artifact_spill = { type = "boolean" } } } } },
] }
type_name = "bcode.shell.exec/v1"

[[services.workflow_blocks]]
block_id               = "exec"
block_version          = 1
cancellation_supported = true
effect                 = "mutating"
operation              = "exec"
plugin_id              = "bcode.shell"
preparation_required   = true
reconciliation         = "repair_required"
timeout_ms             = 300000

[services.workflow_blocks.input]
schema = { "x-bcode-allow-dynamic-complete-input" = false, "x-bcode-dynamic-binding-paths" = [
    "commands.*.argv.*",
    "environment.set.*",
], oneOf = [
    { oneOf = [
        { type = "string", minLength = 1, maxLength = 65536 },
        { type = "object", additionalProperties = false, required = [
            "script",
        ], properties = { version = { const = 1 }, script = { type = "string", minLength = 1, maxLength = 65536 }, shell = { type = "array", minItems = 1, maxItems = 32, items = { type = "string", maxLength = 4096 } }, cwd = { type = "string", minLength = 1, maxLength = 1024 }, environment = { type = "object", maxProperties = 128, additionalProperties = { type = "string", maxLength = 65536 } }, timeout_ms = { type = "integer", minimum = 1, maximum = 300000 }, accepted_exit_codes = { type = "array", minItems = 1, maxItems = 64, uniqueItems = true, items = { type = "integer" } }, continue_on_unaccepted_exit = { type = "boolean" }, output = { type = "object", additionalProperties = false, properties = { preview_bytes = { type = "integer", minimum = 0, maximum = 65536 }, artifact_spill = { type = "boolean" } } } } },
    ] },
    { type = "object", additionalProperties = false, required = [
        "version",
        "cwd",
        "commands",
        "environment",
        "output",
    ], properties = { version = { const = 2 }, repository_target = { type = "object", additionalProperties = false, required = [
        "version",
        "commit",
    ], properties = { version = { const = 1 }, commit = { type = "string", pattern = "^([0-9a-f]{40}|[0-9a-f]{64})$" } } }, delivered_snapshot = { type = "object", additionalProperties = false, required = [
        "version",
        "files",
    ], properties = { version = { const = 1 }, files = { type = "object", minProperties = 1, maxProperties = 64, additionalProperties = { type = "string", maxLength = 262144 } } } }, expected_content = { type = "object", additionalProperties = false, required = [
        "version",
        "workspace",
        "files",
    ], properties = { version = { enum = [
        1,
        2,
    ] }, workspace = { type = "string", minLength = 1, maxLength = 4096 }, files = { type = "array", maxItems = 64, items = { type = "object", additionalProperties = false, required = [
        "path",
        "sha256",
    ], properties = { path = { type = "string", minLength = 1, maxLength = 4096 }, sha256 = { type = "string", pattern = "^[0-9a-f]{64}$" } } } }, directories = { type = "array", maxItems = 64, uniqueItems = true, items = { type = "string", minLength = 1, maxLength = 4096 } } } }, observe_files = { type = "array", maxItems = 64, uniqueItems = true, items = { type = "string", minLength = 1, maxLength = 4096 } }, cwd = { type = "string", minLength = 1, maxLength = 1024 }, commands = { type = "array", minItems = 0, maxItems = 64, items = { type = "object", additionalProperties = false, required = [
        "argv",
        "timeout_ms",
    ], properties = { argv = { type = "array", minItems = 1, maxItems = 256, items = { type = "string", maxLength = 65536 } }, timeout_ms = { type = "integer", minimum = 1, maximum = 300000 }, accepted_exit_codes = { type = "array", minItems = 1, maxItems = 64, uniqueItems = true, items = { type = "integer" } }, continue_on_unaccepted_exit = { type = "boolean" } } } }, environment = { type = "object", additionalProperties = false, required = [
        "inherit",
        "set",
    ], properties = { inherit = { type = "boolean" }, set = { type = "object", maxProperties = 128, additionalProperties = { type = "string", maxLength = 65536 } } } }, output = { type = "object", additionalProperties = false, required = [
        "preview_bytes",
        "artifact_spill",
    ], properties = { preview_bytes = { type = "integer", minimum = 0, maximum = 65536 }, artifact_spill = { type = "boolean" } } } } },
] }
type_name = "bcode.shell.exec/v1"

[services.workflow_blocks.output]
schema = { "$defs" = { content_observation = { type = "object", allOf = [
    { if = { properties = { version = { const = 1 } } }, then = { not = { required = [
        "directories",
    ] }, properties = { files = { minItems = 1 } } }, else = { required = [
        "directories",
    ] } },
], additionalProperties = false, required = [
    "version",
    "workspace",
    "files",
], properties = { version = { enum = [
    1,
    2,
] }, workspace = { type = "string" }, directories = { type = "array", minItems = 1, maxItems = 64, uniqueItems = true, items = { type = "string", minLength = 1, maxLength = 4096 } }, files = { type = "array", maxItems = 64, items = { type = "object", additionalProperties = false, required = [
    "path",
    "sha256",
], properties = { path = { type = "string", minLength = 1, maxLength = 4096 }, sha256 = { type = "string", pattern = "^[0-9a-f]{64}$" } } } } } } }, type = "object", additionalProperties = false, required = [
    "version",
    "plan_sha256",
    "passed",
    "commands",
    "artifacts",
], properties = { repository_verification = { type = "object", additionalProperties = false, required = [
    "version",
    "delivery",
    "commands_passed",
    "sources_unchanged",
    "environment",
], properties = { version = { const = 1 }, commands_passed = { type = "boolean" }, sources_unchanged = { type = "boolean" }, environment = { type = "string", maxLength = 4096 }, delivery = { type = "object", additionalProperties = false, required = [
    "target",
    "artifact",
    "sha256",
], properties = { target = { type = "object", additionalProperties = false, required = [
    "version",
    "commit",
], properties = { version = { const = 1 }, commit = { type = "string", pattern = "^([0-9a-f]{40}|[0-9a-f]{64})$" } } }, artifact = { type = "string", minLength = 1, maxLength = 4096 }, sha256 = { type = "string", pattern = "^[0-9a-f]{64}$" } } } } }, snapshot_verification = { type = "object", additionalProperties = false, required = [
    "version",
    "target",
    "commands_passed",
    "target_unchanged",
], properties = { version = { const = 1 }, commands_passed = { type = "boolean" }, target_unchanged = { type = "boolean" }, target = { type = "object", additionalProperties = false, required = [
    "version",
    "files",
], properties = { version = { const = 1 }, files = { type = "object", minProperties = 1, maxProperties = 64, additionalProperties = { type = "string", maxLength = 262144 } } } } } }, content_before = { "$ref" = "#/$defs/content_observation" }, content_after = { "$ref" = "#/$defs/content_observation" }, version = { const = 2 }, plan_sha256 = { type = "string", pattern = "^[0-9a-f]{64}$" }, passed = { type = "boolean" }, commands = { type = "array", maxItems = 64, items = { type = "object", additionalProperties = false, required = [
    "index",
    "status",
    "exit_code",
    "accepted_exit_codes",
    "exit_accepted",
    "signal",
    "duration_ms",
    "stdout_preview",
    "stderr_preview",
    "stdout_bytes",
    "stderr_bytes",
    "stdout_encoding",
    "stderr_encoding",
    "stdout_truncated",
    "stderr_truncated",
], properties = { index = { type = "integer", minimum = 0 }, status = { type = "string", enum = [
    "exited",
    "signaled",
    "spawn_failed",
    "timed_out",
    "cancelled",
] }, exit_code = { type = [
    "integer",
    "null",
] }, accepted_exit_codes = { type = "array", minItems = 1, maxItems = 64, uniqueItems = true, items = { type = "integer" } }, exit_accepted = { type = "boolean" }, signal = { type = [
    "integer",
    "null",
] }, duration_ms = { type = "integer", minimum = 0 }, stdout_preview = { type = "string", maxLength = 65536 }, stderr_preview = { type = "string", maxLength = 65536 }, stdout_bytes = { type = "integer", minimum = 0 }, stderr_bytes = { type = "integer", minimum = 0 }, stdout_encoding = { type = "string", enum = [
    "utf8",
    "binary",
] }, stderr_encoding = { type = "string", enum = [
    "utf8",
    "binary",
] }, stdout_truncated = { type = "boolean" }, stderr_truncated = { type = "boolean" } } } }, artifacts = { type = "array", items = { type = "object", required = [
    "artifact_id",
    "schema",
    "schema_version",
    "content_type",
    "reference_key",
] } } } }
type_name = "bcode.shell.exec-result/v1"

[services.workflow_blocks.authorization]
capability              = "mutating"
explicit_grant_required = true

[[services.workflow_blocks.resources]]
access   = "write"
resource = "repository"
[[services]]
class        = "tool_execution"
description  = "Permissioned model-callable shell execution tools"
interface_id = "bcode.tool/v1"
name         = "Shell Tools"

[[tool_presentations]]
request_draft_schema         = "bcode.tool.request.shell.run"
request_draft_schema_version = 1
request_schema               = "bcode.tool.request.shell.run"
request_schema_version       = 1
tool_name                    = "shell.run"

[[visual_adapters]]
artifact_schema    = "bcode.tool.request.shell.run"
id                 = "shell-run-request-card"
max_schema_version = 1
min_schema_version = 1
priority           = 100
producer_default   = true
render_mode        = "transcript_block"
surfaces           = ["tui"]

[[visual_adapters]]
artifact_schema    = "bcode.shell.run"
id                 = "shell-run-terminal-card"
max_schema_version = 1
min_schema_version = 1
priority           = 100
producer_default   = true
render_mode        = "transcript_block"
surfaces           = ["tui"]

[concurrency]
type = "concurrent"

[runtime]
abi_version  = 5
event_symbol = "bcode_plugin_handle_event_v1"
library      = "libbcode_shell_plugin.dylib"
type         = "native"
