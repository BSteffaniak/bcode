[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "model command palette plugin for bcode"
edition     = { workspace = true }
keywords    = ["bcode", "model", "runtime", "command", "plugin"]
license     = { workspace = true }
name        = "bcode_model_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bcode_command              = { workspace = true }
bcode_config               = { workspace = true }
bcode_plugin               = { workspace = true }
bcode_plugin_sdk           = { workspace = true, features = ["tui"] }
bcode_provider_auth_models = { workspace = true }
bcode_tool                 = { workspace = true }
bcode_workflow             = { workspace = true }
bmux_keyboard              = { workspace = true }
bmux_tui                   = { workspace = true }
bmux_tui_components        = { workspace = true, features = ["pane", "text-view"] }
serde                      = { workspace = true }
serde_json                 = { workspace = true }

[dev-dependencies]
toml = { workspace = true }

[features]
# `dynamic-backend`/`dynamic-frontend` are packaging roles: the packager builds one
# component with one of them; workspace builds never select them.
default          = []
dynamic-backend  = []
dynamic-frontend = []
fail-on-warnings = []
