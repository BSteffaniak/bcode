categories = ["usage"]
id         = "bcode.usage"
name       = "Bcode Usage Plugin"
version    = "0.0.1"

[[services]]
class        = "service"
description  = "Usage dashboard command contributions"
interface_id = "bcode.command/v1"
name         = "Usage Commands"

[[tui_surfaces]]
description = "Estimated model usage costs and comparisons"
kind        = "usage-dashboard"
title       = "Usage"

[runtime]
abi_version  = 4
event_symbol = "bcode_plugin_handle_event_v1"
library      = "libbcode_usage_plugin.dylib"
type         = "native"
