[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Usage dashboard plugin for Bcode"
edition     = { workspace = true }
keywords    = ["bcode", "usage", "tui", "plugin"]
license     = { workspace = true }
name        = "bcode_usage_plugin"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bcode_client = { workspace = true }
bcode_command = { workspace = true }
bcode_plugin_sdk = { workspace = true, features = ["tui"] }
bcode_session_models = { workspace = true }
bcode_usage = { workspace = true }
bcode_usage_models = { workspace = true }
bmux_keyboard = { workspace = true }
bmux_tui = { workspace = true }
bmux_tui_components = { workspace = true, features = [
    "bar-chart",
    "chart",
    "text-input",
    "table",
] }
clap = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }

[features]
default          = []
fail-on-warnings = []
static-bundled   = []
